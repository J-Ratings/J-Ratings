  <meta charset="utf-8">

  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    #compare-chart { height: 500px; }

    .toolbar {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .flag-cell {
      text-align: center;
      vertical-align: middle;
    }

    .flag-icon {
      width: 39.93px;
      height: 29.04px;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    #compare-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #compare-modal > div {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 80%;
      overflow: auto;
      color: #fff;
    }

    .compare-controls { margin: 10px 0; }
    .compare-controls button { margin-right: 10px; }

    @media (max-width: 520px) {
      #players {
        width: 100%;
        table-layout: fixed;
      }

      #players th,
      #players td {
        min-width: 0 !important;
        padding: 10px 8px;
      }

      #players th:nth-child(1),
      #players td:nth-child(1) { width: 52px; }

      #players th:nth-child(2),
      #players td:nth-child(2) { width: 44px; }

      #players th:nth-child(4),
      #players td:nth-child(4) { width: 78px; }

      #players th:nth-child(5),
      #players td:nth-child(5) { width: 92px; }

      #players th:nth-child(3),
      #players td:nth-child(3) { width: auto; }

      #players td:nth-child(3) a {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
  </style>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="../index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-go">Go</span></span>
        <img src="../../Go Banner Logo.png" alt="Go logo" class="sport-logo">
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="../../index.html">Sports</a>
      <a href="../home">Home</a>
      <a href="../compare/">Compare</a>
      <a href="index.html" class="active-tab">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="players-panel">
    <h2>Peak ratings</h2>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by name…">
      <span id="count" class="muted"></span>

      <button id="compare-btn" class="club-btn" type="button" style="margin-left:auto">Compare</button>
    </div>

    <div id="compare-wrap" style="display:none; padding:16px">
      <div id="compare-chart">Loading…</div>
    </div>

    <div class="table-wrap">
      <table id="players">
        <thead>
          <tr>
            <th style="min-width:60px">Rank</th>
            <th style="min-width:56px">Country</th>
            <th style="min-width:240px">Player</th>
            <th class="right" style="min-width:120px">Peak</th>
            <th style="min-width:140px">Peak Date</th>
          </tr>
        </thead>
        <tbody><!-- filled by JS --></tbody>
      </table>
    </div>

    <div style="padding:16px; text-align:center;">
      <button id="show-more-btn" class="club-btn" type="button" style="display:none;">
        Show More
      </button>
    </div>
  </section>
</main>

<!-- Compare Selection Modal -->
<div id="compare-modal">
  <div>
    <h3>Select players to view:</h3>
    <div class="compare-controls">
      <button id="compare-show-top">Show Selected</button>
      <button id="compare-cancel-top">Cancel</button>
    </div>
    <div id="compare-list" style="margin:10px 0 20px 0;"></div>
    <div class="compare-controls">
      <button id="compare-show-bottom">Show Selected</button>
      <button id="compare-cancel-bottom">Cancel</button>
    </div>
  </div>
</div>

<script>
  const DATA_URL = '../data/players.json';
  const FLAGS_BASE = '../../flags';
  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;
  const PAGE_SIZE = 100;

  const state = {
    rows: [],
    filtered: [],
    visibleCount: PAGE_SIZE
  };

  const histCache = new Map();
  let lastCompared = [];

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normaliseFlagCode(code) {
    return String(code || '').trim().toLowerCase();
  }

  function flagImgHtml(flagCode, label) {
    const code = normaliseFlagCode(flagCode);
    if (!code) return '';
    const safeLabel = escapeHtml(label || '');
    return `<img src="${FLAGS_BASE}/${encodeURIComponent(code)}.svg" alt="${safeLabel}" title="${safeLabel}" class="flag-icon" loading="lazy">`;
  }

  function render() {
    const tbody = document.querySelector('#players tbody');
    const showMoreBtn = document.getElementById('show-more-btn');

    tbody.innerHTML = '';

    const visibleRows = state.filtered.slice(0, state.visibleCount);

    visibleRows.forEach((r, i) => {
      const tr = document.createElement('tr');

      const tdRank = document.createElement('td');
      tdRank.textContent = i + 1;
      tr.appendChild(tdRank);

      const tdFlag = document.createElement('td');
      tdFlag.className = 'flag-cell';
      tdFlag.innerHTML = flagImgHtml(r.flag, r.name);
      tr.appendChild(tdFlag);

      const tdName = document.createElement('td');
      const a = document.createElement('a');
      a.href = `../player/?id=${encodeURIComponent(r.id)}`;
      a.textContent = r.name;
      tdName.appendChild(a);
      tr.appendChild(tdName);

      const tdPeak = document.createElement('td');
      tdPeak.className = 'right';
      tdPeak.textContent = Number.isFinite(+r.peak) ? Math.round(+r.peak) : '';
      tr.appendChild(tdPeak);

      const tdDate = document.createElement('td');
      tdDate.textContent = r.peak_date || '';
      tr.appendChild(tdDate);

      tbody.appendChild(tr);
    });

    const countEl = document.getElementById('count');
    if (countEl) {
      countEl.textContent = state.filtered.length ? `${state.filtered.length} players` : '';
    }

    if (showMoreBtn) {
      showMoreBtn.style.display = state.visibleCount < state.filtered.length ? 'inline-block' : 'none';
    }
  }

  function hideCompare() {
    document.getElementById('compare-wrap').style.display = 'none';
    document.getElementById('compare-chart').innerHTML = '';
    lastCompared = [];
  }

  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();

    state.filtered = q
      ? state.rows.filter(r => r.name.toLowerCase().includes(q))
      : state.rows.slice();

    state.visibleCount = PAGE_SIZE;
    render();
    hideCompare();
  }

  async function fetchHistoryFor(id) {
    if (histCache.has(id)) return histCache.get(id);

    try {
      const res = await fetch(`../data/history/${encodeURIComponent(id)}.json`, { cache: 'no-cache' });
      if (!res.ok) return null;
      const rows = await res.json();
      histCache.set(id, rows);
      return rows;
    } catch {
      return null;
    }
  }

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({ x: p.x, y: +p.y }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;

    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;

      lastKey = key;
    }

    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);

    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;

      (buckets[key] ||= []).push(p.y);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const ys = buckets[k].filter(Number.isFinite);
      const avg = ys.reduce((a, b) => a + b, 0) / ys.length;
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg };
    });

    return normalise(out, false);
  }

  async function buildComparison(players) {
    lastCompared = players.slice();

    const wrap = document.getElementById('compare-wrap');
    const chart = document.getElementById('compare-chart');

    wrap.style.display = 'block';
    chart.innerHTML = 'Loading…';

    const mode = 'monthly';

    const traces = [];
    let ymin = Infinity;
    let ymax = -Infinity;

    for (const p of players) {
      const hist = await fetchHistoryFor(p.id);
      if (!hist || !hist.length) continue;

      const raw = hist.map(d => ({ x: d.date, y: Number(d.rating) }));
      const data = aggregate(raw, mode);

      const xs = data.map(pt => pt.x);
      const ys = data.map(pt => pt.y);
      if (!xs.length || !ys.length) continue;

      ymin = Math.min(ymin, ...ys);
      ymax = Math.max(ymax, ...ys);

      traces.push({
        type: 'scatter',
        name: p.name,
        x: xs,
        y: ys,
        mode: (mode === 'daily') ? 'lines' : 'lines+markers',
        line: { width: 2, shape: 'linear' },
        marker: (mode === 'daily') ? { size: 0 } : { size: 4 },
        hovertemplate: '%{x}<br>%{y:.0f}<extra>' + p.name + '</extra>',
        connectgaps: true
      });
    }

    if (!traces.length) {
      chart.innerHTML = 'No history found.';
      return;
    }

    ymin = Math.floor(ymin / 100) * 100;
    ymax = Math.ceil(ymax / 100) * 100;

    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper',
        x0: 0, x1: 1,
        y0: v, y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }

    const cs = getComputedStyle(document.body);
    const layout = {
      margin: { l: 50, r: 20, t: 10, b: 40 },
      xaxis: { type: 'date' },
      yaxis: { title: 'Rating' },
      legend: { orientation: 'h' },
      paper_bgcolor: cs.backgroundColor,
      plot_bgcolor: cs.backgroundColor,
      font: { color: cs.color },
      shapes
    };

    Plotly.newPlot(chart, traces, layout, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function setupCompareButton() {
    const modal = document.getElementById('compare-modal');
    const listDiv = document.getElementById('compare-list');

    function openModal() {
      listDiv.innerHTML = '';

      state.filtered.forEach(p => {
        const id = `chk-${p.id}`;
        const row = document.createElement('div');
        row.innerHTML = `
          <label>
            <input type="checkbox" id="${id}" value="${p.id}" style="margin-right:6px">
            ${escapeHtml(p.name)} (${Math.round(p.peak)})
          </label>
        `;
        listDiv.appendChild(row);
      });

      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function showSelected() {
      const ids = Array.from(listDiv.querySelectorAll('input:checked')).map(cb => cb.value);
      if (!ids.length) {
        alert('Please select at least one player.');
        return;
      }

      closeModal();

      const chosen = state.filtered.filter(p => ids.includes(String(p.id)));
      buildComparison(chosen);
    }

    document.getElementById('compare-btn').addEventListener('click', openModal);
    document.getElementById('compare-show-top').addEventListener('click', showSelected);
    document.getElementById('compare-show-bottom').addEventListener('click', showSelected);
    document.getElementById('compare-cancel-top').addEventListener('click', closeModal);
    document.getElementById('compare-cancel-bottom').addEventListener('click', closeModal);
  }

  async function load() {
    try {
      const res = await fetch(DATA_URL, { cache: 'no-cache' });
      if (!res.ok) throw new Error('Failed to load players.json');

      const data = await res.json();

      state.rows = (Array.isArray(data) ? data : [])
        .filter(d => d && d.id && d.name && Number.isFinite(+d.peak))
        .map(d => ({
          id: String(d.id),
          name: d.name,
          flag: d.flag || '',
          peak: +d.peak,
          peak_date: d.peak_date || ''
        }))
        .sort((a, b) => b.peak - a.peak || a.name.localeCompare(b.name));

      state.filtered = state.rows.slice();
      state.visibleCount = PAGE_SIZE;
      render();
    } catch (err) {
      document.querySelector('#players tbody').innerHTML =
        `<tr><td colspan="5">Error loading data: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  document.getElementById('q').addEventListener('input', applyFilter);

  document.getElementById('show-more-btn').addEventListener('click', () => {
    state.visibleCount += PAGE_SIZE;
    render();
  });

  setupCompareButton();
  load();
</script>
</body>
</html>
