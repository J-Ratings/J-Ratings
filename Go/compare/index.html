<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JXCC4EDPY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1JXCC4EDPY');
  </script>

  <meta charset="utf-8">
  <title>J-Ratings: Go</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="../../jratings-graph.js"></script>

  <style>
    .controls{
      width:min(900px, 92%);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:18px;
      padding:28px 24px 24px;
      border-bottom:1px solid var(--border);
    }

    #rows{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      width:100%;
    }

    .row input[type="text"]{
      flex:1;
      min-width:220px;
      padding:13px 14px;
      border-radius:9px;
      border:1px solid var(--border);
      background:#0f1623;
      color:var(--text);
      font-size:1.05rem;
    }

    .btn{
      background:#0f1623;
      border:1px solid var(--border);
      color:var(--text);
      padding:11px 16px;
      border-radius:8px;
      cursor:pointer;
      font-size:1.05rem;
    }

    .btn:hover{
      background:rgba(255,255,255,.05);
    }

    .compare-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .jr-chart-controls{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
      padding-top:2px;
    }

    .jr-chart-controls label{
      font-size:1.05rem;
    }

    .jr-chart-controls select{
      font-size:1.05rem;
      padding:10px 12px;
    }

    .range-buttons{
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .range-buttons .seg{
      font-size:1rem;
      padding:9px 12px;
    }

    #chart{
      width:min(1200px, 96%);
      margin:0 auto;
    }

    @media (max-width:700px){
      .controls{
        width:100%;
        padding:18px 14px;
        gap:14px;
      }

      .row{
        gap:8px;
      }

      .row input[type="text"]{
        min-width:0;
        padding:10px;
        font-size:1rem;
      }

      .btn{
        padding:9px 12px;
        font-size:1rem;
      }

      .jr-chart-controls{
        justify-content:flex-start;
      }

      .range-buttons{
        justify-content:flex-start;
      }
    }

    .suggest{
      position:relative;
      flex:1;
    }

    .suggest-list{
      position:absolute;
      left:0;
      right:0;
      top:100%;
      max-height:220px;
      overflow:auto;
      margin-top:4px;
      border:1px solid var(--border);
      background:#0f1623;
      border-radius:6px;
      display:none;
      z-index:20;
    }

    .suggest-item{
      padding:8px 10px;
      cursor:pointer;
    }

    .suggest-item:hover{
      background:rgba(255,255,255,.05);
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="../home/index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-go">Go</span></span>
        <img src="../../Go Banner Logo.png" alt="Go logo" class="sport-logo">
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="../../index.html">Sports</a>
      <a href="../home/">Home</a>
      <a href="index.html" class="active-tab">Compare</a>
      <a href="../peak/">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2>Compare</h2>

    <div class="controls">
      <div id="rows"></div>

      <div class="compare-actions">
        <button id="add" class="btn" type="button">Add player</button>
        <button id="create" class="btn" type="button">Create</button>
        <button id="clear" class="btn" type="button">Clear</button>
      </div>

      <div class="jr-chart-controls">
        <div>
          <label for="agg">View:</label>
          <select id="agg">
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>

        <div class="range-buttons">
          <button type="button" class="seg" data-range="ALL">ALL</button>
          <button type="button" class="seg" data-range="2000">2000–Present</button>
          <button type="button" class="seg" data-range="2020">2020–Present</button>
          <button type="button" class="seg" data-range="LY">Last Year</button>
          <button type="button" class="seg" data-range="YTD">YTD</button>
        </div>
      </div>

    </div>

    <div style="padding:24px 16px 28px">
      <div id="chart" class="jr-chart">No players selected.</div>
    </div>
  </section>
</main>

<script>
const PLAYERS_URL = '../data/players.json';
const HIST_URL    = id => `../data/history/${encodeURIComponent(id)}.json`;
const MAX_PLAYERS = 15;

const state = {
  players: [],
  inputs: [],
  loaded: []
};

let compareChart = null;
let comparedPlayers = [];

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function attachAutocomplete(input) {
  const wrap = document.createElement('div');
  wrap.className = 'suggest';

  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);

  const list = document.createElement('div');
  list.className = 'suggest-list';
  wrap.appendChild(list);

  function render(items) {
    if (!items.length) {
      list.style.display = 'none';
      list.innerHTML = '';
      return;
    }

    list.innerHTML = items
      .map(n => `<div class="suggest-item" data-name="${escapeHtml(n)}">${escapeHtml(n)}</div>`)
      .join('');

    list.style.display = 'block';
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();

    if (!q) {
      render([]);
      return;
    }

    const names = state.players.map(p => p.name || p.display_name || p.id);

    const starts = names.filter(n =>
      n.toLowerCase().startsWith(q)
    );

    const contains = names.filter(n =>
      !n.toLowerCase().startsWith(q) &&
      n.toLowerCase().includes(q)
    );

    render(starts.concat(contains).slice(0, 12));
  });

  list.addEventListener('mousedown', e => {
    const item = e.target.closest('.suggest-item');

    if (!item) return;

    input.value = item.dataset.name;
    list.style.display = 'none';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = list.querySelector('.suggest-item');

      if (first) {
        input.value = first.dataset.name;
        list.style.display = 'none';
      } else if (input.value.trim()) {
        createChart();
      }
    }

    if (e.key === 'Escape') {
      list.style.display = 'none';
    }
  });

  input.addEventListener('blur', () => {
    setTimeout(() => {
      list.style.display = 'none';
    }, 120);
  });
}

function makeRow() {
  if (state.inputs.length >= MAX_PLAYERS) return;

  const rows = document.getElementById('rows');

  const wrap = document.createElement('div');
  wrap.className = 'row';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Search player…';

  wrap.appendChild(input);
  attachAutocomplete(input);

  const remove = document.createElement('button');
  remove.className = 'btn';
  remove.type = 'button';
  remove.textContent = 'Remove';

  remove.addEventListener('click', () => {
    rows.removeChild(wrap);

    state.inputs = state.inputs.filter(r => r.el !== wrap);

    document.getElementById('add').disabled =
      state.inputs.length >= MAX_PLAYERS;
  });

  wrap.appendChild(remove);
  rows.appendChild(wrap);

  state.inputs.push({ el: wrap, input });

  document.getElementById('add').disabled =
    state.inputs.length >= MAX_PLAYERS;
}

function clearAll() {
  document.getElementById('rows').innerHTML = '';

  state.inputs = [];
  state.loaded = [];
  comparedPlayers = [];

  document.getElementById('add').disabled = false;
  document.getElementById('chart').innerHTML = 'Cleared.';

  makeRow();
}

async function loadPlayers() {
  const res = await fetch(PLAYERS_URL, { cache: 'no-cache' });

  if (!res.ok) throw new Error('players.json not found');

  state.players = await res.json();
}

async function createChart() {
  const names = state.inputs
    .map(r => r.input.value.trim())
    .filter(Boolean);

  const uniq = [...new Set(names)];

  if (!uniq.length) {
    alert('Please add at least one player');
    return;
  }

  const lookups = uniq.map(name => {
    const player = state.players.find(p =>
      p.name === name ||
      p.display_name === name ||
      p.id === name
    );

    if (!player) return null;

    return {
      name: player.display_name || player.name || player.id,
      id: player.id
    };
  }).filter(Boolean);

  if (!lookups.length) {
    document.getElementById('chart').textContent = 'No valid players.';
    return;
  }

  document.getElementById('chart').textContent = 'Loading…';

  const results = await Promise.all(lookups.map(async ({ name, id }) => {
    const res = await fetch(HIST_URL(id), { cache: 'no-cache' });

    if (!res.ok) return null;

    const hist = await res.json();

    const daily = JRGraph.normalise(
      hist.map(d => ({
        x: d.date,
        y: Number(d.rating),
        tournament: d.tournament || d.event || ''
      })),
      true
    );

    if (!daily.length) return null;

    return { name, daily };
  }));

  state.loaded = results.filter(Boolean);

  comparedPlayers = state.loaded.map(item => ({
    name: item.name,
    raw: item.daily,
    customData: p => p.tournament || '',
    hovertemplate:
      '%{x|%d %b %Y}<br>%{y:.0f} Rating<extra>' +
      item.name +
      '</extra>'
  }));

  compareChart.render(comparedPlayers);
}

window.addEventListener('DOMContentLoaded', () => {
  compareChart = JRGraph.createChart({
    chartId: 'chart',
    aggId: 'agg',
    controlsEl: document.querySelector('.panel'),
    defaultRange: '2020',
    getItems: () => comparedPlayers
  });

  document.getElementById('add').addEventListener('click', makeRow);
  document.getElementById('clear').addEventListener('click', clearAll);
  document.getElementById('create').addEventListener('click', createChart);

  loadPlayers()
    .then(() => {
      makeRow();
    })
    .catch(e => {
      console.error(e);

      const note = document.querySelector('.muted-note');

      if (note) {
        note.textContent =
          'Could not load player list. Check data path or run via a local server.';
      }

      makeRow();
    });
});
</script>
</body>
</html>
