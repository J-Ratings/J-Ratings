<body>

<script>
/* ---------- constants ---------- */
const params = new URLSearchParams(location.search);
const idRaw = params.get('id');

if (!idRaw) {
  document.getElementById('chart').textContent = 'Missing player id.';
  throw new Error('no id');
}

const PLAYERS_URL = '../data/players.json';
const HIST_URL    = id => `../data/history/${encodeURIComponent(id)}.json`;
const GAMES_URL   = id => `../data/games/${encodeURIComponent(id)}.json`;

/* ---------- state ---------- */
let RAW = [];
let seriesLive = [];
let dataMin = null;
let dataMax = null;
let initialRangeApplied = false;
let rememberedXRange = null;
let activeRangeKey = '2020';
let LOAD_TOKEN = 0;

/* ---------- helpers ---------- */
const iso = d => new Date(d).toISOString().slice(0, 10);

function normalise(series, dedupeByDay = false) {
  const s = (Array.isArray(series) ? series : [])
    .filter(p => p && p.x && Number.isFinite(+p.y))
    .map(p => ({
      x: p.x,
      y: +p.y,
      rank: Number(p.rank),
      event: p.event || p.tournament || ''
    }))
    .sort((a, b) => new Date(a.x) - new Date(b.x));

  if (!dedupeByDay) return s;

  const out = [];
  let lastKey = null;

  for (const p of s) {
    const key = iso(p.x);

    if (key !== lastKey) {
      out.push(p);
    } else {
      out[out.length - 1] = p;
    }

    lastKey = key;
  }

  return out;
}

function labelStepForRange(y0, y1) {
  const span = Math.abs(y1 - y0);
  if (span < 100) return 25;
  if (span < 300) return 50;
  return 100;
}

function setTickLabelsEvery(yMin, yMax, step) {
  const lo = Math.floor(yMin / step) * step;
  const hi = Math.ceil(yMax / step) * step;

  const vals = [];
  const text = [];

  for (let y = lo; y <= hi; y += step) {
    vals.push(y);
    text.push(String(y));
  }

  Plotly.relayout('chart', {
    'yaxis.tickmode': 'array',
    'yaxis.tickvals': vals,
    'yaxis.ticktext': text
  });
}

function aggregateExpanded(series, mode) {
  if (mode === 'daily') return normalise(series, true);

  const buckets = Object.create(null);

  for (const p of series) {
    const d = new Date(p.x);
    let key;

    if (mode === 'weekly') {
      const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = tmp.getUTCDay() || 7;

      tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);

      const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);

      key = `${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    } else if (mode === 'monthly') {
      key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    } else if (mode === 'quarterly') {
      const q = Math.floor(d.getMonth() / 3) + 1;
      key = `${d.getFullYear()}-Q${q}`;
    } else {
      key = `${d.getFullYear()}`;
    }

    (buckets[key] ||= []).push(p);
  }

  const out = Object.keys(buckets).sort().map(k => {
    const pts = buckets[k].filter(p => Number.isFinite(p.y));
    const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
    const lastPoint = pts.length ? pts[pts.length - 1] : null;

    let x;

    if (k.includes('W')) {
      const [y, w] = k.split('-W');
      const year = +y;
      const week = +w;
      const simple = new Date(Date.UTC(year, 0, 1 + (week - 1) * 7));
      const dow = simple.getUTCDay();

      if (dow <= 4) simple.setUTCDate(simple.getUTCDate() - dow + 1);
      else simple.setUTCDate(simple.getUTCDate() + 8 - dow);

      x = iso(simple);
    } else if (k.includes('Q')) {
      const [y, q] = k.split('-Q');
      x = iso(new Date(Date.UTC(+y, (+q - 1) * 3, 1)));
    } else if (k.length === 7) {
      const [y, m] = k.split('-');
      x = iso(new Date(Date.UTC(+y, (+m) - 1, 1)));
    } else {
      x = iso(new Date(Date.UTC(+k, 0, 1)));
    }

    return {
      x,
      y: avg,
      rank: lastPoint ? Number(lastPoint.rank) : NaN,
      event: lastPoint ? (lastPoint.event || '') : ''
    };
  });

  return normalise(out, false);
}

function makeTrace(series, name) {
  return {
    type: 'scatter',
    x: series.map(p => p.x),
    y: series.map(p => p.y),
    customdata: series.map(p => [
      p.event || '',
      Number.isFinite(p.rank) ? `World #${p.rank}` : ''
    ]),
    mode: 'lines',
    line: {
      width: 3,
      shape: 'linear'
    },
    name,
    hovertemplate:
      '%{x|%d %b %Y}<br>%{y:.0f} Rating<br>%{customdata[1]}<extra></extra>',
    connectgaps: true
  };
}

function extentFrom(series) {
  const xs = [];

  for (const p of series) {
    if (p?.x) xs.push(new Date(p.x));
  }

  if (!xs.length) return { min: null, max: null };

  return {
    min: new Date(Math.min(...xs)),
    max: new Date(Math.max(...xs))
  };
}

function makeYGridShapes(yMin, yMax, step) {
  if (!Number.isFinite(yMin) || !Number.isFinite(yMax) || !step) return [];

  const lo = Math.floor((yMin - 1) / step) * step;
  const hi = Math.ceil((yMax + 1) / step) * step;
  const shapes = [];

  for (let y = lo; y <= hi; y += step) {
    let width, color;

    if (step === 100) {
      width = 2.2;
      color = 'rgba(255,255,255,0.28)';
    } else if (step === 50) {
      width = 1.4;
      color = 'rgba(255,255,255,0.16)';
    } else {
      width = 1.0;
      color = 'rgba(255,255,255,0.08)';
    }

    shapes.push({
      type: 'line',
      xref: 'paper',
      x0: 0,
      x1: 1,
      yref: 'y',
      y0: y,
      y1: y,
      line: { width, color }
    });
  }

  return shapes;
}

function makePaddedEnd(start, endData) {
  const oneDay = 86400000;
  const spanMs = Math.max(oneDay, +endData - +start);
  const padMs = Math.max(3 * oneDay, Math.min(14 * oneDay, spanMs * 0.02));

  return new Date(+endData + padMs);
}

function clampRangeStartOnly(range) {
  if (!range || !dataMin) return range;

  const [x0, x1] = range.map(x => new Date(x));
  const lo = new Date(Math.max(+x0, +dataMin));

  return [iso(lo), iso(x1)];
}

function updateActiveRangeButton() {
  document.querySelectorAll('.range-buttons .seg').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.range === activeRangeKey);
  });
}

function adjustYToVisible(x0, x1) {
  const lo = new Date(x0);
  const hi = new Date(x1);
  const values = [];

  for (const p of seriesLive) {
    const d = new Date(p.x);

    if (d >= lo && d <= hi && Number.isFinite(p.y)) {
      values.push(p.y);
    }
  }

  if (!values.length) return;

  const min = Math.min(...values);
  const max = Math.max(...values);
  const pad = (max - min) * 0.12 || 10;
  const y0 = min - pad;
  const y1 = max + pad;
  const step = labelStepForRange(y0, y1);

  Plotly.relayout('chart', {
    'yaxis.range': [y0, y1],
    'shapes': makeYGridShapes(y0, y1, step)
  }).then(() => {
    setTickLabelsEvery(y0, y1, step);
  });
}

/* ---------- chart ---------- */
function draw() {
  const mode = document.getElementById('agg').value;
  const chart = document.getElementById('chart');

  if (chart.textContent && chart.textContent.includes('Loading')) {
    chart.textContent = '';
  }

  const gd = document.getElementById('chart');
  const liveLayout = gd && gd._fullLayout ? gd._fullLayout.xaxis : null;

  if (liveLayout && liveLayout.range) {
    rememberedXRange = [liveLayout.range[0], liveLayout.range[1]];
  }

  seriesLive = aggregateExpanded(RAW, mode);

  if (!seriesLive.length) {
    chart.textContent = 'No games';
    return;
  }

  const ext = extentFrom(seriesLive);
  dataMin = ext.min;
  dataMax = ext.max;

  const ys = seriesLive.map(p => p.y).filter(Number.isFinite);
  const yMin0 = ys.length ? Math.min(...ys) : 0;
  const yMax0 = ys.length ? Math.max(...ys) : 1;
  const bg = getComputedStyle(document.body).backgroundColor;

  const trace = makeTrace(seriesLive, 'J-Ratings');

  const layout = {
    margin: { l: 50, r: 28, t: 10, b: 40 },

    xaxis: {
      type: 'date',
      fixedrange: true,
      showgrid: false,
      rangeslider: { visible: false }
    },

    yaxis: {
      title: '',
      fixedrange: true,
      showgrid: false,
      zeroline: false,
      tick0: 0,
      dtick: 25,
      ticks: 'outside',
      ticklen: 4,
      tickmode: 'array',
      tickvals: [],
      ticktext: []
    },

    paper_bgcolor: bg,
    plot_bgcolor: bg,
    font: { color: getComputedStyle(document.body).color },
    showlegend: false,
    shapes: makeYGridShapes(yMin0, yMax0, 100)
  };

  if (!initialRangeApplied && dataMin && dataMax) {
    const rawStart = new Date('2020-01-01');
    const start = new Date(Math.max(+rawStart, +dataMin));
    const end = makePaddedEnd(start, dataMax);

    rememberedXRange = [iso(start), iso(end)];
    activeRangeKey = '2020';
    initialRangeApplied = true;
  }

  Plotly.react('chart', [trace], layout, {
    staticPlot: false,
    scrollZoom: false,
    displayModeBar: false,
    responsive: true
  }).then(() => {
    if (rememberedXRange) {
      const [x0, x1] = clampRangeStartOnly(rememberedXRange);
      rememberedXRange = [x0, x1];

      Plotly.relayout('chart', { 'xaxis.range': [x0, x1] })
        .then(() => adjustYToVisible(x0, x1));
    }

    updateActiveRangeButton();

    const gd2 = document.getElementById('chart');

    if (!gd2._jrHandlersAttached) {
      gd2.on('plotly_relayout', ev => {
        const x0 = ev['xaxis.range[0]'] ?? (ev['xaxis.range'] && ev['xaxis.range'][0]);
        const x1 = ev['xaxis.range[1]'] ?? (ev['xaxis.range'] && ev['xaxis.range'][1]);

        if (x0 && x1) {
          rememberedXRange = [x0, x1];
          adjustYToVisible(x0, x1);
        }
      });

      gd2._jrHandlersAttached = true;
    }
  });
}

function setPreset(key) {
  if (!dataMin || !dataMax) return;

  let start;

  if (key === 'ALL') {
    start = new Date(dataMin);
  } else if (key === '2000') {
    start = new Date('2000-01-01');
  } else if (key === '2020') {
    start = new Date('2020-01-01');
  } else if (key === 'LY') {
    start = new Date(dataMax);
    start.setFullYear(start.getFullYear() - 1);
  } else if (key === 'YTD') {
    start = new Date(dataMax.getFullYear() + '-01-01');
  } else {
    start = new Date(dataMin);
  }

  start = new Date(Math.max(+start, +dataMin));

  const end = makePaddedEnd(start, dataMax);
  const range = [iso(start), iso(end)];

  rememberedXRange = range;
  activeRangeKey = key;

  updateActiveRangeButton();

  Plotly.relayout('chart', { 'xaxis.range': range })
    .then(() => adjustYToVisible(range[0], range[1]));
}

/* ---------- games table ---------- */
function makeOpponentCell(opponentName, players) {
  const td = document.createElement('td');
  td.className = 'opp';

  const player = players.find(p => p.name === opponentName);

  if (player && player.id) {
    const a = document.createElement('a');
    a.href = `../player/?id=${encodeURIComponent(player.id)}`;
    a.textContent = opponentName || '';
    td.appendChild(a);
  } else {
    td.textContent = opponentName || '';
  }

  return td;
}

function getResultForPlayer(g, myName) {
  const raw = (g.result || '').trim();

  if (
    raw === '1/2' ||
    raw === '1/2-1/2' ||
    raw === '½-½' ||
    /^draw$/i.test(raw)
  ) {
    return { cls: 'draw', text: 'Draw' };
  }

  if (raw === '1-0') {
    return g.black === myName
      ? { cls: 'win', text: 'Win' }
      : { cls: 'loss', text: 'Loss' };
  }

  if (raw === '0-1') {
    return g.white === myName
      ? { cls: 'win', text: 'Win' }
      : { cls: 'loss', text: 'Loss' };
  }

  return { cls: '', text: raw || '' };
}

function renderGamesTable(me, players, games) {
  const tbl = document.getElementById('games');
  tbl.innerHTML = '';

  const thead = document.createElement('thead');
  const hr = document.createElement('tr');

  for (const h of ['Date', 'Tournament', 'Opponent', 'Elo', 'Result', 'Δ', 'New', 'Rank']) {
    const th = document.createElement('th');
    th.textContent = h;
    hr.appendChild(th);
  }

  thead.appendChild(hr);
  tbl.appendChild(thead);

  const panelBg = getComputedStyle(document.querySelector('.panel')).backgroundColor;
  thead.style.backgroundColor = panelBg;

  const tbody = document.createElement('tbody');
  const rows = Array.isArray(games) ? [...games] : [];

  rows.sort((a, b) => new Date(b.date) - new Date(a.date));

  const myName = me.name;
  let added = 0;

  for (const g of rows) {
    const isBlack = g.black === myName;
    const isWhite = g.white === myName;

    if (!isBlack && !isWhite) continue;

    const opponentName = isBlack ? g.white : g.black;
    const opponentElo  = isBlack ? Number(g.whiteElo) : Number(g.blackElo);
    const myEloBefore  = isBlack ? Number(g.blackElo) : Number(g.whiteElo);

    const numDelta = Number(g.delta);

    const myEloAfter =
      Number.isFinite(myEloBefore) && Number.isFinite(numDelta)
        ? Math.round(myEloBefore + numDelta)
        : NaN;

    const tr = document.createElement('tr');

    const tdDate = document.createElement('td');
    tdDate.textContent = g.date || '';

    const tdTournament = document.createElement('td');
    tdTournament.textContent = g.tournament || '';

    const tdOpp = makeOpponentCell(opponentName, players);

    const tdOppElo = document.createElement('td');
    tdOppElo.textContent = Number.isFinite(opponentElo)
      ? String(Math.round(opponentElo))
      : '';

    const tdResult = document.createElement('td');
    const r = getResultForPlayer(g, myName);
    tdResult.textContent = r.text;
    tdResult.className = 'result' + (r.cls ? ' ' + r.cls : '');

    const tdDelta = document.createElement('td');

    if (!Number.isNaN(numDelta)) {
      tdDelta.textContent = g.delta;
      tdDelta.className = 'delta ' + (
        numDelta > 0 ? 'pos' : (numDelta < 0 ? 'neg' : '')
      );
    } else {
      tdDelta.textContent = '';
    }

    const tdNew = document.createElement('td');
    tdNew.textContent = Number.isFinite(myEloAfter)
      ? String(myEloAfter)
      : '';

    const tdRank = document.createElement('td');
    const rankNum = Number(g.rank);
    tdRank.textContent = Number.isFinite(rankNum) ? `#${rankNum}` : '';
    tdRank.className = 'rank';

    tr.appendChild(tdDate);
    tr.appendChild(tdTournament);
    tr.appendChild(tdOpp);
    tr.appendChild(tdOppElo);
    tr.appendChild(tdResult);
    tr.appendChild(tdDelta);
    tr.appendChild(tdNew);
    tr.appendChild(tdRank);

    tbody.appendChild(tr);
    added++;
  }

  if (!added) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');

    td.colSpan = 8;
    td.textContent = 'No games';

    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  tbl.appendChild(tbody);
}

/* ---------- player stats ---------- */
function renderPlayerStats(series) {
  const liveEl = document.getElementById('liveVal');
  const peakEl = document.getElementById('peakVal');

  if (!liveEl || !peakEl) return;

  if (!series || !series.length) {
    liveEl.textContent = '—';
    peakEl.textContent = '—';
    return;
  }

  const live = series[series.length - 1];

  liveEl.textContent = Number.isFinite(live.y)
    ? String(Math.round(live.y))
    : '—';

  let peak = series[0];

  for (const p of series) {
    if (Number.isFinite(p.y) && (!Number.isFinite(peak.y) || p.y > peak.y)) {
      peak = p;
    }
  }

  peakEl.textContent = Number.isFinite(peak.y)
    ? String(Math.round(peak.y))
    : '—';
}

/* ---------- load ---------- */
async function load() {
  const token = ++LOAD_TOKEN;

  try {
    document.getElementById('chart').textContent = 'Loading…';
    document.getElementById('games').innerHTML =
      '<tbody><tr><td colspan="8">Loading…</td></tr></tbody>';

    const [playersRes, histRes, gamesRes] = await Promise.all([
      fetch(PLAYERS_URL, { cache: 'no-cache' }),
      fetch(HIST_URL(idRaw), { cache: 'no-cache' }),
      fetch(GAMES_URL(idRaw), { cache: 'no-cache' })
    ]);

    if (token !== LOAD_TOKEN) return;

    if (!playersRes.ok) throw new Error('players.json not found');
    if (!histRes.ok) throw new Error('history not found');

    const players = await playersRes.json();
    const me = players.find(p => p.id === idRaw);

    if (!me) throw new Error('player id not in players.json');

    document.getElementById('pname').textContent =
      me.display_name || me.name || me.id;

    const histJson = await histRes.json();

    RAW = normalise(
      (Array.isArray(histJson) ? histJson : []).map(d => ({
        x: d.date,
        y: Number(d.rating),
        rank: Number(d.rank),
        event: d.event || d.tournament || ''
      })),
      true
    );

    if (!RAW.length) {
      document.getElementById('chart').textContent = 'No games';
      renderPlayerStats([]);
    } else {
      renderPlayerStats(RAW);
      draw();
    }

    if (gamesRes.ok) {
      const games = await gamesRes.json();

      if (token !== LOAD_TOKEN) return;

      renderGamesTable(me, players, Array.isArray(games) ? games : []);
    } else {
      document.getElementById('games').innerHTML =
        '<tbody><tr><td colspan="8">No games</td></tr></tbody>';
    }
  } catch (e) {
    if (token !== LOAD_TOKEN) return;

    console.error(e);

    document.getElementById('chart').textContent = 'Error: ' + e.message;
    document.getElementById('games').innerHTML =
      '<tbody><tr><td colspan="8">Error loading games</td></tr></tbody>';

    renderPlayerStats([]);
  }
}

/* ---------- events ---------- */
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('agg').addEventListener('change', () => {
    draw();
  });

  document.querySelectorAll('.range-buttons .seg').forEach(btn => {
    btn.addEventListener('click', () => setPreset(btn.dataset.range));
  });

  updateActiveRangeButton();
  load();
});
</script>
