<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JXCC4EDPY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1JXCC4EDPY');
  </script>

  <meta charset="utf-8">
  <title>J-Ratings: Go</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="../../jratings-graph.js"></script>

  <style>
    .player-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      margin:12px 0;
      padding:0 12px;
      gap:1rem;
    }

    h2#pname{
      margin:0;
      padding:0;
      border-bottom:none;
      font-size:2rem;
    }

    .badge{
      border:1px solid var(--border);
      background:#0f1623;
      border-radius:8px;
      padding:6px 10px;
      margin-right:4px;
      white-space:nowrap;
      display:flex;
      align-items:flex-start;
      flex-direction:column;
      gap:.5rem;
    }

    .badge strong{
      font-variant-numeric:tabular-nums;
    }

    #stats-j .muted{
      color:#1f77b4;
      font-weight:bold;
    }

    .chart-area{
      padding:0 16px 16px;
    }

    h3.section-title{
      text-align:center;
      font-size:1.6rem;
      margin-top:20px;
      margin-bottom:10px;
    }

    #gamesWrap{
      max-height:520px;
      overflow:auto;
      margin-top:12px;
    }

    table.games{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      font-size:1rem;
    }

    table.games th,
    table.games td{
      padding:10px 12px;
      border-bottom:1px solid var(--border);
      text-align:center;
      vertical-align:middle;
      white-space:nowrap;
    }

    table.games th{
      position:sticky;
      top:0;
      z-index:2;
      background-color:var(--card);
    }

    table.games th:nth-child(1), table.games td:nth-child(1),
    table.games th:nth-child(2), table.games td:nth-child(2),
    table.games th:nth-child(3), table.games td:nth-child(3),
    table.games th:nth-child(4), table.games td:nth-child(4),
    table.games th:nth-child(5), table.games td:nth-child(5),
    table.games th:nth-child(6), table.games td:nth-child(6),
    table.games th:nth-child(7), table.games td:nth-child(7){
      border-right:3px double rgba(128,128,128,0.6);
    }

    .result{ font-weight:700; }
    .result.win{ color:#2acd4e; }
    .result.loss{ color:#e03232; }
    .result.draw{ color:#e8a81f; }

    .delta{ font-weight:700; }
    .delta.pos{ color:#2acd4e; }
    .delta.neg{ color:#e03232; }

    .rank{ font-weight:700; }
    .opp{ text-align:left; }

    td.opp a{
      color:inherit;
      text-decoration:underline;
      text-underline-offset:2px;
    }

    td.opp a:hover{
      opacity:.9;
    }

    @media (max-width:700px){
      .player-head{
        flex-direction:column;
        align-items:flex-start;
      }

      h2#pname{
        font-size:1.6rem;
      }

      h3.section-title{
        font-size:1.25rem;
      }

      table.games{
        font-size:.92rem;
      }

      table.games th,
      table.games td{
        padding:8px 10px;
      }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="../home/index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-go">Go</span></span>
        <img src="../../Go Banner Logo.png" alt="Go logo" class="sport-logo">
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="../../index.html">Sports</a>
      <a id="nav-home" href="../home/">Home</a>
      <a id="nav-compare" href="../compare/">Compare</a>
      <a id="nav-peak" href="../peak/">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="player-head">
      <h2 id="pname">Player</h2>

      <div class="badge">
        <div id="stats-j">
          <span class="muted">Live:</span> <strong id="liveVal">—</strong>
          <span class="muted">Peak:</span> <strong id="peakVal">—</strong>
        </div>
      </div>
    </div>

    <div class="chart-area">
      <div class="jr-chart-controls">
        <div>
          <label for="agg">View:</label>
          <select id="agg">
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>

        <div class="range-buttons">
          <button type="button" class="seg" data-range="ALL">ALL</button>
          <button type="button" class="seg" data-range="2000">2000–Present</button>
          <button type="button" class="seg" data-range="2020">2020–Present</button>
          <button type="button" class="seg" data-range="LY">Last Year</button>
          <button type="button" class="seg" data-range="YTD">YTD</button>
        </div>
      </div>

      <div id="chart" class="jr-chart">Loading…</div>
    </div>

    <h3 class="section-title">Games</h3>

    <div id="gamesWrap">
      <table id="games" class="games"></table>
    </div>
  </section>
</main>

<script>
const params = new URLSearchParams(location.search);
const idRaw = params.get('id');

if (!idRaw) {
  document.getElementById('chart').textContent = 'Missing player id.';
  throw new Error('no id');
}

const PLAYERS_URL = '../data/players.json';
const HIST_URL    = id => `../data/history/${encodeURIComponent(id)}.json`;
const GAMES_URL   = id => `../data/games/${encodeURIComponent(id)}.json`;

let RAW = [];
let LOAD_TOKEN = 0;
let playerChart = null;

function makePlayerGraphItems() {
  return [{
    name: 'J-Ratings',
    raw: RAW,
    customData: p => [
      p.event || '',
      Number.isFinite(p.rank) ? `World #${p.rank}` : ''
    ],
    hovertemplate: '%{x|%d %b %Y}<br>%{y:.0f} Rating<br>%{customdata[1]}<extra></extra>'
  }];
}

function makeOpponentCell(opponentName, players) {
  const td = document.createElement('td');
  td.className = 'opp';

  const player = players.find(p => p.name === opponentName);

  if (player && player.id) {
    const a = document.createElement('a');
    a.href = `../player/?id=${encodeURIComponent(player.id)}`;
    a.textContent = opponentName || '';
    td.appendChild(a);
  } else {
    td.textContent = opponentName || '';
  }

  return td;
}

function getResultForPlayer(g, myName) {
  const raw = (g.result || '').trim();

  if (
    raw === '1/2' ||
    raw === '1/2-1/2' ||
    raw === '½-½' ||
    /^draw$/i.test(raw)
  ) {
    return { cls: 'draw', text: 'Draw' };
  }

  if (raw === '1-0') {
    return g.black === myName
      ? { cls: 'win', text: 'Win' }
      : { cls: 'loss', text: 'Loss' };
  }

  if (raw === '0-1') {
    return g.white === myName
      ? { cls: 'win', text: 'Win' }
      : { cls: 'loss', text: 'Loss' };
  }

  return { cls: '', text: raw || '' };
}

function renderGamesTable(me, players, games) {
  const tbl = document.getElementById('games');
  tbl.innerHTML = '';

  const thead = document.createElement('thead');
  const hr = document.createElement('tr');

  for (const h of ['Date', 'Tournament', 'Opponent', 'Elo', 'Result', 'Δ', 'New', 'Rank']) {
    const th = document.createElement('th');
    th.textContent = h;
    hr.appendChild(th);
  }

  thead.appendChild(hr);
  tbl.appendChild(thead);

  const tbody = document.createElement('tbody');
  const rows = Array.isArray(games) ? [...games] : [];

  rows.sort((a, b) => new Date(b.date) - new Date(a.date));

  const myName = me.name;
  let added = 0;

  for (const g of rows) {
    const isBlack = g.black === myName;
    const isWhite = g.white === myName;

    if (!isBlack && !isWhite) continue;

    const opponentName = isBlack ? g.white : g.black;
    const opponentElo  = isBlack ? Number(g.whiteElo) : Number(g.blackElo);
    const myEloBefore  = isBlack ? Number(g.blackElo) : Number(g.whiteElo);
    const numDelta = Number(g.delta);

    const myEloAfter =
      Number.isFinite(myEloBefore) && Number.isFinite(numDelta)
        ? Math.round(myEloBefore + numDelta)
        : NaN;

    const tr = document.createElement('tr');

    const tdDate = document.createElement('td');
    tdDate.textContent = g.date || '';

    const tdTournament = document.createElement('td');
    tdTournament.textContent = g.tournament || '';

    const tdOpp = makeOpponentCell(opponentName, players);

    const tdOppElo = document.createElement('td');
    tdOppElo.textContent = Number.isFinite(opponentElo)
      ? String(Math.round(opponentElo))
      : '';

    const tdResult = document.createElement('td');
    const r = getResultForPlayer(g, myName);
    tdResult.textContent = r.text;
    tdResult.className = 'result' + (r.cls ? ' ' + r.cls : '');

    const tdDelta = document.createElement('td');

    if (!Number.isNaN(numDelta)) {
      tdDelta.textContent = g.delta;
      tdDelta.className = 'delta ' + (
        numDelta > 0 ? 'pos' : (numDelta < 0 ? 'neg' : '')
      );
    } else {
      tdDelta.textContent = '';
    }

    const tdNew = document.createElement('td');
    tdNew.textContent = Number.isFinite(myEloAfter)
      ? String(myEloAfter)
      : '';

    const tdRank = document.createElement('td');
    const rankNum = Number(g.rank);
    tdRank.textContent = Number.isFinite(rankNum) ? `#${rankNum}` : '';
    tdRank.className = 'rank';

    tr.appendChild(tdDate);
    tr.appendChild(tdTournament);
    tr.appendChild(tdOpp);
    tr.appendChild(tdOppElo);
    tr.appendChild(tdResult);
    tr.appendChild(tdDelta);
    tr.appendChild(tdNew);
    tr.appendChild(tdRank);

    tbody.appendChild(tr);
    added++;
  }

  if (!added) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');

    td.colSpan = 8;
    td.textContent = 'No games';

    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  tbl.appendChild(tbody);
}

function renderPlayerStats(series) {
  const liveEl = document.getElementById('liveVal');
  const peakEl = document.getElementById('peakVal');

  if (!series || !series.length) {
    liveEl.textContent = '—';
    peakEl.textContent = '—';
    return;
  }

  const live = series[series.length - 1];

  liveEl.textContent = Number.isFinite(live.y)
    ? String(Math.round(live.y))
    : '—';

  let peak = series[0];

  for (const p of series) {
    if (Number.isFinite(p.y) && (!Number.isFinite(peak.y) || p.y > peak.y)) {
      peak = p;
    }
  }

  peakEl.textContent = Number.isFinite(peak.y)
    ? String(Math.round(peak.y))
    : '—';
}

async function load() {
  const token = ++LOAD_TOKEN;

  try {
    document.getElementById('chart').textContent = 'Loading…';
    document.getElementById('games').innerHTML =
      '<tbody><tr><td colspan="8">Loading…</td></tr></tbody>';

    const [playersRes, histRes, gamesRes] = await Promise.all([
      fetch(PLAYERS_URL, { cache: 'no-cache' }),
      fetch(HIST_URL(idRaw), { cache: 'no-cache' }),
      fetch(GAMES_URL(idRaw), { cache: 'no-cache' })
    ]);

    if (token !== LOAD_TOKEN) return;

    if (!playersRes.ok) throw new Error('players.json not found');
    if (!histRes.ok) throw new Error('history not found');

    const players = await playersRes.json();
    const me = players.find(p => p.id === idRaw);

    if (!me) throw new Error('player id not in players.json');

    document.getElementById('pname').textContent =
      me.display_name || me.name || me.id;

    const histJson = await histRes.json();

    RAW = JRGraph.normalise(
      (Array.isArray(histJson) ? histJson : []).map(d => ({
        x: d.date,
        y: Number(d.rating),
        rank: Number(d.rank),
        event: d.event || d.tournament || ''
      })),
      true
    );

    if (!RAW.length) {
      document.getElementById('chart').textContent = 'No games';
      renderPlayerStats([]);
    } else {
      renderPlayerStats(RAW);

      playerChart = JRGraph.createChart({
        chartId: 'chart',
        aggId: 'agg',
        controlsEl: document.querySelector('.panel'),
        defaultRange: '2020',
        getItems: makePlayerGraphItems
      });

      playerChart.render(makePlayerGraphItems());
    }

    if (gamesRes.ok) {
      const games = await gamesRes.json();

      if (token !== LOAD_TOKEN) return;

      renderGamesTable(me, players, Array.isArray(games) ? games : []);
    } else {
      document.getElementById('games').innerHTML =
        '<tbody><tr><td colspan="8">No games</td></tr></tbody>';
    }
  } catch (e) {
    if (token !== LOAD_TOKEN) return;

    console.error(e);

    document.getElementById('chart').textContent = 'Error: ' + e.message;
    document.getElementById('games').innerHTML =
      '<tbody><tr><td colspan="8">Error loading games</td></tr></tbody>';

    renderPlayerStats([]);
  }
}

load();
</script>
</body>
</html>
