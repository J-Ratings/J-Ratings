  <style>
    :root{
      --wl-win:#14b85a;
      --wl-loss:#e53935;
    }

    .player-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      margin:12px 0;
      padding:0 12px;
      gap:1rem;
    }

    h2#pname{
      margin:0;
      padding:0;
      border-bottom:none;
      font-size:2rem;
    }

    .badge{
      border:1px solid var(--border);
      background:#0f1623;
      border-radius:8px;
      padding:6px 10px;
      margin-right:4px;
      white-space:nowrap;
      display:flex;
      align-items:flex-start;
      flex-direction:column;
      gap:.5rem;
    }

    .badge strong{
      font-variant-numeric:tabular-nums;
    }

    #stats-j .muted{
      color:#1f77b4;
      font-weight:bold;
    }

    .chart-area{
      padding:0 16px 16px;
    }

    h3.section-title{
      text-align:center;
      font-size:1.6rem;
      margin-top:20px;
      margin-bottom:10px;
    }

    #gamesWrap{
      max-height:520px;
      overflow:auto;
      margin-top:12px;
    }

    table.games{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      font-size:1rem;
      table-layout:fixed;
    }

    table.games th,
    table.games td{
      padding:10px 12px;
      border-bottom:1px solid var(--border);
      border-right:1px solid rgba(128,128,128,0.45);
      text-align:center;
      vertical-align:middle;
      white-space:nowrap;
    }

    table.games th:first-child,
    table.games td:first-child{
      border-left:1px solid rgba(128,128,128,0.45);
    }

    table.games th{
      position:sticky;
      top:0;
      z-index:2;
      background-color:var(--card);
    }

    table.games th:nth-child(1),
    table.games td:nth-child(1){
      width:120px;
    }

table.games th:nth-child(2),
table.games td:nth-child(2),
table.games th:nth-child(4),
table.games td:nth-child(4){
  width:190px;
}

table.games td:nth-child(3),
table.games th:nth-child(5),
table.games td:nth-child(5){
  width:72px;
}

table.games th:nth-child(6),
table.games td:nth-child(6){
  width:180px;
}

table.games th:nth-child(7),
table.games td:nth-child(7){
  width:90px;
}

table.games th:nth-child(8),
table.games td:nth-child(8){
  width:80px;
}

    .player-cell{
      text-align:left;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .player-cell a{
      color:inherit;
      text-decoration:underline;
      text-underline-offset:2px;
    }

    .player-cell a:hover{
      opacity:.9;
    }

    .player-cell .profile-player,
    .player-cell a.profile-player{
      font-weight:900;
      text-decoration-thickness:2px;
    }

    .result{ font-weight:800; }
    .result.win{ color:var(--wl-win); }
    .result.loss{ color:var(--wl-loss); }
    .result.draw{ color:#e8a81f; }

    .delta{ font-weight:800; }
    .delta.pos{ color:var(--wl-win); }
    .delta.neg{ color:var(--wl-loss); }
    .delta.zero{ color:#e8a81f; }

    .wl-cell{
      min-width:150px;
    }

    .wl-bar{
      display:flex;
      width:142px;
      height:26px;
      border-radius:7px;
      overflow:hidden;
      border:1px solid rgba(128,128,128,0.45);
      background:rgba(255,255,255,0.04);
      margin:0 auto;
    }

    .wl-seg{
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:.78rem;
      font-weight:900;
      color:#111;
      overflow:hidden;
    }

    .wl-win{ background:var(--wl-win); }
    .wl-loss{ background:var(--wl-loss); }

    .wl-seg span{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:clip;
    }

      }

      h3.section-title{

      }

      table.games{
        font-size:.92rem;
      }

      table.games th,
      table.games td{
        padding:8px 10px;
      }

      table.games th:nth-child(1),

      }

table.games td:nth-child(3),
table.games th:nth-child(5),
table.games td:nth-child(5){

}

table.games th:nth-child(6),

}

table.games td:nth-child(7){
  width:85px;
}

table.games td:nth-child(8){

}

      .wl-cell{
        min-width:132px;
      }

      .wl-bar{

        height:24px;
      }

      .wl-seg{
        font-size:.7rem;
      }

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="../home/index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-go">Go</span></span>
        <img src="../../Go Banner Logo.png" alt="Go logo" class="sport-logo">
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="../../index.html">Sports</a>
      <a id="nav-home" href="../home/">Home</a>
      <a id="nav-compare" href="../compare/">Compare</a>
      <a id="nav-peak" href="../peak/">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="player-head">
      <h2 id="pname">Player</h2>

      <div class="badge">
        <div id="stats-j">
          <span class="muted">Live:</span> <strong id="liveVal">—</strong>
          <span class="muted">Peak:</span> <strong id="peakVal">—</strong>
        </div>
      </div>
    </div>

    <div class="chart-area">
      <div class="jr-chart-controls">
        <div>
          <label for="agg">View:</label>
          <select id="agg">
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>

        <div class="range-buttons">
          <button type="button" class="seg" data-range="ALL">ALL</button>
          <button type="button" class="seg" data-range="2000">2000–Present</button>
          <button type="button" class="seg" data-range="2020">2020–Present</button>
          <button type="button" class="seg" data-range="LY">Last Year</button>
          <button type="button" class="seg" data-range="YTD">YTD</button>
        </div>
      </div>

      <div id="chart" class="jr-chart">Loading…</div>
    </div>

    <h3 class="section-title">Games</h3>

    <div id="gamesWrap">
      <table id="games" class="games"></table>
    </div>
  </section>
</main>

<script>
const params = new URLSearchParams(location.search);
const idRaw = params.get('id');

if (!idRaw) {
  document.getElementById('chart').textContent = 'Missing player id.';
  throw new Error('no id');
}

const PLAYERS_URL = '../data/players.json';
const HIST_URL    = id => `../data/history/${encodeURIComponent(id)}.json`;
const GAMES_URL   = id => `../data/games/${encodeURIComponent(id)}.json`;

let RAW = [];
let LOAD_TOKEN = 0;
let playerChart = null;

function makePlayerGraphItems() {
  return [{
    name: 'J-Ratings',
    raw: RAW,
    customData: p => [
      p.event || '',
      Number.isFinite(p.rank) ? `World #${p.rank}` : ''
    ],
    hovertemplate: '%{x|%d %b %Y}<br>%{y:.0f} Rating<br>%{customdata[1]}<extra></extra>'
  }];
}

function renderPlayerCell(playerName, players, myName) {
  const isProfilePlayer = playerName === myName;
  const player = players.find(p => p.name === playerName);

  if (player && player.id) {
    const a = document.createElement('a');
    a.href = `../player/?id=${encodeURIComponent(player.id)}`;
    a.textContent = playerName || '';

    if (isProfilePlayer) {
      a.className = 'profile-player';
    }

    return a;
  }

  const span = document.createElement('span');
  span.textContent = playerName || '';

  if (isProfilePlayer) {
    span.className = 'profile-player';
  }

  return span;
}

function getResultForPlayer(g, myName) {
  const raw = (g.result || '').trim();

  if (
    raw === '1/2' ||
    raw === '1/2-1/2' ||
    raw === '½-½' ||
    /^draw$/i.test(raw)
  ) {
    return { cls: 'draw', text: 'Draw' };
  }

  if (raw === '1-0') {
    return g.black === myName
      ? { cls: 'win', text: 'Win' }
      : { cls: 'loss', text: 'Loss' };
  }

  if (raw === '0-1') {
    return g.white === myName
      ? { cls: 'win', text: 'Win' }
      : { cls: 'loss', text: 'Loss' };
  }

  return { cls: '', text: raw || '' };
}

function renderWlBar(g, myName) {
  const isBlack = g.black === myName;
  const isWhite = g.white === myName;

  if (!isBlack && !isWhite) {
    return document.createTextNode('');
  }

  let blackWin = Number(g.blackWinPct);
  let whiteWin = Number(g.whiteWinPct);

  if (!Number.isFinite(blackWin) || !Number.isFinite(whiteWin)) {
    const blackElo = Number(g.blackElo);
    const whiteElo = Number(g.whiteElo);

    if (!Number.isFinite(blackElo) || !Number.isFinite(whiteElo)) {
      return document.createTextNode('');
    }

    const expectedBlack = 1 / (1 + Math.pow(10, (whiteElo - blackElo) / 400));
    blackWin = Math.round(100 * expectedBlack);
    whiteWin = 100 - blackWin;
  }

  const win = isBlack ? blackWin : whiteWin;
  const loss = isBlack ? whiteWin : blackWin;

  const safeWin = Math.max(0, Math.min(100, win));
  const safeLoss = Math.max(0, Math.min(100, loss));

  const wrap = document.createElement('div');
  wrap.className = 'wl-bar';
  wrap.title = `Win ${safeWin}% / Loss ${safeLoss}%`;

  const winSeg = document.createElement('div');
  winSeg.className = 'wl-seg wl-win';
  winSeg.style.width = `${safeWin}%`;
  winSeg.innerHTML = `<span>${safeWin}%</span>`;

  const lossSeg = document.createElement('div');
  lossSeg.className = 'wl-seg wl-loss';
  lossSeg.style.width = `${safeLoss}%`;
  lossSeg.innerHTML = `<span>${safeLoss}%</span>`;

  wrap.appendChild(winSeg);
  wrap.appendChild(lossSeg);

  return wrap;
}

function renderGamesTable(me, players, games) {
  const tbl = document.getElementById('games');
  tbl.innerHTML = '';

  const thead = document.createElement('thead');
  const hr = document.createElement('tr');

for (const h of ['Date', 'Black', 'Elo', 'White', 'Elo', 'Expected W/L', 'Result', 'Δ']) {
      const th = document.createElement('th');
    th.textContent = h;
    hr.appendChild(th);
  }

  thead.appendChild(hr);
  tbl.appendChild(thead);

  const tbody = document.createElement('tbody');
  const rows = Array.isArray(games) ? [...games] : [];

  rows.sort((a, b) => new Date(b.date) - new Date(a.date));

  const myName = me.name;
  let added = 0;

  for (const g of rows) {
    const isBlack = g.black === myName;
    const isWhite = g.white === myName;

    if (!isBlack && !isWhite) continue;

    const blackElo = Number(g.blackElo);
    const whiteElo = Number(g.whiteElo);
    const numDelta = Number(g.delta);

    const tr = document.createElement('tr');

    const tdDate = document.createElement('td');
    tdDate.textContent = g.date || '';

    const tdBlack = document.createElement('td');
    tdBlack.className = 'player-cell';
    tdBlack.appendChild(renderPlayerCell(g.black, players, myName));

    const tdBlackElo = document.createElement('td');
    tdBlackElo.textContent = Number.isFinite(blackElo)
      ? String(Math.round(blackElo))
      : '';

    const tdWhite = document.createElement('td');
    tdWhite.className = 'player-cell';
    tdWhite.appendChild(renderPlayerCell(g.white, players, myName));

    const tdWhiteElo = document.createElement('td');
    tdWhiteElo.textContent = Number.isFinite(whiteElo)
      ? String(Math.round(whiteElo))
      : '';

    const tdWl = document.createElement('td');
    tdWl.className = 'wl-cell';
    tdWl.appendChild(renderWlBar(g, myName));

    const tdResult = document.createElement('td');
    const r = getResultForPlayer(g, myName);
    tdResult.textContent = r.text;
    tdResult.className = 'result' + (r.cls ? ' ' + r.cls : '');

    const tdDelta = document.createElement('td');

    if (!Number.isNaN(numDelta)) {
      tdDelta.textContent = g.delta;
      tdDelta.className = 'delta ' + (
        numDelta > 0 ? 'pos' : (numDelta < 0 ? 'neg' : 'zero')
      );
    } else {
      tdDelta.textContent = '';
    }

    tr.appendChild(tdDate);
    tr.appendChild(tdBlack);
    tr.appendChild(tdBlackElo);
    tr.appendChild(tdWhite);
    tr.appendChild(tdWhiteElo);
    tr.appendChild(tdWl);
    tr.appendChild(tdResult);
    tr.appendChild(tdDelta);

    tbody.appendChild(tr);
    added++;
  }

  if (!added) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');

    td.colSpan = 9;
    td.textContent = 'No games';

    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  tbl.appendChild(tbody);
}

function renderPlayerStats(series) {
  const liveEl = document.getElementById('liveVal');
  const peakEl = document.getElementById('peakVal');

  if (!series || !series.length) {
    liveEl.textContent = '—';
    peakEl.textContent = '—';
    return;
  }

  const live = series[series.length - 1];

  liveEl.textContent = Number.isFinite(live.y)
    ? String(Math.round(live.y))
    : '—';

  let peak = series[0];

  for (const p of series) {
    if (Number.isFinite(p.y) && (!Number.isFinite(peak.y) || p.y > peak.y)) {
      peak = p;
    }
  }

  peakEl.textContent = Number.isFinite(peak.y)
    ? String(Math.round(peak.y))
    : '—';
}

async function load() {
  const token = ++LOAD_TOKEN;

  try {
    document.getElementById('chart').textContent = 'Loading…';
    document.getElementById('games').innerHTML =
      '<tbody><tr><td colspan="8">Loading…</td></tr></tbody>';

    const [playersRes, histRes, gamesRes] = await Promise.all([
      fetch(PLAYERS_URL, { cache: 'no-cache' }),
      fetch(HIST_URL(idRaw), { cache: 'no-cache' }),
      fetch(GAMES_URL(idRaw), { cache: 'no-cache' })
    ]);

    if (token !== LOAD_TOKEN) return;

    if (!playersRes.ok) throw new Error('players.json not found');
    if (!histRes.ok) throw new Error('history not found');

    const players = await playersRes.json();
    const me = players.find(p => p.id === idRaw);

    if (!me) throw new Error('player id not in players.json');

    document.getElementById('pname').textContent =
      me.display_name || me.name || me.id;

    const histJson = await histRes.json();

    RAW = JRGraph.normalise(
      (Array.isArray(histJson) ? histJson : []).map(d => ({
        x: d.date,
        y: Number(d.rating),
        rank: Number(d.rank),
        event: d.event || d.tournament || ''
      })),
      true
    );

    if (!RAW.length) {
      document.getElementById('chart').textContent = 'No games';
      renderPlayerStats([]);
    } else {
      renderPlayerStats(RAW);

      playerChart = JRGraph.createChart({
        chartId: 'chart',
        aggId: 'agg',
        controlsEl: document.querySelector('.panel'),
        defaultRange: '2020',
        getItems: makePlayerGraphItems
      });

      playerChart.render(makePlayerGraphItems());
    }

    if (gamesRes.ok) {
      const games = await gamesRes.json();

      if (token !== LOAD_TOKEN) return;

      renderGamesTable(me, players, Array.isArray(games) ? games : []);
    } else {
      document.getElementById('games').innerHTML =
        '<tbody><tr><td colspan="8">No games</td></tr></tbody>';
    }
  } catch (e) {
    if (token !== LOAD_TOKEN) return;

    console.error(e);

    document.getElementById('chart').textContent = 'Error: ' + e.message;
    document.getElementById('games').innerHTML =
      '<tbody><tr><td colspan="8">Error loading games</td></tr></tbody>';

    renderPlayerStats([]);
  }
}

load();
</script>
</body>
</html>
