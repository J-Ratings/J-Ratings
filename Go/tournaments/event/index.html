v .active-tab{background:rgba(255,255,255,.1);border-color:#83b9ff}main>#title,main>#format,main>.tournament-format{text-align:center}main>.final-positions-button{margin:10px auto}</style><link rel="stylesheet" href="../site.css?v=3"></head>
<body><header><div class="wrap"><h1 class="site-title"><a href="../../home/" class="brand-with-logo"><span>J-Ratings <span class="title-go">Go</span></span></a></h1><nav class="topnav" aria-label="Main"><a href="../../../index.html">Sports</a><a href="../../home/">Home</a><a class="active-tab" href="../../tournaments/">Tournaments</a><a href="../../compare/">Compare</a><a href="../../peak/">Peak</a></nav></div></header><main class="wrap"><h1 id="title">Tournament</h1><p id="format"></p><div id="stages">Loading…</div><p><a id="source" target="_blank" rel="noopener">Tournament source: Go to Everyone!</a></p></main>
<script src="league.js?v=2"></script><script src="../player-history.js?v=14"></script><script src="bracket.js?v=4"></script><script>(async()=>{
const file=new URLSearchParams(location.search).get('file');if(!file||!/^[a-z0-9-]+\.json$/.test(file))throw Error('Choose a tournament from the catalogue.');
const response=await fetch('../../data/tournaments/catalogue/'+file,{cache:'no-store'});if(!response.ok)throw Error('Tournament data unavailable');const data=await response.json();
document.getElementById('title').textContent=data.name;document.title='J-Ratings: '+data.name;const format=document.getElementById('format');
const names=(data.brackets||[]).map(b=>b.name).join(' ');
const labels=[/winner/i.test(names)&&/loser/i.test(names)?'Winners’ and losers’ brackets':data.brackets?.length===1?'Knockout':data.format];
const series=(data.brackets||[]).flatMap(b=>b.matches).filter(m=>m.series?.length>1 && /^final$/i.test(m.round));
if(series.some(m=>m.series.length===3))labels.push('Best-of-three final'); if(series.some(m=>m.series.length===5))labels.push('Best-of-five final');
labels.forEach(text=>{const pill=document.createElement('span');pill.className='pill';pill.textContent=text;format.append(pill)});document.getElementById('source').href=data.source;
const root=document.getElementById('stages');root.replaceChildren();const appearances=[];
function highlight(key){appearances.forEach(x=>x.row.classList.toggle('highlight',Boolean(key)&&x.key===key))}

const consumed=new Set(data.bracketGameIndices||[]);
const stages=new Map();data.games.forEach((g,i)=>{if(consumed.has(i))return;const stage=g.stage||'Games';if(!stages.has(stage))stages.set(stage,new Map());const rounds=stages.get(stage),round=g.round||'Results';if(!rounds.has(round))rounds.set(round,[]);rounds.get(round).push(g)});
renderLeagueStandings(root,data.leagueTables||[]);
const openByDefault=(data.brackets?.length||0)+stages.size===1;
if(data.brackets?.length) renderTournamentBrackets(root,data.brackets,appearances,highlight,openByDefault);
stages.forEach((rounds,label)=>{const section=createTournamentSection(root,label,openByDefault);const columns=document.createElement('div');columns.className='rounds';section.appendChild(columns);root.appendChild(section);
rounds.forEach((games,label)=>{const column=document.createElement('div');column.className='round';const h=document.createElement('h3');h.textContent=label;column.appendChild(h);columns.appendChild(column);
games.sort((a,b)=>a.date.localeCompare(b.date)).forEach(g=>{const card=document.createElement('div');card.className='game';card.fixture=g.fixture;g.players.forEach(p=>{const row=document.createElement('div');row.className='player';const stone=document.createElement('span');stone.className='stone '+(p.colour==='B'?'black':'white');stone.title=p.colour==='B'?'Black':'White';row.appendChild(stone);if(p.flag){const flag=document.createElement('img');flag.className='flag';flag.src='../../../flags/'+encodeURIComponent(p.flag)+'.svg';flag.alt=p.flag.toUpperCase();row.appendChild(flag)}const name=document.createElement(p.id?'a':'span');name.className='name';name.textContent=p.name;if(p.id)name.href='../../player/?id='+encodeURIComponent(p.id);row.appendChild(name);if(p.rating!=null){const rating=document.createElement('span');rating.className='rating';rating.textContent=p.rating;row.appendChild(rating)}if(p.winPct!=null){const chance=document.createElement('span');chance.className='chance';chance.textContent=p.winPct+'%';row.appendChild(chance)}const score=document.createElement('span');score.className='score '+(p.name===g.winner?'win':'loss');score.textContent=p.name===g.winner?'1':'0';row.appendChild(score);const key=p.id||p.name;appearances.push({row,key});row.addEventListener('mouseenter',()=>highlight(key));row.addEventListener('mouseleave',()=>highlight(null));row.addEventListener('focusin',()=>highlight(key));row.addEventListener('focusout',()=>highlight(null));card.appendChild(row)});const note=document.createElement('div');note.className='note';note.textContent=[g.date,g.result].filter(Boolean).join(' · ');card.appendChild(note);column.appendChild(card)});
});if(/league/i.test(label))simplifyLeagueGames(section,columns);});setupTournamentPlayerHistory(data);if(!data.games.length)root.textContent='No supported games were extracted for this edition.';
})().catch(e=>document.getElementById('stages').textContent=e.message);</script></body></html>
