    #compare-chart { height: 520px; }

    .compare-chart-toolbar {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .compare-toolbar-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .compare-toolbar-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .compare-chart-toolbar label {
      margin-right: 6px;
      font-size: 1.05rem;
    }

    .range-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .range-btn {
      padding: 8px 10px;
      border: 1px solid #2b2f36;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      color: inherit;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .range-btn:hover { opacity: 0.92; }

    .range-btn.is-active {
      background: rgba(255,255,255,0.10);
      border-color: rgba(200,200,200,0.55);
      font-weight: 700;
    }

    /* Modal */
    #compare-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #compare-modal > div {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 80%;
      overflow: auto;
      color: #fff;
    }

    .compare-controls { margin: 10px 0; }
    .compare-controls button { margin-right: 10px; }

    .asof {
      opacity: 0.8;
      font-size: 0.95rem;
      margin: 6px 0 12px 0;
      white-space: nowrap;
      padding-left: 12px;
    }

    /* Tier badges */
    .tier-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.35);
    }

    /* Division colours + text colours */
    .tier-premier-league {
      background: #59127a;
      color: #ffffff;

    .tier-championship {
      background: #081e9a;
      color: #ffffff;
    }

    .tier-league-1 {
      background: #8D8E8E;
      color: #000000;
    }

    .tier-league-2 {
      background: #BB1731;
      color: #000000;
    }

    @media (max-width: 600px) {
      #compare-chart { height: 420px; }

        width: 100%;
        table-layout: fixed;

      #teams td {

      #teams td:nth-child(1) { width: 52px; }

      #teams td:nth-child(3) { width: 78px; }

      #teams td:nth-child(2) { width: auto; }

        display: block;
        overflow: hidden;

<script>
  const DATA_URL = '../data/teams.json';
  const SEASON_STARTS_URL = '../data/season_starts.json';
  const META_URL = '../data/meta.json';
  const COLOURS_URL = '../team-colours.json';

  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

  const state = {
    mode: 'live',
    meta: null,
    liveRows: [],
    seasonStarts: [],
    rows: [],
    filtered: []
  };

  const histCache = new Map();

  let lastCompared = [];
  let TEAM_COLOURS = {};
  let COMPARE_SINCE_YEAR = null;
  let COMPARE_AGG_MODE = 'monthly';

  function formatAsOf(iso) {
    const [y, m, d] = String(iso).split('-').map(Number);
    if (!y || !m || !d) return iso;
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d} ${months[m - 1]} ${y}`;
  }

  function setAsOfText() {
    const el = document.getElementById('asof');
    if (!el) return;

    if (state.mode === 'live' && state.meta && state.meta.asof) {
      el.style.display = 'block';
      el.textContent = `Updated to: ${formatAsOf(state.meta.asof)}`;
    } else {
      el.style.display = 'none';
      el.textContent = '';
    }
  }

  function tierLabel(row) {
    if (row.division && String(row.division).trim()) return row.division;
    const t = Number(row.tier);
    if (t === 1) return 'Premier League';
    if (t === 2) return 'Championship';
    if (t === 3) return 'League 1';
    if (t === 4) return 'League 2';
    return '';
  }

  function tierClass(label) {
    const s = String(label || '').trim().toLowerCase();
    if (s === 'premier league') return 'tier-premier-league';
    if (s === 'championship') return 'tier-championship';
    if (s === 'league 1' || s === 'league one') return 'tier-league-1';
    if (s === 'league 2' || s === 'league two') return 'tier-league-2';
    return '';
  }

  function updateRatingHeader() {
    const h = document.getElementById('rating-col-head');
    if (!h) return;
    h.textContent = (state.mode === 'live') ? 'Rating' : 'Start Elo';
  }

  function render() {
    const tbody = document.querySelector('#teams tbody');
    tbody.innerHTML = '';

    state.filtered.forEach((r, i) => {
      const tr = document.createElement('tr');

      const tdRank = document.createElement('td');
      tdRank.textContent = i + 1;
      tr.appendChild(tdRank);

      const tdName = document.createElement('td');
      const a = document.createElement('a');
      a.href = `../player/?id=${encodeURIComponent(r.id)}`;
      a.textContent = r.name;
      tdName.appendChild(a);
      tr.appendChild(tdName);

      const tdRt = document.createElement('td');
      tdRt.className = 'right';
      tdRt.textContent = Number.isFinite(+r.rating) ? Math.round(+r.rating) : '';
      tr.appendChild(tdRt);

      const tdTier = document.createElement('td');
      const label = tierLabel(r);

      if (label) {
        const span = document.createElement('span');
        span.className = `tier-badge ${tierClass(label)}`.trim();
        span.textContent = label;
        tdTier.appendChild(span);
      } else {
        tdTier.textContent = '';
      }

      tr.appendChild(tdTier);

      tbody.appendChild(tr);
    });
  }

  function hideCompare() {
    document.getElementById('compare-wrap').style.display = 'none';
    document.getElementById('compare-chart').innerHTML = '';
    lastCompared = [];
  }

  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    state.filtered = !q
      ? state.rows.slice()
      : state.rows.filter(r => r.name.toLowerCase().includes(q));

    updateRatingHeader();
    render();
    hideCompare();
  }

  function rebuildRowsFromMode() {
    const mode = document.getElementById('season').value;
    state.mode = mode;

    if (mode === 'live') {
      state.rows = state.liveRows
        .slice()
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
    } else {
      state.rows = state.seasonStarts
        .filter(d => d.season === mode)
        .map(d => ({
          id: d.id,
          name: d.name,
          rating: +d.elo,
          tier: Number.isFinite(+d.tier) ? +d.tier : null,
          division: d.division || ''
        }))
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
    }

    setAsOfText();
    applyFilter();
  }

  function populateSeasonSelect() {
    const sel = document.getElementById('season');

    const seasons = Array.from(new Set(
      state.seasonStarts.map(d => d.season).filter(Boolean)
    )).sort((a, b) => {
      const ay = parseInt(String(a).slice(0, 4), 10);
      const by = parseInt(String(b).slice(0, 4), 10);
      return by - ay;
    });

    for (const s of seasons) {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      sel.appendChild(opt);
    }
  }

  async function fetchHistoryFor(id) {
    if (histCache.has(id)) return histCache.get(id);

    try {
      const res = await fetch(`../data/history/${encodeURIComponent(id)}.json`, { cache: 'no-cache' });
      if (!res.ok) return null;
      const rows = await res.json();
      histCache.set(id, rows);
      return rows;
    } catch {
      return null;
    }
  }

  async function loadColours() {
    try {
      const res = await fetch(COLOURS_URL, { cache: 'no-cache' });
      if (!res.ok) {
        TEAM_COLOURS = {};
        return;
      }

      TEAM_COLOURS = await res.json();
    } catch {
      TEAM_COLOURS = {};
    }
  }

  function hexToRgb(hex) {
    const clean = String(hex || '').trim();
    const match = clean.match(/^#([0-9a-f]{6})$/i);
    if (!match) return null;

    const value = match[1];
    return {
      r: parseInt(value.slice(0, 2), 16),
      g: parseInt(value.slice(2, 4), 16),
      b: parseInt(value.slice(4, 6), 16)
    };
  }

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b]
      .map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'))
      .join('');
  }

  function relativeLuminance({ r, g, b }) {
    const toLinear = c => {
      const s = c / 255;
      return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    };

    const R = toLinear(r);
    const G = toLinear(g);
    const B = toLinear(b);

    return 0.2126 * R + 0.7152 * G + 0.0722 * B;
  }

  function mixWithWhite(rgb, amount) {
    return {
      r: rgb.r + (255 - rgb.r) * amount,
      g: rgb.g + (255 - rgb.g) * amount,
      b: rgb.b + (255 - rgb.b) * amount
    };
  }

  function getDisplayColour(teamName) {
    const fallback = '#2F80ED';
    const raw = TEAM_COLOURS[teamName] || fallback;
    const rgb = hexToRgb(raw);

    if (!rgb) return fallback;

    const lum = relativeLuminance(rgb);

    if (lum >= 0.05) return raw;

    const lifted = mixWithWhite(rgb, 0.45);
    return rgbToHex(lifted.r, lifted.g, lifted.b);
  }

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({
        x: p.x,
        y: +p.y,
        tier: Number.isFinite(+p.tier) ? +p.tier : null
      }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;

    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;

      lastKey = key;
    }

    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);

    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastTier = pts.length ? (pts[pts.length - 1].tier ?? null) : null;
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg, tier: lastTier };
    });

    return normalise(out, false);
  }

  function applySinceFilter(series, sinceYear) {
    if (!sinceYear) return series;
    const start = new Date(`${sinceYear}-01-01T00:00:00Z`).getTime();
    return series.filter(p => new Date(p.x).getTime() >= start);
  }

  async function buildComparison(teams) {
    lastCompared = teams.slice();

    const wrap = document.getElementById('compare-wrap');
    const chart = document.getElementById('compare-chart');
    const modeSel = document.getElementById('compare-agg');

    wrap.style.display = 'block';
    chart.innerHTML = 'Loading…';

    const mode = modeSel ? modeSel.value : COMPARE_AGG_MODE;
    COMPARE_AGG_MODE = mode;

    const traces = [];
    let ymin = Infinity;
    let ymax = -Infinity;

    for (const t of teams) {
      const hist = await fetchHistoryFor(t.id);
      if (!hist || !hist.length) continue;

      const raw = hist.map(d => ({
        x: d.date,
        y: Number(d.rating),
        tier: Number(d.tier)
      }));

      const filtered = applySinceFilter(raw, COMPARE_SINCE_YEAR);
      const data = aggregate(filtered, mode);

      const xs = data.map(pt => pt.x);
      const ysAll = data.map(pt => pt.y);
      const ys = ysAll.filter(Number.isFinite);
      const tiers = data.map(pt => pt.tier ?? '');

      if (!xs.length || !ys.length) continue;

      ymin = Math.min(ymin, ...ys);
      ymax = Math.max(ymax, ...ys);

      traces.push({
        type: 'scatter',
        name: t.name,
        x: xs,
        y: ysAll,
        customdata: tiers,
        mode: 'lines',
        line: {
          width: 3,
          shape: 'linear',
          color: getDisplayColour(t.name)
        },
        hovertemplate: '%{x}<br>%{y:.0f} Elo<br>Tier %{customdata}<extra>' + t.name + '</extra>',
        connectgaps: true
      });
    }

    if (!traces.length) {
      chart.innerHTML = 'No history found.';
      return;
    }

    ymin = Math.floor(ymin / 100) * 100;
    ymax = Math.ceil(ymax / 100) * 100;

const shapes = [];

for (let v = ymin; v <= ymax; v += 50) {
  const isMajor = v % 100 === 0;

  shapes.push({
    type: 'line',
    xref: 'paper',
    x0: 0,
    x1: 1,
    y0: v,
    y1: v,
    line: {
      width: isMajor ? 2 : 1,
      color: isMajor ? 'rgba(180,180,180,0.55)' : 'rgba(128,128,128,0.22)'
    },
    layer: 'below'
  });
}

    const cs = getComputedStyle(document.body);

    const layout = {
      margin: { l: 60, r: 20, t: 10, b: 45 },
      xaxis: { type: 'date' },
      yaxis: {
  title: 'Rating',
  dtick: 50
},
      legend: { orientation: 'h' },
      paper_bgcolor: cs.backgroundColor,
      plot_bgcolor: cs.backgroundColor,
      font: { color: cs.color, size: 14 },
      shapes
    };

    Plotly.newPlot(chart, traces, layout, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function resetCompareControls() {
    COMPARE_SINCE_YEAR = null;
    COMPARE_AGG_MODE = 'monthly';

    const compareAgg = document.getElementById('compare-agg');
    if (compareAgg) compareAgg.value = COMPARE_AGG_MODE;

    document.querySelectorAll('#compare-wrap .range-btn').forEach(btn => {
      btn.classList.toggle('is-active', btn.getAttribute('data-since') === '');
    });
  }

  function setupCompareButton() {
    const modal = document.getElementById('compare-modal');
    const listDiv = document.getElementById('compare-list');

    function openModal() {
      listDiv.innerHTML = '';

      state.filtered.forEach(t => {
        const id = `chk-${t.id}`;
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `
          <label>
            <input type="checkbox" id="${id}" value="${t.id}" style="margin-right:6px">
            ${t.name} (${Math.round(t.rating)})
          </label>
        `;
        listDiv.appendChild(wrapper);
      });

      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function showSelected() {
      const selectedIds = Array.from(listDiv.querySelectorAll('input:checked')).map(cb => cb.value);
      if (!selectedIds.length) {
        alert('Please select at least one team.');
        return;
      }

      closeModal();
      resetCompareControls();

      const chosen = state.filtered.filter(t => selectedIds.includes(t.id));
      buildComparison(chosen);
    }

    document.getElementById('compare-btn').addEventListener('click', openModal);
    document.getElementById('compare-show-top').addEventListener('click', showSelected);
    document.getElementById('compare-show-bottom').addEventListener('click', showSelected);
    document.getElementById('compare-cancel-top').addEventListener('click', closeModal);
    document.getElementById('compare-cancel-bottom').addEventListener('click', closeModal);
  }

  function setupCompareChartControls() {
    document.getElementById('compare-agg').addEventListener('change', e => {
      COMPARE_AGG_MODE = e.target.value;
      if (lastCompared.length) buildComparison(lastCompared);
    });

    document.querySelectorAll('#compare-wrap .range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#compare-wrap .range-btn').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        const v = btn.getAttribute('data-since');
        COMPARE_SINCE_YEAR = v ? Number(v) : null;

        if (lastCompared.length) buildComparison(lastCompared);
      });
    });
  }

  async function load() {
    try {
      const [teamsRes, seasonRes, metaRes] = await Promise.all([
        fetch(DATA_URL, { cache: 'no-cache' }),
        fetch(SEASON_STARTS_URL, { cache: 'no-cache' }),
        fetch(META_URL, { cache: 'no-cache' })
      ]);

      if (!teamsRes.ok) throw new Error('Failed to load teams.json');
      if (!seasonRes.ok) throw new Error('Failed to load season_starts.json');

      const teamsData = await teamsRes.json();
      const seasonData = await seasonRes.json();

      state.meta = metaRes.ok ? await metaRes.json() : null;

      state.liveRows = (Array.isArray(teamsData) ? teamsData : [])
        .filter(d => d && d.id && d.name && Number.isFinite(+d.rating))
        .map(d => ({
          id: d.id,
          name: d.name,
          rating: +d.rating,
          tier: Number.isFinite(+d.tier) ? +d.tier : null,
          division: d.division || ''
        }))
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));

      state.seasonStarts = Array.isArray(seasonData)
        ? seasonData.filter(d => d && d.id && d.name && d.season && Number.isFinite(+d.elo))
        : [];

      populateSeasonSelect();
      rebuildRowsFromMode();
    } catch (err) {
      const asofEl = document.getElementById('asof');
      if (asofEl) {
        asofEl.style.display = 'none';
        asofEl.textContent = '';
      }

      document.querySelector('#teams tbody').innerHTML =
        `<tr><td colspan="4">Error loading data: ${err.message}</td></tr>`;
    }
  }

  document.getElementById('season').addEventListener('change', rebuildRowsFromMode);
  document.getElementById('q').addEventListener('input', applyFilter);

  setupCompareButton();
  setupCompareChartControls();

  loadColours()
    .then(load)
    .catch(err => {
      console.error(err);
      load();
    });
</script>
</body>
</html>
