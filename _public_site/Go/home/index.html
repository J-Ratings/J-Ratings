<button type="button" class="seg" data-range="2020" aria-pressed="false">2020–Present</button>

<script>
const DATA_URL = '../data/players.json';
const ERA_STARTS_URL = '../data/era_starts.json';
const META_URL = '../data/meta.json';
const FLAGS_BASE = '../../flags';
const PAGE_SIZE = 100;

const COUNTRY_LABELS = {
  ar: 'Argentina',
  ca: 'Canada',
  cn: 'China',
  fr: 'France',
  gb: 'United Kingdom',
  hk: 'Hong Kong',
  il: 'Israel',
  jp: 'Japan',
  kr: 'Korea',
  my: 'Malaysia',
  nl: 'Netherlands',
  pl: 'Poland',
  ro: 'Romania',
  ru: 'Russia',
  sg: 'Singapore',
  sk: 'Slovakia',
  tw: 'Taiwan',
  ua: 'Ukraine',
  us: 'United States'
};

const PRIORITY_COUNTRY_ORDER = ['cn', 'jp', 'kr', 'tw'];

const state = {
  mode: 'live',
  meta: null,
  liveRows: [],
  eraStarts: [],
  rows: [],
  filtered: [],
  visibleCount: PAGE_SIZE
};

const histCache = new Map();

let compareChart = null;
let lastCompared = [];

function formatAsOf(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);

  if (!y || !m || !d) return iso;

  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  return `${d} ${months[m - 1]} ${y}`;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function normaliseFlagCode(code) {
  return String(code || '').trim().toLowerCase();
}

function normaliseGender(value) {
  return String(value || '').trim().toLowerCase();
}

function getCountryLabel(flagCode) {
  const code = normaliseFlagCode(flagCode);

  if (!code) return '';

  return COUNTRY_LABELS[code] || code.toUpperCase();
}

function flagImgHtml(flagCode, label) {
  const code = normaliseFlagCode(flagCode);

  if (!code) return '';

  const safeLabel = escapeHtml(label || '');

  return `<img src="${FLAGS_BASE}/${encodeURIComponent(code)}.svg" alt="${safeLabel}" title="${safeLabel}" class="flag-icon" loading="lazy">`;
}

function parseIsoDate(value) {
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}

function subtractYears(date, years) {
  const d = new Date(date);
  d.setFullYear(d.getFullYear() - years);
  return d;
}

function setAsOfText() {
  const el = document.getElementById('asof');

  if (!el) return;

  if (state.mode === 'live' && state.meta && state.meta.asof) {
    el.style.display = 'block';
    el.textContent = `Updated to: ${formatAsOf(state.meta.asof)}`;
  } else {
    el.style.display = 'none';
    el.textContent = '';
  }
}

function updateHeaders() {
  const h = document.getElementById('rating-col-head');

  if (!h) return;

  h.textContent = state.mode === 'live' ? 'Rating' : 'Start Elo';
}

function render() {
  const tbody = document.querySelector('#players tbody');
  const showMoreBtn = document.getElementById('show-more-btn');

  tbody.innerHTML = '';

  const visibleRows = state.filtered.slice(0, state.visibleCount);

  visibleRows.forEach((r, i) => {
    const tr = document.createElement('tr');

    const tdRank = document.createElement('td');

const selectedCountry = document.getElementById('country').value;
const selectedGender = document.getElementById('gender').value;

const hasRankingFilter =
  selectedCountry !== 'all' ||
  selectedGender !== 'all';

tdRank.textContent = hasRankingFilter
  ? `${i + 1} (${r.rank})`
  : r.rank;

tr.appendChild(tdRank);

    const tdFlag = document.createElement('td');
    tdFlag.className = 'flag-cell';
    tdFlag.innerHTML = flagImgHtml(r.flag, getCountryLabel(r.flag) || r.name || r.id);
    tr.appendChild(tdFlag);

    const tdName = document.createElement('td');
    const a = document.createElement('a');
    a.href = `../player/?id=${encodeURIComponent(r.id)}`;
    a.textContent = r.name || r.id;
    tdName.appendChild(a);
    tr.appendChild(tdName);

    const tdRt = document.createElement('td');
    tdRt.className = 'right';
    tdRt.textContent = Number.isFinite(+r.rating) ? Math.round(+r.rating) : '';
    tr.appendChild(tdRt);

    tbody.appendChild(tr);
  });

  if (showMoreBtn) {
    showMoreBtn.style.display =
      state.visibleCount < state.filtered.length ? 'inline-block' : 'none';
  }
}

function hideCompare() {
  document.getElementById('compare-wrap').style.display = 'none';
  document.getElementById('compare-chart').innerHTML = '';
  lastCompared = [];
}

function applyFilter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const selectedCountry = document.getElementById('country').value;
  const selectedGender = document.getElementById('gender').value;

  state.filtered = state.rows.filter(r => {
    const matchesName = !q || (r.name || '').toLowerCase().includes(q);

    const matchesCountry =
      selectedCountry === 'all' ||
      normaliseFlagCode(r.flag) === selectedCountry;

    const matchesGender =
      selectedGender === 'all' ||
      normaliseGender(r.gender) === selectedGender;

    return matchesName && matchesCountry && matchesGender;
  });

  state.visibleCount = PAGE_SIZE;

  updateHeaders();
  render();
  hideCompare();
}

function populateCountrySelect() {
  const sel = document.getElementById('country');

  if (!sel) return;

  const previousValue = sel.value || 'all';

  const countryCodes = Array.from(new Set(
    state.rows
      .map(r => normaliseFlagCode(r.flag))
      .filter(Boolean)
  ));

  countryCodes.sort((a, b) => {
    const ai = PRIORITY_COUNTRY_ORDER.indexOf(a);
    const bi = PRIORITY_COUNTRY_ORDER.indexOf(b);

    const aPriority = ai !== -1;
    const bPriority = bi !== -1;

    if (aPriority && bPriority) return ai - bi;
    if (aPriority) return -1;
    if (bPriority) return 1;

    return getCountryLabel(a).localeCompare(getCountryLabel(b));
  });

  sel.innerHTML = '<option value="all">All</option>';

  for (const code of countryCodes) {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = getCountryLabel(code);
    sel.appendChild(opt);
  }

  sel.value = countryCodes.includes(previousValue) ? previousValue : 'all';
}

function rebuildRowsFromMode() {
  const mode = document.getElementById('era').value;
  state.mode = mode;

  if (mode === 'live') {
    state.rows = state.liveRows
      .slice()
      .sort((a, b) =>
        b.rating - a.rating ||
        (a.name || '').localeCompare(b.name || '')
      );
  } else {
    state.rows = state.eraStarts
      .filter(d => String(d.era) === String(mode))
      .map(d => ({
        id: d.id,
        name: d.name || d.id,
        flag: d.flag || '',
        gender: d.gender || '',
        rating: +d.elo,
        tournament: d.tournament || ''
      }))
      .sort((a, b) =>
        b.rating - a.rating ||
        (a.name || '').localeCompare(b.name || '')
      );
  }

state.rows = state.rows.map((r, i) => ({
  ...r,
  rank: i + 1
}));

setAsOfText();
populateCountrySelect();
applyFilter();
}

function populateEraSelect() {
  const sel = document.getElementById('era');

  const eras = Array.from(new Set(
    state.eraStarts.map(d => d.era).filter(Boolean)
  )).sort((a, b) => {
    const an = Number(a);
    const bn = Number(b);

    if (Number.isFinite(an) && Number.isFinite(bn)) return bn - an;

    return String(b).localeCompare(String(a));
  });

  for (const e of eras) {
    const opt = document.createElement('option');
    opt.value = e;
    opt.textContent = e;
    sel.appendChild(opt);
  }
}

async function fetchHistoryFor(id) {
  if (histCache.has(id)) return histCache.get(id);

  try {
    const res = await fetch(`../data/history/${encodeURIComponent(id)}.json`, {
      cache: 'no-cache'
    });

    if (!res.ok) return null;

    const rows = await res.json();

    histCache.set(id, rows);

    return rows;
  } catch {
    return null;
  }
}

async function buildComparison(players) {
  const wrap = document.getElementById('compare-wrap');
  const chart = document.getElementById('compare-chart');

  wrap.style.display = 'block';
  chart.innerHTML = 'Loading…';

  lastCompared = [];

  for (const p of players) {
    const hist = await fetchHistoryFor(p.id);

    if (!hist || !hist.length) continue;

    lastCompared.push({
      name: p.name || p.id,
      raw: hist.map(d => ({
        x: d.date,
        y: Number(d.rating),
        tournament: d.tournament || d.event || ''
      })),
      customData: pt => pt.tournament || '',
      hovertemplate:
        '%{x|%d %b %Y}<br>%{y:.0f} Rating<extra>' +
        (p.name || p.id) +
        '</extra>'
    });
  }

  if (!lastCompared.length) {
    chart.innerHTML = 'No history found.';
    return;
  }

  compareChart.render(lastCompared);
}

function setupCompareButton() {
  const modal = document.getElementById('compare-modal');
  const listDiv = document.getElementById('compare-list');

  function openModal() {
    listDiv.innerHTML = '';

    state.filtered.forEach(p => {
      const id = `chk-${p.id}`;
      const label = `${p.name || p.id} (${Math.round(p.rating)})`;

      const wrapper = document.createElement('div');

      wrapper.innerHTML = `
        <label>
          <input type="checkbox" id="${id}" value="${p.id}" style="margin-right:6px">
          ${escapeHtml(label)}
        </label>
      `;

      listDiv.appendChild(wrapper);
    });

    modal.style.display = 'flex';
  }

  function closeModal() {
    modal.style.display = 'none';
  }

  function showSelected() {
    const selectedIds = Array.from(listDiv.querySelectorAll('input:checked'))
      .map(cb => cb.value);

    if (!selectedIds.length) {
      alert('Please select at least one player.');
      return;
    }

    closeModal();

    const chosen = state.filtered.filter(p =>
      selectedIds.includes(String(p.id))
    );

    buildComparison(chosen);
  }

  document.getElementById('compare-btn').addEventListener('click', openModal);
  document.getElementById('compare-show-top').addEventListener('click', showSelected);
  document.getElementById('compare-close').addEventListener('click', closeModal);
}

async function load() {
  try {
    const [playersRes, eraRes, metaRes] = await Promise.all([
      fetch(DATA_URL, { cache: 'no-cache' }),
      fetch(ERA_STARTS_URL, { cache: 'no-cache' }),
      fetch(META_URL, { cache: 'no-cache' })
    ]);

    if (!playersRes.ok) throw new Error('Failed to load players.json');
    if (!eraRes.ok) throw new Error('Failed to load era_starts.json');

    const playersData = await playersRes.json();
    const eraData = await eraRes.json();

    state.meta = metaRes.ok ? await metaRes.json() : null;

    const asOfDate = state.meta && state.meta.asof
      ? parseIsoDate(state.meta.asof)
      : null;

    const cutoffDate = asOfDate
      ? subtractYears(asOfDate, 2)
      : null;

    const baseLiveRows = (Array.isArray(playersData) ? playersData : [])
      .filter(d =>
        d &&
        d.id &&
        (d.name || d.display_name) &&
        Number.isFinite(+d.rating)
      )
      .map(d => ({
        id: String(d.id),
        name: d.display_name || d.name || d.id,
        flag: d.flag || '',
        gender: d.gender || '',
        rating: +d.rating,
        peak: Number.isFinite(+d.peak) ? +d.peak : null,
        peak_date: d.peak_date || null,
        last_date: d.last_date || null
      }));

    if (cutoffDate) {
      state.liveRows = baseLiveRows
        .filter(player => {
          const lastPlayed = parseIsoDate(player.last_date);
          return lastPlayed && lastPlayed >= cutoffDate;
        })
        .sort((a, b) =>
          b.rating - a.rating ||
          (a.name || '').localeCompare(b.name || '')
        );
    } else {
      state.liveRows = baseLiveRows
        .sort((a, b) =>
          b.rating - a.rating ||
          (a.name || '').localeCompare(b.name || '')
        );
    }

    state.eraStarts = Array.isArray(eraData)
      ? eraData.filter(d => d && d.id && d.era && Number.isFinite(+d.elo))
      : [];

    populateEraSelect();
    rebuildRowsFromMode();
  } catch (err) {
    const asofEl = document.getElementById('asof');

    if (asofEl) {
      asofEl.style.display = 'none';
      asofEl.textContent = '';
    }

    document.querySelector('#players tbody').innerHTML =
      `<tr><td colspan="4">Error loading data: ${escapeHtml(err.message)}</td></tr>`;
  }
}

window.addEventListener('DOMContentLoaded', () => {
  compareChart = JRGraph.createChart({
    chartId: 'compare-chart',
    aggId: 'compare-agg',
    controlsEl: document.getElementById('compare-wrap'),
    defaultRange: 'ALL',
    getItems: () => lastCompared
  });

  document.getElementById('era').addEventListener('change', rebuildRowsFromMode);
  document.getElementById('country').addEventListener('change', applyFilter);
  document.getElementById('gender').addEventListener('change', applyFilter);
  document.getElementById('q').addEventListener('input', applyFilter);

  document.getElementById('show-more-btn').addEventListener('click', () => {
    state.visibleCount += PAGE_SIZE;
    render();
  });
load();
});
</script>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const rangeButtons = Array.from(
    document.querySelectorAll('#compare-wrap .seg[data-range]')
  );

  const activateRangeButton = (button) => {
    rangeButtons.forEach(btn => {
      btn.classList.remove('active', 'is-active');
      btn.setAttribute('aria-pressed', 'false');
    });

    if (button) {
      button.classList.add('active', 'is-active');
      button.setAttribute('aria-pressed', 'true');
    }
  };

  const defaultButton =
    document.querySelector('#compare-wrap .seg[data-range="ALL"]');

  activateRangeButton(defaultButton);

  rangeButtons.forEach(btn => {
    btn.addEventListener('click', () => activateRangeButton(btn));
  });
});
</script>
