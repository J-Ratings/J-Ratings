const DARK_LINE_OVERRIDES = {

};

const state = { rows: [], filtered: [] };
const histCache = new Map();
let lastCompared = [];
let COMPARE_SINCE_YEAR = 2010;

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function normaliseFlagCode(code) {
  return String(code || '').trim().toLowerCase();
}

function resolveFlagCode(flagCode, teamName) {
  const name = String(teamName || '').trim().toLowerCase();
  if (name === 'ireland') return 'irfu';
  return normaliseFlagCode(flagCode);
}

function flagImgHtml(flagCode, label) {
  const code = resolveFlagCode(flagCode, label);
  if (!code) return '';
  const safeLabel = escapeHtml(label || '');
  return `<img src="${FLAGS_BASE}/${encodeURIComponent(code)}.svg" alt="${safeLabel}" title="${safeLabel}" class="flag-icon" loading="lazy">`;
}

function render() {
  const tbody = document.querySelector('#teams tbody');
  tbody.innerHTML = '';

  state.filtered.forEach((r, i) => {
    const tr = document.createElement('tr');

    const tdRank = document.createElement('td');
    tdRank.textContent = i + 1;
    tr.appendChild(tdRank);

    const tdFlag = document.createElement('td');
    tdFlag.className = 'flag-cell';
    tdFlag.innerHTML = flagImgHtml(r.flag, r.name);
    tr.appendChild(tdFlag);

    const tdName = document.createElement('td');
    const a = document.createElement('a');
    a.href = `../player/?id=${encodeURIComponent(r.id)}`;
    a.textContent = r.name;
    tdName.appendChild(a);
    tr.appendChild(tdName);

    const tdPeak = document.createElement('td');
    tdPeak.className = 'right';
    tdPeak.textContent = r.peak;
    tr.appendChild(tdPeak);

    const tdDate = document.createElement('td');
    tdDate.textContent = r.peak_date || '';
    tr.appendChild(tdDate);

    tbody.appendChild(tr);
  });

  const count = document.getElementById('count');
  if (count) count.textContent = `${state.filtered.length} teams`;
}

function hideCompare() {
  const wrap = document.getElementById('compare-wrap');
  const chart = document.getElementById('compare-chart');
  if (wrap) wrap.style.display = 'none';
  if (chart) chart.innerHTML = '';
  lastCompared = [];
}

function applyFilter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  state.filtered = q
    ? state.rows.filter(r => r.name.toLowerCase().includes(q))
    : state.rows.slice();

  render();
  hideCompare();
}

async function fetchHistoryFor(id) {
  if (histCache.has(id)) return histCache.get(id);

  try {
    const res = await fetch(`../data/history/${encodeURIComponent(id)}.json`, { cache: 'no-cache' });
    if (!res.ok) return null;
    const rows = await res.json();
    histCache.set(id, rows);
    return rows;
  } catch {
    return null;
  }
}

function normalise(series, dedupeByDay = false) {
  const s = series
    .filter(p => p && p.x && Number.isFinite(p.y))
    .map(p => ({
      x: p.x,
      y: +p.y,
      competition: p.competition || p.tournament || ''
    }))
    .sort((a, b) => new Date(a.x) - new Date(b.x));

  if (!dedupeByDay) return s;

  const out = [];
  let lastKey = null;

  for (const p of s) {
    const d = new Date(p.x);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    if (key !== lastKey) out.push(p);
    else out[out.length - 1] = p;

    lastKey = key;
  }

  return out;
}

function aggregate(series, mode) {
  if (mode === 'daily') return normalise(series, true);

  const buckets = Object.create(null);

  for (const p of series) {
    const d = new Date(p.x);
    const key = mode === 'monthly'
      ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
      : `${d.getFullYear()}`;

    (buckets[key] ||= []).push(p);
  }

  const out = Object.keys(buckets).sort().map(k => {
    const pts = buckets[k].filter(p => Number.isFinite(p.y));
    const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
    const lastCompetition = pts.length ? (pts[pts.length - 1].competition || '') : '';
    const x = k.length === 7 ? `${k}-01` : `${k}-01-01`;

    return { x, y: avg, competition: lastCompetition };
  });

  return normalise(out, false);
}

function applySinceFilter(series, sinceYear) {
  if (!sinceYear) return series;
  const start = new Date(`${sinceYear}-01-01T00:00:00Z`).getTime();
  return series.filter(p => new Date(p.x).getTime() >= start);
}

function hexToRgb(hex) {
  const clean = String(hex || '').trim();
  const match = clean.match(/^#([0-9a-f]{6})$/i);
  if (!match) return null;

  const value = match[1];
  return {
    r: parseInt(value.slice(0, 2), 16),
    g: parseInt(value.slice(2, 4), 16),
    b: parseInt(value.slice(4, 6), 16)
  };
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b]
    .map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'))
    .join('');
}

function relativeLuminance({ r, g, b }) {
  const toLinear = c => {
    const s = c / 255;
    return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  };

  const R = toLinear(r);
  const G = toLinear(g);
  const B = toLinear(b);

  return 0.2126 * R + 0.7152 * G + 0.0722 * B;
}

function mixWithWhite(rgb, amount) {
  return {
    r: rgb.r + (255 - rgb.r) * amount,
    g: rgb.g + (255 - rgb.g) * amount,
    b: rgb.b + (255 - rgb.b) * amount
  };
}

function getDisplayColour(teamName) {
  if (DARK_LINE_OVERRIDES[teamName]) return DARK_LINE_OVERRIDES[teamName];

  const fallback = '#2F80ED';
  const raw = TEAM_COLOURS[teamName] || fallback;
  const rgb = hexToRgb(raw);

  if (!rgb) return fallback;

  const lum = relativeLuminance(rgb);
  if (lum >= 0.05) return raw;

  const lifted = mixWithWhite(rgb, 0.45);
  return rgbToHex(lifted.r, lifted.g, lifted.b);
}

async function buildComparison(teams) {
  lastCompared = teams.slice();

  const wrap = document.getElementById('compare-wrap');
  const chart = document.getElementById('compare-chart');
  const modeSel = document.getElementById('compare-agg');

  if (wrap) wrap.style.display = 'block';
  if (chart) chart.innerHTML = 'Loading…';

  const mode = modeSel ? modeSel.value : 'monthly';
  const traces = [];
  let ymin = Infinity;
  let ymax = -Infinity;

  for (const t of teams) {
    const hist = await fetchHistoryFor(t.id);
    if (!hist || !hist.length) continue;

    const raw = normalise(
      hist.map(d => ({
        x: d.date,
        y: Number(d.rating),
        competition: d.competition || d.tournament || ''
      })),
      true
    );

    const filtered = applySinceFilter(raw, COMPARE_SINCE_YEAR);
    const data = aggregate(filtered, mode);

    const xs = data.map(pt => pt.x);
    const ysAll = data.map(pt => pt.y);
    const competitions = data.map(pt => pt.competition || '');
    const finiteY = ysAll.filter(Number.isFinite);

    if (!xs.length || !finiteY.length) continue;

    ymin = Math.min(ymin, ...finiteY);
    ymax = Math.max(ymax, ...finiteY);

    traces.push({
      type: 'scatter',
      name: t.name,
      x: xs,
      y: ysAll,
      customdata: competitions,
      mode: 'lines',
      line: {
        width: 3,
        shape: 'linear',
        color: getDisplayColour(t.name)
      },
      hovertemplate: mode === 'daily'
        ? '%{x}<br>%{y:.0f} Elo<br>%{customdata}<extra>' + t.name + '</extra>'
        : '%{x}<br>%{y:.0f} Elo<extra>' + t.name + '</extra>',
      connectgaps: true,
      showlegend: true
    });
  }

  if (!traces.length) {
    if (chart) chart.innerHTML = 'No history found.';
    return;
  }

  ymin = Math.floor(ymin / 100) * 100;
  ymax = Math.ceil(ymax / 100) * 100;

  const shapes = [];
  for (let v = ymin; v <= ymax; v += 100) {
    shapes.push({
      type: 'line',
      xref: 'paper',
      x0: 0,
      x1: 1,
      y0: v,
      y1: v,
      line: { width: 1, color: 'rgba(128,128,128,0.35)' },
      layer: 'below'
    });
  }

  const cs = getComputedStyle(document.body);

  Plotly.newPlot('compare-chart', traces, {
    margin: { l: 60, r: 20, t: 50, b: 55 },
    xaxis: { type: 'date' },
    yaxis: { title: 'Rating' },
    legend: {
      orientation: 'h',
      y: 1.12,
      x: 0
    },
    paper_bgcolor: cs.backgroundColor,
    plot_bgcolor: cs.backgroundColor,
    font: { color: cs.color, size: 14 },
    shapes
  }, {
    staticPlot: IS_TOUCH,
    displayModeBar: false,
    responsive: true
  });
}

function setupCompareButton() {
  const modal = document.getElementById('compare-modal');
  const listDiv = document.getElementById('compare-list');

  function openModal() {
    listDiv.innerHTML = '';

    state.filtered.forEach(t => {
      const id = `chk-${t.id}`;
      const row = document.createElement('div');
      row.className = 'compare-list-row';
      row.innerHTML = `
        <label for="${id}">
          <input type="checkbox" id="${id}" value="${t.id}">
          ${escapeHtml(t.name)} (${t.peak})
        </label>
      `;
      listDiv.appendChild(row);
    });

    modal.style.display = 'flex';
  }

  function closeModal() {
    modal.style.display = 'none';
  }

  function showSelected() {
    const ids = Array.from(listDiv.querySelectorAll('input:checked')).map(cb => cb.value);

    if (!ids.length) {
      alert('Please select at least one team.');
      return;
    }

    closeModal();

    const compareAgg = document.getElementById('compare-agg');
    if (compareAgg) compareAgg.value = 'monthly';

    document.querySelectorAll('.range-btn').forEach(btn => btn.classList.remove('is-active'));
    const since2000Btn = document.querySelector('.range-btn[data-since="2000"]');
    if (since2000Btn) since2000Btn.classList.add('is-active');
    COMPARE_SINCE_YEAR = 2010;

    const chosen = state.filtered.filter(t => ids.includes(t.id));
    buildComparison(chosen);
  }

  document.getElementById('compare-btn').addEventListener('click', openModal);
  document.getElementById('compare-show-top').addEventListener('click', showSelected);
    document.getElementById('compare-close').addEventListener('click', closeModal);

  modal.addEventListener('click', e => {
    if (e.target === modal) closeModal();
  });
}

async function load() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('Failed to load teams.json');

    const teams = await res.json();

    const baseRows = teams
      .filter(d => d && d.id && (d.name || d.display_name))
      .map(d => ({
        id: d.id,
        name: d.display_name || d.name,
        flag: d.flag || ''
      }));

    const withPeaks = await Promise.all(baseRows.map(async (t) => {
      const hist = await fetchHistoryFor(t.id);
      if (!hist || !hist.length) return null;

      let peak = -Infinity;
      let peakDate = '';

      for (const row of hist) {
        const r = Number(row.rating);
        if (!Number.isFinite(r)) continue;

        if (r > peak) {
          peak = r;
          peakDate = row.date || '';
        }
      }

      if (!Number.isFinite(peak)) return null;

      return {
        id: t.id,
        name: t.name,
        flag: t.flag,
        peak: Math.round(peak),
        peak_date: peakDate
      };
    }));

    state.rows = withPeaks
      .filter(Boolean)
      .sort((a, b) => b.peak - a.peak || a.name.localeCompare(b.name));

    state.filtered = state.rows.slice();
    render();
  } catch (err) {
    document.querySelector('#teams tbody').innerHTML =
      `<tr><td colspan="5">Error loading data: ${escapeHtml(err.message)}</td></tr>`;
  }
}

document.getElementById('q').addEventListener('input', applyFilter);

document.getElementById('compare-agg').addEventListener('change', () => {
  if (lastCompared.length) buildComparison(lastCompared);
});

document.querySelectorAll('.range-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('is-active'));
    btn.classList.add('is-active');

    const v = btn.getAttribute('data-since');
    COMPARE_SINCE_YEAR = v ? Number(v) : null;

    if (lastCompared.length) buildComparison(lastCompared);
  });
});
load();
</script>
