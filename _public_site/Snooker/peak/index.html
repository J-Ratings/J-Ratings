<!doctype html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JXCC4EDPY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <meta charset="utf-8">
  <title>J-Ratings: Snooker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    #compare-chart { height: 500px; }

    .toolbar {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    #compare-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #compare-modal > div {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 80%;
      overflow: auto;
      color: #fff;
    }

    .compare-controls {
      margin: 10px 0;
    }

    .compare-controls button {
      margin-right: 10px;
    }

    .flag-cell {
      text-align: center;
      vertical-align: middle;
      width: 52px;
    }

    .flag-icon {
      width: 36.3px;
      height: 26.4px;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    @media (max-width: 520px) {
      #players {
        width: 100%;
        table-layout: fixed;
      }

      #players th,
      #players td {
        min-width: 0 !important;
        padding: 10px 8px;
      }

      #players th:nth-child(1),
      #players td:nth-child(1) { width: 52px; }

      #players th:nth-child(2),
      #players td:nth-child(2) { width: 56px; }

      #players th:nth-child(4),
      #players td:nth-child(4) { width: 78px; }

      #players th:nth-child(5),
      #players td:nth-child(5) { width: 84px; }

      #players th:nth-child(3),
      #players td:nth-child(3) { width: auto; }

      #players td:nth-child(3) a {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .flag-icon {
        width: 30px;
        height: 21.8px;
      }
    }
  

    /* Home-style comparison modal */
    #compare-modal > div{
      padding:0 !important;
      max-width:560px;
      width:90%;
      max-height:80%;
      display:flex;
      flex-direction:column;
      overflow:hidden !important;
    }

    .compare-modal-header{
      position:sticky;
      top:0;
      z-index:2;
      background:#1a1a1a;
      padding:20px 20px 12px;
      border-bottom:1px solid #2b2f36;
    }

    .compare-modal-title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:12px;
    }

    .compare-modal-title-row h3{ margin:0; }

    .compare-close{
      border:0;
      background:transparent;
      color:inherit;
      font-size:1.8rem;
      line-height:1;
      padding:0 4px;
      cursor:pointer;
    }

    .compare-close:hover{ opacity:.8; }

    .compare-controls{ margin:0 !important; }

    #compare-list{
      overflow-y:auto;
      padding:12px 20px 20px;
      margin:0 !important;
    }

    @media (min-width:769px){
      #players-panel > .toolbar,
      #teams-panel > .toolbar{
        gap:12px;
        padding:22px 20px 18px;
        margin-bottom:0;
      }

      #players-panel > .toolbar input,
      #players-panel > .toolbar select,
      #players-panel > .toolbar button,
      #teams-panel > .toolbar input,
      #teams-panel > .toolbar select,
      #teams-panel > .toolbar button{
        font-size:1.05rem;
        padding-top:12px;
        padding-bottom:12px;
      }

      #players-panel > .toolbar label,
      #teams-panel > .toolbar label{
        font-size:1.05rem;
      }
    }

    /* Home-style peak table */
    .table-wrap{
      width:min(86vw, 1100px);
      margin:0 auto;
    }

    #players,
    #teams{
      width:100%;
      table-layout:fixed;
    }

    #players th,
    #players td,
    #teams th,
    #teams td{
      border-right:1px solid rgba(128,128,128,0.18);
    }

    #players th:last-child,
    #players td:last-child,
    #teams th:last-child,
    #teams td:last-child{
      border-right:none;
    }

    #players tbody tr:nth-child(even),
    #teams tbody tr:nth-child(even){
      background:rgba(255,255,255,0.018);
    }

    @media (min-width:521px){
      #players th,
      #teams th{
        font-size:1.55rem;
      }

      #players td,
      #teams td{
        font-size:1.45rem;
      }

      .flag-icon{
        width:54px;
        height:40px;
      }
    }

    @media (min-width:521px){
      #players th:nth-child(1), #players td:nth-child(1),
      #teams th:nth-child(1), #teams td:nth-child(1){ width:10%; }

      #players th:nth-child(2), #players td:nth-child(2),
      #teams th:nth-child(2), #teams td:nth-child(2){ width:12%; }

      #players th:nth-child(3), #players td:nth-child(3),
      #teams th:nth-child(3), #teams td:nth-child(3){ width:38%; }

      #players th:nth-child(4), #players td:nth-child(4),
      #teams th:nth-child(4), #teams td:nth-child(4){ width:16%; }

      #players th:nth-child(5), #players td:nth-child(5),
      #teams th:nth-child(5), #teams td:nth-child(5){ width:24%; }
    }

  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a href="../home/" class="brand-with-logo">
        <span>J-Ratings <span class="title-snooker">Snooker </span></span>
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="/index.html">Sports</a>
      <a href="../home/">Home</a>
<a href="./" class="active-tab">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="players-panel">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by name…">
      <span id="count" class="muted"></span>
</div>

    <div id="compare-wrap" style="display:none; padding:16px">
      <div id="compare-chart">Loading…</div>
    </div>

    <div class="table-wrap">
      <table id="players">
        <thead>
          <tr>
            <th style="min-width:60px">Rank</th>
            <th style="min-width:72px">Country</th>
            <th style="min-width:240px">Player</th>
            <th class="right" style="min-width:120px">Peak</th>
            <th style="min-width:140px">Peak date</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<div id="compare-modal">
  <div>
    <div class="compare-modal-header">
      <div class="compare-modal-title-row">
        <h3>Select players to view:</h3>
        <button id="compare-close" class="compare-close" type="button" aria-label="Close comparison">×</button>
      </div>

      <div class="compare-controls">
        <button id="compare-show-top" type="button">Show Selected</button>
      </div>
    </div>

    <div id="compare-list"></div>
  </div>
</div>
</div>

<script>
  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

  const state = {
    rows: [],
    filtered: []
  };

  const histCache = new Map();
  let lastCompared = [];

  function playersUrl() { return '../data/players.json'; }
  function historyUrl(id) { return `../data/history/${encodeURIComponent(id)}.json`; }

  function nationalityToFlagCode(n) {
    if (!n) return null;
    if (n === 'Mixed' || n === 'Rest of The World') return null;

    const map = {
      'Afghanistan': 'af',
      'Albania': 'al',
      'Armenia': 'am',
      'Australia': 'au',
      'Austria': 'at',
      'Bahrain': 'bh',
      'Bangladesh': 'bd',
      'Belarus': 'by',
      'Belgium': 'be',
      'Bosnia and Herzegovina': 'ba',
      'Brazil': 'br',
      'Bulgaria': 'bg',
      'Cambodia': 'kh',
      'Canada': 'ca',
      'Chile': 'cl',
      'China': 'cn',
      'Croatia': 'hr',
      'Cyprus': 'cy',
      'Czech Republic': 'cz',
      'Denmark': 'dk',
      'Egypt': 'eg',
      'England': 'gb-eng',
      'Scotland': 'gb-sct',
      'Wales': 'gb-wls',
      'Northern Ireland': 'gb-nir',
      'Estonia': 'ee',
      'Fiji': 'fj',
      'Finland': 'fi',
      'France': 'fr',
      'Germany': 'de',
      'Gibraltar': 'gi',
      'Great Britain': 'gb',
      'Greece': 'gr',
      'Guatemala': 'gt',
      'Guernsey': 'gg',
      'Hong Kong': 'hk',
      'Hungary': 'hu',
      'Iceland': 'is',
      'India': 'in',
      'Indonesia': 'id',
      'Iran': 'ir',
      'Iraq': 'iq',
      'Ireland': 'ie',
      'Isle of Man': 'im',
      'Israel': 'il',
      'Italy': 'it',
      'Jamaica': 'jm',
      'Japan': 'jp',
      'Jersey': 'je',
      'Jordan': 'jo',
      'Kenya': 'ke',
      'Kuwait': 'kw',
      'Kyrgyzstan': 'kg',
      'Latvia': 'lv',
      'Libya': 'ly',
      'Lithuania': 'lt',
      'Malaysia': 'my',
      'Malta': 'mt',
      'Moldova': 'md',
      'Mongolia': 'mn',
      'Morocco': 'ma',
      'Nepal': 'np',
      'Netherlands': 'nl',
      'New Zealand': 'nz',
      'North Macedonia': 'mk',
      'Norway': 'no',
      'Oman': 'om',
      'Pakistan': 'pk',
      'Philippines': 'ph',
      'Poland': 'pl',
      'Portugal': 'pt',
      'Qatar': 'qa',
      'Romania': 'ro',
      'Russia': 'ru',
      'Samoa': 'ws',
      'Saudi Arabia': 'sa',
      'Serbia': 'rs',
      'Singapore': 'sg',
      'Slovakia': 'sk',
      'South Africa': 'za',
      'South Korea': 'kr',
      'Spain': 'es',
      'Sri Lanka': 'lk',
      'Sweden': 'se',
      'Switzerland': 'ch',
      'Syria': 'sy',
      'Taiwan': 'tw',
      'Thailand': 'th',
      'Trinidad and Tobago': 'tt',
      'Turkey': 'tr',
      'Ukraine': 'ua',
      'United Arab Emirates': 'ae',
      'United States': 'us'
    };

    return map[n] || null;
  }

  function flagImgHtml(nationality) {
    const code = nationalityToFlagCode(nationality);
    if (!code) return '';
    const safeNationality = String(nationality || '').replace(/"/g, '&quot;');
    return `<img src="../../flags/${code}.svg" alt="${safeNationality}" title="${safeNationality}" class="flag-icon">`;
  }

  function render() {
    const tbody = document.querySelector('#players tbody');
    tbody.innerHTML = '';

    state.filtered.forEach((r, i) => {
      const tr = document.createElement('tr');

      const tdRank = document.createElement('td');
      tdRank.textContent = i + 1;
      tr.appendChild(tdRank);

      const tdCountry = document.createElement('td');
      tdCountry.className = 'flag-cell';
      tdCountry.innerHTML = flagImgHtml(r.nationality);
      tr.appendChild(tdCountry);

      const tdName = document.createElement('td');
      const a = document.createElement('a');
      a.href = `../player/?id=${encodeURIComponent(r.id)}`;
      a.textContent = r.name;
      tdName.appendChild(a);
      tr.appendChild(tdName);

      const tdPeak = document.createElement('td');
      tdPeak.className = 'right';
      tdPeak.textContent = r.peak;
      tr.appendChild(tdPeak);

      const tdDate = document.createElement('td');
      tdDate.textContent = r.peak_date || '';
      tr.appendChild(tdDate);

      tbody.appendChild(tr);
    });

    const countEl = document.getElementById('count');
    if (countEl) countEl.textContent = state.filtered.length ? `(${state.filtered.length})` : '';
  }

  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    state.filtered = q
      ? state.rows.filter(r => r.name.toLowerCase().includes(q))
      : state.rows.slice();
    render();
    hideCompare();
  }

  async function fetchHistoryFor(id) {
    const key = String(id);
    if (histCache.has(key)) return histCache.get(key);

    try {
      const res = await fetch(historyUrl(id), { cache: 'no-cache' });
      if (!res.ok) return null;
      const rows = await res.json();
      histCache.set(key, rows);
      return rows;
    } catch {
      return null;
    }
  }

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({ x: p.x, y: +p.y }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;
    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;
      lastKey = key;
    }
    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);
    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p.y);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const ys = buckets[k].filter(Number.isFinite);
      const avg = ys.reduce((a, b) => a + b, 0) / ys.length;
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg };
    });

    return normalise(out, false);
  }

  function hideCompare() {
    document.getElementById('compare-wrap').style.display = 'none';
    document.getElementById('compare-chart').innerHTML = '';
    lastCompared = [];
  }

  async function buildComparison(players) {
    lastCompared = players.slice();

    const wrap = document.getElementById('compare-wrap');
    const chart = document.getElementById('compare-chart');
    wrap.style.display = 'block';
    chart.innerHTML = 'Loading…';

    const mode = 'monthly';
    const traces = [];
    let ymin = Infinity;
    let ymax = -Infinity;

    for (const p of players) {
      const hist = await fetchHistoryFor(p.id);
      if (!hist || !hist.length) continue;

      const raw = hist.map(d => ({ x: d.date, y: Number(d.rating) }));
      const data = aggregate(raw, mode);

      const xs = data.map(pt => pt.x);
      const ys = data.map(pt => pt.y);
      if (!xs.length || !ys.length) continue;

      ymin = Math.min(ymin, ...ys);
      ymax = Math.max(ymax, ...ys);

      traces.push({
        type: 'scatter',
        name: p.name,
        x: xs,
        y: ys,
        mode: 'lines+markers',
        line: { width: 2, shape: 'linear' },
        marker: { size: 4 },
        hovertemplate: '%{x}<br>%{y:.0f}<extra>' + p.name + '</extra>',
        connectgaps: true
      });
    }

    if (!traces.length) {
      chart.innerHTML = 'No history found.';
      return;
    }

    ymin = Math.floor(ymin / 100) * 100;
    ymax = Math.ceil(ymax / 100) * 100;

    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper',
        x0: 0,
        x1: 1,
        y0: v,
        y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }

    const cs = getComputedStyle(document.body);
    Plotly.newPlot(chart, traces, {
      margin: { l: 50, r: 20, t: 10, b: 40 },
      xaxis: { type: 'date' },
      yaxis: { title: 'Rating' },
      legend: { orientation: 'h' },
      paper_bgcolor: cs.backgroundColor,
      plot_bgcolor: cs.backgroundColor,
      font: { color: cs.color },
      shapes
    }, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function setupCompareButton() {
    const modal = document.getElementById('compare-modal');
    const listDiv = document.getElementById('compare-list');

    function openModal() {
      listDiv.innerHTML = '';
      state.filtered.forEach(p => {
        const id = `chk-${p.id}`;
        const row = document.createElement('div');
        row.innerHTML = `
          <label>
            <input type="checkbox" id="${id}" value="${p.id}" style="margin-right:6px">
            ${p.name} (${p.peak})
          </label>
        `;
        listDiv.appendChild(row);
      });
      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function showSelected() {
      const ids = Array.from(listDiv.querySelectorAll('input:checked')).map(cb => cb.value);
      if (!ids.length) {
        alert('Please select at least one player.');
        return;
      }

      closeModal();
      const chosen = state.filtered.filter(p => ids.includes(String(p.id)));
      buildComparison(chosen);
    }

    document.getElementById('compare-btn').addEventListener('click', openModal);
    document.getElementById('compare-show-top').addEventListener('click', showSelected);
    document.getElementById('compare-close').addEventListener('click', closeModal);
  }

  async function load() {
    try {
      const res = await fetch(playersUrl(), { cache: 'no-cache' });
      if (!res.ok) throw new Error('Failed to load players.json');

      const payload = await res.json();
      const data = Array.isArray(payload) ? payload : (payload.players || []);

      state.rows = data
        .filter(d =>
          d &&
          d.listable === true &&
          d.id != null &&
          (d.display_name || d.name) &&
          Number.isFinite(+d.peak)
        )
        .map(d => ({
          id: String(d.id),
          name: d.display_name || d.name,
          nationality: d.nationality || null,
          peak: +d.peak,
          peak_date: d.peak_date || ''
        }))
        .sort((a, b) => b.peak - a.peak);

      state.filtered = state.rows.slice();
      render();
    } catch (err) {
      document.querySelector('#players tbody').innerHTML =
        `<tr><td colspan="5">Error loading data: ${err.message}</td></tr>`;
      const countEl = document.getElementById('count');
      if (countEl) countEl.textContent = '';
    }
  }

  document.getElementById('q').addEventListener('input', applyFilter);
  setupCompareButton();
  load();
</script>
</body>
</html>
