<script>
  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;
  const PAGE_SIZE = 100;

    rows: [],

  };

  const histCache = new Map();
  let compareChart = null;
  let lastCompared = [];
  let COMPARE_SINCE_YEAR = '2020';

  function historyUrl(id) { return `../data/history/${encodeURIComponent(id)}.json`; }
  function snapshotsSeasonsUrl() { return '../data/snapshots/seasons.json'; }
function snapshotUrl(season) { return `../data/snapshots/${encodeURIComponent(season)}.json`; }

    };

    return map[n] || null;
  }

  function flagImgHtml(nationality) {
    const code = nationalityToFlagCode(nationality);
    if (!code) return '';
    const safeNationality = String(nationality || '').replace(/"/g, '&quot;');
    return `<img src="../../flags/${code}.svg" alt="${safeNationality}" title="${safeNationality}" class="flag-icon">`;
  }

  function formatAsOf(isoYMD) {
    const [y, m, d] = String(isoYMD || '').split('-').map(Number);
    if (!y || !m || !d) return '';
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return `${d} ${months[m - 1]} ${y}`;
  }

  function setAsOf(isoYMD) {
    const el = document.getElementById('asof');
    if (!el) return;
    const pretty = formatAsOf(isoYMD);
    if (pretty) {
      el.style.display = 'block';
      el.textContent = `Updated to: ${pretty}`;
    } else {
      el.style.display = 'none';
      el.textContent = '';
    }
  }

  function normaliseYMD(s) {
    if (!s) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const d = new Date(s);
    if (Number.isNaN(+d)) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function updateLoadMoreUI() {
    const btn = document.getElementById('load-more');
    const hint = document.getElementById('load-more-hint');
    const total = state.filtered.length;
    const showing = Math.min(state.visibleCount, total);

    if (total <= PAGE_SIZE) {
      btn.style.display = 'none';
      hint.textContent = total ? `` : '';
      return;
    }

    hint.textContent = total ? `Showing ${showing} of ${total}` : '';
    btn.style.display = (showing < total) ? 'inline-block' : 'none';
  }

  function render() {
    const tbody = document.querySelector('#players tbody');
    tbody.innerHTML = '';

    const totalToShow = Math.min(state.visibleCount, state.filtered.length);

    for (let i = 0; i < totalToShow; i++) {
      const r = state.filtered[i];
      const tr = document.createElement('tr');

      const tdRank = document.createElement('td');
tdRank.textContent = r.rank;
tr.appendChild(tdRank);

      const tdCountry = document.createElement('td');
      tdCountry.className = 'flag-cell';
      tdCountry.innerHTML = flagImgHtml(r.nationality);
      tr.appendChild(tdCountry);

      const tdName = document.createElement('td');
      const a = document.createElement('a');
      a.href = `../player/?id=${encodeURIComponent(r.id)}`;
      a.textContent = r.name;
      tdName.appendChild(a);
      tr.appendChild(tdName);

      const tdRt = document.createElement('td');
      tdRt.className = 'right';
      tdRt.textContent = r.rating;
      tr.appendChild(tdRt);

      tbody.appendChild(tr);
    }

    updateLoadMoreUI();
  }

  function hideCompare() {
    document.getElementById('compare-wrap').style.display = 'none';
    document.getElementById('compare-chart').innerHTML = '';
    lastCompared = [];
  }

  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    state.filtered = !q
      ? state.rows.slice()
      : state.rows.filter(r => r.name.toLowerCase().includes(q));

    state.visibleCount = PAGE_SIZE;
    render();
    hideCompare();
  }

  function loadMore() {
    state.visibleCount += PAGE_SIZE;
    render();
  }

  async function fetchHistoryFor(id) {
    const key = String(id);
    if (histCache.has(key)) return histCache.get(key);

    try {
      const res = await fetch(historyUrl(id), { cache: 'no-cache' });
      if (!res.ok) return null;
      const rows = await res.json();
      histCache.set(key, rows);
      return rows;
    } catch {
      return null;
    }
  }

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({ x: p.x, y: +p.y }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;

    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;
      lastKey = key;
    }
    return out;
  }

  
  function applySinceFilter(series, rangeValue) {
    const range = String(rangeValue || 'ALL').toUpperCase();
    if (range === 'ALL') return series;
  
    const now = new Date();
    let start;
  
    if (range === 'LY') {
      start = new Date(now);
      start.setFullYear(start.getFullYear() - 1);
    } else if (range === 'YTD') {
      start = new Date(Date.UTC(now.getUTCFullYear(), 0, 1));
    } else {
      const year = Number(range);
      if (!Number.isFinite(year)) return series;
      start = new Date(Date.UTC(year, 0, 1));
    }
  
    const startMs = start.getTime();
    return series.filter(p => new Date(p.x).getTime() >= startMs);
  }
  

  function aggregate(series, mode) {
  if (mode === 'daily') return normalise(series, true);

  const buckets = Object.create(null);

  for (const p of series) {
    const d = new Date(p.x);
    if (Number.isNaN(d.getTime())) continue;

    let key;
    let x;

    if (mode === 'weekly') {
      const wd = d.getUTCDay();
      const diff = (wd + 6) % 7;
      const monday = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - diff));
      key = monday.toISOString().slice(0, 10);
      x = key;
    } else if (mode === 'monthly') {
      key = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
      x = `${key}-01`;
    } else if (mode === 'quarterly') {
      const quarter = Math.floor(d.getUTCMonth() / 3) + 1;
      key = `${d.getUTCFullYear()}-Q${quarter}`;
      x = `${d.getUTCFullYear()}-${String((quarter - 1) * 3 + 1).padStart(2, '0')}-01`;
    } else {
      key = `${d.getUTCFullYear()}`;
      x = `${key}-01-01`;
    }

    if (!buckets[key]) buckets[key] = { x, pts: [] };
    buckets[key].pts.push(p);
  }

  const out = Object.keys(buckets).sort().map(key => {
    const bucket = buckets[key];
    const pts = bucket.pts.filter(p => Number.isFinite(p.y));
    if (!pts.length) return null;
    const avg = pts.reduce((sum, p) => sum + p.y, 0) / pts.length;
    const x = bucket.x;
    return { x, y: avg };
  }).filter(Boolean);

  return normalise(out, false);
}

  async function buildComparison(players) {
  const wrap = document.getElementById('compare-wrap');
  const chart = document.getElementById('compare-chart');

  wrap.style.display = 'block';
  chart.innerHTML = '';

  lastCompared = [];

  for (const p of players) {
    const hist = await fetchHistoryFor(p.id);
    if (!hist || !hist.length) continue;

    lastCompared.push({
      name: p.name || p.id,
      raw: hist.map(d => ({
        x: d.date,
        y: Number(d.rating),
        tournament: d.tournament || d.event || ''
      })),
      customData: pt => pt.tournament || '',
      hovertemplate:
        '%{x|%d %b %Y}<br>%{y:.0f} Rating<extra>' +
        (p.name || p.id) +
        '</extra>'
    });
  }

  if (!lastCompared.length) {
    chart.innerHTML = 'No history found.';
    return;
  }

  await Promise.resolve(compareChart.render(lastCompared));
}

  function setupCompareButton() {
    const modal = document.getElementById('compare-modal');
    const listDiv = document.getElementById('compare-list');

    function openModal() {
      listDiv.innerHTML = '';
      state.filtered.forEach(p => {
        const id = `chk-${p.id}`;
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `
          <label>
            <input type="checkbox" id="${id}" value="${p.id}" style="margin-right:6px">
            ${p.name} (${p.rating})
          </label>
        `;
        listDiv.appendChild(wrapper);
      });
      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function showSelected() {
      const selectedIds = Array.from(listDiv.querySelectorAll('input:checked')).map(cb => cb.value);
      if (!selectedIds.length) {
        alert('Please select at least one player.');
        return;
      }

      closeModal();
      document.getElementById('compare-agg').value = 'weekly';
      const chosen = state.filtered.filter(p => selectedIds.includes(String(p.id)));
      buildComparison(chosen);
    }

    document.getElementById('compare-btn').addEventListener('click', openModal);
    document.getElementById('compare-show-top').addEventListener('click', showSelected);
  document.getElementById('compare-close').addEventListener('click', closeModal);
  }

  async function loadYearsDropdown() {
  const sel = document.getElementById('year');
  const current = sel.value;
  sel.innerHTML = `<option value="" selected>Live</option>`;

  try {
    const res = await fetch(snapshotsSeasonsUrl(), { cache: 'no-cache' });
    if (!res.ok) throw new Error('seasons.json not found');

    const seasons = await res.json();
    seasons
      .map(s => Number(s))
      .filter(s => Number.isFinite(s))
      .sort((a, b) => b - a)
      .forEach(s => {
        const opt = document.createElement('option');
        opt.value = String(s);
        opt.textContent = `${s}/${s + 1}`;
        sel.appendChild(opt);
      });

    sel.value = [...sel.options].some(o => o.value === current) ? current : '';
  } catch {
    sel.value = '';
  }
}

  async function load() {
    try {
      const year = document.getElementById('year')?.value || '';
      const url = year ? snapshotUrl(year) : playersUrl();

      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error(`Failed to load ${url}`);

      const payload = await res.json();
      const data = Array.isArray(payload) ? payload : (payload.players || []);

      if (!year) {
        try {
          const mres = await fetch(metaUrl(), { cache: 'no-cache' });
          if (mres.ok) {
            const meta = await mres.json();
            const raw = meta.updated_to || meta.asof || '';
            setAsOf(normaliseYMD(raw));
          } else {
            setAsOf('');
          }
        } catch {
          setAsOf('');
        }
      } else {
        setAsOf('');
      }

      const rows = data.filter(d => d && d.active !== false && d.listable === true);

state.rows = rows
  .filter(d => d && d.id != null && (d.display_name || d.name) && Number.isFinite(+d.rating))
  .map(d => ({
    id: String(d.id),
    name: d.display_name || d.name,
    nationality: d.nationality || null,
    rating: +d.rating
  }))
  .sort((a, b) => b.rating - a.rating)
  .map((r, i) => ({
    ...r,
    rank: i + 1
  }));
      state.filtered = state.rows.slice();
      state.visibleCount = PAGE_SIZE;
      render();
      hideCompare();
    } catch (err) {
      setAsOf('');
      document.querySelector('#players tbody').innerHTML =
        `<tr><td colspan="4">Error loading data: ${err.message}</td></tr>`;
      updateLoadMoreUI();
    }
  }

  compareChart = JRGraph.createChart({
  chartId: 'compare-chart',
  aggId: 'compare-agg',
  controlsEl: document.getElementById('compare-wrap'),
  defaultRange: 'ALL',
  getItems: () => lastCompared
});

document.getElementById('q').addEventListener('input', applyFilter);
  document.getElementById('year').addEventListener('change', load);
  document.getElementById('load-more').addEventListener('click', loadMore);

  setupCompareButton();

  (async function boot() {
    await loadYearsDropdown();
    await load();
  })();
</script>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const rangeButtons = Array.from(
    document.querySelectorAll('#compare-wrap .seg[data-range]')
  );

  const activateRangeButton = (button) => {
    rangeButtons.forEach(btn => {
      btn.classList.remove('active', 'is-active');
      btn.setAttribute('aria-pressed', 'false');
    });

    if (button) {
      button.classList.add('active', 'is-active');
      button.setAttribute('aria-pressed', 'true');
    }
  };

  const defaultButton =
    document.querySelector('#compare-wrap .seg[data-range="ALL"]');

  activateRangeButton(defaultButton);

  rangeButtons.forEach(btn => {
    btn.addEventListener('click', () => activateRangeButton(btn));
  });
});
</script>
