<html lang="en">

  <meta charset="utf-8">
  <title>J-Ratings: Test Cricket Compare</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border, #444);
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .row input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border, #444);
      background: transparent;
      color: inherit;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border, #444);
      color: inherit;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(255,255,255,0.05);
    }

    .muted-note {
      opacity: .8;
      font-size: .9rem;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .suggest {
      position: relative;
      flex: 1;
    }

    .suggest-list {
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      max-height: 220px;
      overflow: auto;
      margin-top: 4px;
      border: 1px solid var(--border, #444);
      background: inherit;
      border-radius: 6px;
      display: none;
      z-index: 20;
    }

    .suggest-item {
      padding: 8px 10px;
      cursor: pointer;
    }

    .suggest-item:hover {
      background: rgba(255,255,255,.05);
    }

    #chart {
      height: 520px;
    }

    @media (max-width: 600px) {
      #chart {
        height: 420px;
      }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="../home/" class="brand-with-logo">
        <span>J-Ratings <span class="title-rugby">Test Cricket</span></span>
        <img src="/Cricket Banner Logo.png" alt="Cricket logo" class="sport-logo">
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="/index.html">Sports</a>
      <a href="../home/">Home</a>
      <a href="./" class="active-tab">Compare</a>
      <a href="../peak/">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2 style="margin:0; padding:16px 18px; border-bottom:1px solid var(--border, #444)">Compare teams</h2>

    <div class="controls">
      <div class="toolbar">
        <div id="rows" style="flex:1"></div>

        <div style="display:flex; gap:8px; align-items:center">
          <label for="agg">View:</label>
          <select id="agg">
            <option value="daily">Daily</option>
            <option value="monthly" selected>Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button id="add" class="btn" type="button">Add team</button>
        <button id="create" class="btn" type="button">Create</button>
        <button id="clear" class="btn" type="button">Clear</button>
      </div>
    </div>

    <div style="padding:16px">
      <div id="chart">Loading…</div>
    </div>
  </section>
</main>

<script>
const TEAMS_URL = '../data/teams.json';
const HIST_URL = id => `../data/history/${encodeURIComponent(id)}.json`;

const MAX_TEAMS = 15;
const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

const TEAM_COLOURS = {
  "Australia": "#FFCD00",
  "Bangladesh": "#006A4E",
  "England": "#00247D",
  "India": "#FF9933",
  "Ireland": "#169B62",
  "New Zealand": "#000000",
  "Pakistan": "#01411C",
  "South Africa": "#007A4D",
  "Sri Lanka": "#8D153A",
  "West Indies": "#7A263A",
  "Zimbabwe": "#FFD200"
};

const DARK_LINE_OVERRIDES = {
  "New Zealand": "#BFBFBF"
};

const state = {
  teams: [],
  inputs: [],
  loaded: []
};

function normalise(series, dedupeByDay = false) {
  const s = series
    .filter(p => p && p.x && Number.isFinite(p.y))
    .map(p => ({
      x: p.x,
      y: +p.y,
      tournament: p.tournament || p.competition || ''
    }))
    .sort((a, b) => new Date(a.x) - new Date(b.x));

  if (!dedupeByDay) return s;

  const out = [];
  let lastKey = null;

  for (const p of s) {
    const d = new Date(p.x);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    if (key !== lastKey) {
      out.push(p);
    } else {
      out[out.length - 1] = p;
    }

    lastKey = key;
  }

  return out;
}

function aggregate(series, mode) {
  if (mode === 'daily') return normalise(series, true);

  const buckets = Object.create(null);

  for (const p of series) {
    const d = new Date(p.x);

    const key = mode === 'monthly'
      ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
      : `${d.getFullYear()}`;

    (buckets[key] ||= []).push(p);
  }

  const out = Object.keys(buckets).sort().map(k => {
    const pts = buckets[k].filter(p => Number.isFinite(p.y));
    const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
    const lastTournament = pts.length ? (pts[pts.length - 1].tournament || '') : '';
    const x = k.length === 7 ? `${k}-01` : `${k}-01-01`;

    return {
      x,
      y: avg,
      tournament: lastTournament
    };
  });

  return normalise(out, false);
}

function hexToRgb(hex) {
  const clean = String(hex || '').trim();
  const match = clean.match(/^#([0-9a-f]{6})$/i);

  if (!match) return null;

  const value = match[1];

  return {
    r: parseInt(value.slice(0, 2), 16),
    g: parseInt(value.slice(2, 4), 16),
    b: parseInt(value.slice(4, 6), 16)
  };
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b]
    .map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'))
    .join('');
}

function relativeLuminance({ r, g, b }) {
  const toLinear = c => {
    const s = c / 255;
    return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  };

  const R = toLinear(r);
  const G = toLinear(g);
  const B = toLinear(b);

  return 0.2126 * R + 0.7152 * G + 0.0722 * B;
}

function mixWithWhite(rgb, amount) {
  return {
    r: rgb.r + (255 - rgb.r) * amount,
    g: rgb.g + (255 - rgb.g) * amount,
    b: rgb.b + (255 - rgb.b) * amount
  };
}

function getDisplayColour(teamName) {
  if (DARK_LINE_OVERRIDES[teamName]) return DARK_LINE_OVERRIDES[teamName];

  const fallback = '#2F80ED';
  const raw = TEAM_COLOURS[teamName] || fallback;
  const rgb = hexToRgb(raw);

  if (!rgb) return fallback;

  const lum = relativeLuminance(rgb);

  if (lum >= 0.05) return raw;

  const lifted = mixWithWhite(rgb, 0.45);
  return rgbToHex(lifted.r, lifted.g, lifted.b);
}

function escapeAttr(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function attachAutocomplete(input) {
  const wrap = document.createElement('div');
  wrap.className = 'suggest';

  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);

  const list = document.createElement('div');
  list.className = 'suggest-list';
  wrap.appendChild(list);

  function render(items) {
    if (!items.length) {
      list.style.display = 'none';
      list.innerHTML = '';
      return;
    }

    list.innerHTML = items
      .map(n => `<div class="suggest-item" data-name="${escapeAttr(n)}">${escapeHtml(n)}</div>`)
      .join('');

    list.style.display = 'block';
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();

    if (!q) {
      render([]);
      return;
    }

    const names = state.teams.map(t => t.name);
    const starts = names.filter(n => n.toLowerCase().startsWith(q));
    const contains = names.filter(n => !n.toLowerCase().startsWith(q) && n.toLowerCase().includes(q));

    render(starts.concat(contains).slice(0, 12));
  });

  list.addEventListener('mousedown', e => {
    const item = e.target.closest('.suggest-item');

    if (!item) return;

    input.value = item.dataset.name;
    list.style.display = 'none';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = list.querySelector('.suggest-item');

      if (first) {
        input.value = first.dataset.name;
        list.style.display = 'none';
      }
    }

    if (e.key === 'Escape') {
      list.style.display = 'none';
    }
  });

  input.addEventListener('blur', () => {
    setTimeout(() => {
      list.style.display = 'none';
    }, 120);
  });
}

function makeRow() {
  if (state.inputs.length >= MAX_TEAMS) return;

  const rows = document.getElementById('rows');
  const wrap = document.createElement('div');
  wrap.className = 'row';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Search team…';

  wrap.appendChild(input);
  attachAutocomplete(input);

  const remove = document.createElement('button');
  remove.className = 'btn';
  remove.type = 'button';
  remove.textContent = 'Remove';

  remove.addEventListener('click', () => {
    rows.removeChild(wrap);
    state.inputs = state.inputs.filter(r => r.el !== wrap);
    document.getElementById('add').disabled = state.inputs.length >= MAX_TEAMS;
  });

  wrap.appendChild(remove);
  rows.appendChild(wrap);

  state.inputs.push({
    el: wrap,
    input
  });

  document.getElementById('add').disabled = state.inputs.length >= MAX_TEAMS;
}

function clearAll() {
  document.getElementById('rows').innerHTML = '';
  state.inputs = [];
  state.loaded = [];
  document.getElementById('add').disabled = false;
  document.getElementById('chart').textContent = 'Cleared.';
}

async function loadTeams() {
  const res = await fetch(TEAMS_URL, { cache: 'no-cache' });

  if (!res.ok) {
    throw new Error('teams.json not found');
  }

  const rows = await res.json();

  state.teams = rows
    .filter(d => d && d.id && (d.name || d.display_name))
    .map(d => ({
      id: d.id,
      name: d.display_name || d.name,
      rating: Number(d.rating)
    }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

function majorGridShapes(ymin, ymax) {
  const shapes = [];

  for (let v = ymin; v <= ymax; v += 100) {
    shapes.push({
      type: 'line',
      xref: 'paper',
      x0: 0,
      x1: 1,
      y0: v,
      y1: v,
      line: {
        width: 1,
        color: 'rgba(128,128,128,0.35)'
      },
      layer: 'below'
    });
  }

  return shapes;
}

function drawChart() {
  const el = document.getElementById('chart');

  if (el.textContent && el.textContent.includes('Loading')) {
    el.textContent = '';
  }

  if (!state.loaded.length) {
    el.textContent = 'No teams selected.';
    return;
  }

  const mode = document.getElementById('agg').value;
  const traces = [];

  for (const s of state.loaded) {
    const data = aggregate(s.daily, mode);
    const xs = data.map(p => p.x);
    const ys = data.map(p => p.y);
    const tournaments = data.map(p => p.tournament || '');
    const finiteY = ys.filter(Number.isFinite);

    if (!xs.length || !finiteY.length) continue;

    traces.push({
      type: 'scatter',
      name: s.name,
      x: xs,
      y: ys,
      customdata: tournaments,
      mode: 'lines',
      line: {
        width: 3,
        shape: 'linear',
        color: getDisplayColour(s.name)
      },
      hovertemplate: mode === 'daily'
        ? '%{x}<br>%{y:.0f} Elo<br>%{customdata}<extra>' + s.name + '</extra>'
        : '%{x}<br>%{y:.0f} Elo<extra>' + s.name + '</extra>',
      connectgaps: true,
      showlegend: true
    });
  }

  const allY = traces.flatMap(t => t.y || []).filter(Number.isFinite);

  if (!allY.length) {
    el.textContent = 'No games';
    return;
  }

  const ymin = Math.floor(Math.min(...allY) / 100) * 100;
  const ymax = Math.ceil(Math.max(...allY) / 100) * 100;

  const cs = getComputedStyle(document.body);

  Plotly.newPlot('chart', traces, {
    margin: {
      l: 60,
      r: 20,
      t: 50,
      b: 55
    },
    xaxis: {
      type: 'date'
    },
    yaxis: {
      title: 'Rating'
    },
    legend: {
      orientation: 'h',
      y: 1.12,
      x: 0
    },
    paper_bgcolor: cs.backgroundColor,
    plot_bgcolor: cs.backgroundColor,
    font: {
      color: cs.color,
      size: 14
    },
    shapes: majorGridShapes(ymin, ymax)
  }, {
    staticPlot: IS_TOUCH,
    displayModeBar: false,
    responsive: true
  });
}

async function createChart() {
  const names = state.inputs
    .map(r => r.input.value.trim())
    .filter(Boolean);

  const uniq = [...new Set(names)];

  if (!uniq.length) {
    alert('Please add at least one team');
    return;
  }

  const lookups = uniq
    .map(name => {
      const team = state.teams.find(t => t.name === name);
      if (!team) return null;

      return {
        name,
        id: team.id
      };
    })
    .filter(Boolean);

  if (!lookups.length) {
    document.getElementById('chart').textContent = 'No valid teams.';
    return;
  }

  document.getElementById('chart').textContent = 'Loading…';

  const results = await Promise.all(lookups.map(async ({ name, id }) => {
    const res = await fetch(HIST_URL(id), { cache: 'no-cache' });

    if (!res.ok) return null;

    const hist = await res.json();

    const daily = normalise(hist.map(d => ({
      x: d.date,
      y: Number(d.rating),
      tournament: d.tournament || d.competition || ''
    })), true);

    if (!daily.length) return null;

    return {
      name,
      daily
    };
  }));

  state.loaded = results.filter(Boolean);
  drawChart();
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('add').addEventListener('click', makeRow);
  document.getElementById('clear').addEventListener('click', clearAll);
  document.getElementById('create').addEventListener('click', createChart);
  document.getElementById('agg').addEventListener('change', drawChart);

  loadTeams()
    .then(() => {
      makeRow();
      document.getElementById('chart').textContent = 'Select teams and click Create.';
    })
    .catch(e => {
      console.error(e);
      document.getElementById('chart').textContent = 'Could not load team list. Check data path or run via a local server.';
      makeRow();
    });
});
</script>
</body>
