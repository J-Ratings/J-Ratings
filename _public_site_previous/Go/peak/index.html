<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JXCC4EDPY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1JXCC4EDPY');
  </script>

  <meta charset="utf-8">
  <title>J-Ratings: Go</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="../../jratings-graph.js"></script>

  <style>
    .flag-cell{
      text-align:center;
      vertical-align:middle;
    }

    .flag-icon{
      width:39.93px;
      height:29.04px;
      display:block;
      margin:0 auto;
      object-fit:contain;
    }

    #compare-modal{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    #compare-modal > div{
      background:#1a1a1a;
      padding:20px;
      border-radius:8px;
      max-width:500px;
      width:90%;
      max-height:80%;
      overflow:auto;
      color:#fff;
    }

    .compare-controls{
      margin:10px 0;
    }

    .compare-controls button{
      margin-right:10px;
    }

    /* Desktop player table */
    .table-wrap{
      width:min(86vw, 1100px);
      margin:0 auto;
    }

    #players{
      width:100%;
      table-layout:fixed;
    }

    @media (min-width:521px){
      #players th{
        font-size:1.55rem;
      }

      #players td{
        font-size:1.45rem;
      }

      .flag-icon{
        width:54px;
        height:40px;
      }
    }

    #players th,
    #players td{
      padding:14px 18px;
    }

    #players th:nth-child(1),
    #players td:nth-child(1){
      width:12%;
    }

    #players th:nth-child(2),
    #players td:nth-child(2){
      width:16%;
    }

    #players th:nth-child(3),
    #players td:nth-child(3){
      width:36%;
    }

    #players th:nth-child(4),
    #players td:nth-child(4){
      width:16%;
    }

    #players th:nth-child(5),
    #players td:nth-child(5){
      width:20%;
    }

    @media (max-width:520px){
      #players{
        width:100%;
        table-layout:fixed;
      }

      #players th,
      #players td{
        min-width:0 !important;
        padding:10px 8px;
      }

      #players th:nth-child(1),
      #players td:nth-child(1){ width:52px; }

      #players th:nth-child(2),
      #players td:nth-child(2){ width:44px; }

      #players th:nth-child(4),
      #players td:nth-child(4){ width:78px; }

      #players th:nth-child(5),
      #players td:nth-child(5){ width:92px; }

      #players th:nth-child(3),
      #players td:nth-child(3){ width:auto; }

      #players td:nth-child(3) a{
        display:block;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
      }
    }
  

    /* Home-style comparison modal */
    #compare-modal > div{
      padding:0 !important;
      max-width:560px;
      width:90%;
      max-height:80%;
      display:flex;
      flex-direction:column;
      overflow:hidden !important;
    }

    .compare-modal-header{
      position:sticky;
      top:0;
      z-index:2;
      background:#1a1a1a;
      padding:20px 20px 12px;
      border-bottom:1px solid #2b2f36;
    }

    .compare-modal-title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:12px;
    }

    .compare-modal-title-row h3{ margin:0; }

    .compare-close{
      border:0;
      background:transparent;
      color:inherit;
      font-size:1.8rem;
      line-height:1;
      padding:0 4px;
      cursor:pointer;
    }

    .compare-close:hover{ opacity:.8; }

    .compare-controls{ margin:0 !important; }

    #compare-list{
      overflow-y:auto;
      padding:12px 20px 20px;
      margin:0 !important;
    }

    @media (min-width:769px){
      #players-panel > .toolbar,
      #teams-panel > .toolbar{
        gap:12px;
        padding:22px 20px 18px;
        margin-bottom:0;
      }

      #players-panel > .toolbar input,
      #players-panel > .toolbar select,
      #players-panel > .toolbar button,
      #teams-panel > .toolbar input,
      #teams-panel > .toolbar select,
      #teams-panel > .toolbar button{
        font-size:1.05rem;
        padding-top:12px;
        padding-bottom:12px;
      }

      #players-panel > .toolbar label,
      #teams-panel > .toolbar label{
        font-size:1.05rem;
      }
    }

    /* Home-style peak table */
    .table-wrap{
      width:min(86vw, 1100px);
      margin:0 auto;
    }

    #players,
    #teams{
      width:100%;
      table-layout:fixed;
    }

    #players th,
    #players td,
    #teams th,
    #teams td{
      border-right:1px solid rgba(128,128,128,0.18);
    }

    #players th:last-child,
    #players td:last-child,
    #teams th:last-child,
    #teams td:last-child{
      border-right:none;
    }

    #players tbody tr:nth-child(even),
    #teams tbody tr:nth-child(even){
      background:rgba(255,255,255,0.018);
    }

    @media (min-width:521px){
      #players th,
      #teams th{
        font-size:1.55rem;
      }

      #players td,
      #teams td{
        font-size:1.45rem;
      }

      .flag-icon{
        width:54px;
        height:40px;
      }
    }

    @media (min-width:521px){
      #players th:nth-child(1), #players td:nth-child(1),
      #teams th:nth-child(1), #teams td:nth-child(1){ width:10%; }

      #players th:nth-child(2), #players td:nth-child(2),
      #teams th:nth-child(2), #teams td:nth-child(2){ width:12%; }

      #players th:nth-child(3), #players td:nth-child(3),
      #teams th:nth-child(3), #teams td:nth-child(3){ width:38%; }

      #players th:nth-child(4), #players td:nth-child(4),
      #teams th:nth-child(4), #teams td:nth-child(4){ width:16%; }

      #players th:nth-child(5), #players td:nth-child(5),
      #teams th:nth-child(5), #teams td:nth-child(5){ width:24%; }
    }

  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="../home/index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-go">Go</span></span>
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="../../index.html">Sports</a>
      <a href="../home/">Home</a>
<a href="index.html" class="active-tab">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="players-panel">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by name…">

      <label for="country" style="margin-left:auto">Country:</label>
      <select id="country">
        <option value="all" selected>All</option>
      </select>

      <label for="gender">Gender:</label>
      <select id="gender">
        <option value="all" selected>All</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
</div>

    <div id="compare-wrap" style="display:none; padding:16px">
      <div class="jr-chart-controls">
        <div>
          <label for="compare-agg">View:</label>
          <select id="compare-agg">
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>

        <div class="range-buttons">

<button type="button" class="seg" data-range="2020">2020–Present</button>
          <button type="button" class="seg" data-range="LY">Last Year</button>
          <button type="button" class="seg" data-range="YTD">YTD</button>
        </div>
      </div>

      <div id="compare-chart" class="jr-chart">Loading…</div>
    </div>

    <div class="table-wrap">
      <table id="players">
        <thead>
          <tr>
            <th style="min-width:60px">Rank</th>
            <th style="min-width:56px">Country</th>
            <th style="min-width:240px">Player</th>
            <th class="right" style="min-width:120px">Peak</th>
            <th style="min-width:140px">Peak Date</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div style="padding:16px; text-align:center;">
      <button id="show-more-btn" class="club-btn" type="button" style="display:none;">
        Show More
      </button>
    </div>
  </section>
</main>

<div id="compare-modal">
  <div>
    <div class="compare-modal-header">
      <div class="compare-modal-title-row">
        <h3>Select players to view:</h3>
        <button id="compare-close" class="compare-close" type="button" aria-label="Close comparison">×</button>
      </div>

      <div class="compare-controls">
        <button id="compare-show-top" type="button">Show Selected</button>
      </div>
    </div>

    <div id="compare-list"></div>
  </div>
</div>
</div>

<script>
const DATA_URL = '../data/players.json';
const FLAGS_BASE = '../../flags';
const PAGE_SIZE = 100;

const COUNTRY_LABELS = {
  ar: 'Argentina',
  ca: 'Canada',
  cn: 'China',
  fr: 'France',
  gb: 'United Kingdom',
  hk: 'Hong Kong',
  il: 'Israel',
  jp: 'Japan',
  kr: 'Korea',
  my: 'Malaysia',
  nl: 'Netherlands',
  pl: 'Poland',
  ro: 'Romania',
  ru: 'Russia',
  sg: 'Singapore',
  sk: 'Slovakia',
  tw: 'Taiwan',
  ua: 'Ukraine',
  us: 'United States'
};

const PRIORITY_COUNTRY_ORDER = ['cn', 'jp', 'kr', 'tw'];

const state = {
  rows: [],
  filtered: [],
  visibleCount: PAGE_SIZE
};

const histCache = new Map();

let compareChart = null;
let lastCompared = [];

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function normaliseFlagCode(code) {
  return String(code || '').trim().toLowerCase();
}

function normaliseGender(value) {
  const g = String(value || '').trim().toLowerCase();

  if (g === '♀' || g === 'female' || g === 'f') return 'female';
  if (g === '♂' || g === 'male' || g === 'm') return 'male';

  return '';
}

function getCountryLabel(flagCode) {
  const code = normaliseFlagCode(flagCode);

  if (!code) return '';

  return COUNTRY_LABELS[code] || code.toUpperCase();
}

function flagImgHtml(flagCode, label) {
  const code = normaliseFlagCode(flagCode);

  if (!code) return '';

  const safeLabel = escapeHtml(label || '');

  return `<img src="${FLAGS_BASE}/${encodeURIComponent(code)}.svg" alt="${safeLabel}" title="${safeLabel}" class="flag-icon" loading="lazy">`;
}

function render() {
  const tbody = document.querySelector('#players tbody');
  const showMoreBtn = document.getElementById('show-more-btn');

  tbody.innerHTML = '';

  const visibleRows = state.filtered.slice(0, state.visibleCount);

  visibleRows.forEach((r, i) => {
    const tr = document.createElement('tr');

    const tdRank = document.createElement('td');

    const selectedCountry = document.getElementById('country').value;
    const selectedGender = document.getElementById('gender').value;

    const hasRankingFilter =
      selectedCountry !== 'all' ||
      selectedGender !== 'all';

    tdRank.textContent = hasRankingFilter
      ? `${i + 1} (${r.rank})`
      : r.rank;

    tr.appendChild(tdRank);

    const tdFlag = document.createElement('td');
    tdFlag.className = 'flag-cell';
    tdFlag.innerHTML = flagImgHtml(r.flag, getCountryLabel(r.flag) || r.name);
    tr.appendChild(tdFlag);

    const tdName = document.createElement('td');
    const a = document.createElement('a');
    a.href = `../player/?id=${encodeURIComponent(r.id)}`;
    a.textContent = r.name;
    tdName.appendChild(a);
    tr.appendChild(tdName);

    const tdPeak = document.createElement('td');
    tdPeak.className = 'right';
    tdPeak.textContent = Number.isFinite(+r.peak)
      ? Math.round(+r.peak)
      : '';
    tr.appendChild(tdPeak);

    const tdDate = document.createElement('td');
    tdDate.textContent = r.peak_date || '';
    tr.appendChild(tdDate);

    tbody.appendChild(tr);
  });

  if (showMoreBtn) {
    showMoreBtn.style.display =
      state.visibleCount < state.filtered.length ? 'inline-block' : 'none';
  }
}

function hideCompare() {
  document.getElementById('compare-wrap').style.display = 'none';
  document.getElementById('compare-chart').innerHTML = '';
  lastCompared = [];
}

function applyFilter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const selectedCountry = document.getElementById('country').value;
  const selectedGender = document.getElementById('gender').value;

  state.filtered = state.rows.filter(r => {
    const matchesName = !q || r.name.toLowerCase().includes(q);

    const matchesCountry =
      selectedCountry === 'all' ||
      normaliseFlagCode(r.flag) === selectedCountry;

    const matchesGender =
      selectedGender === 'all' ||
      normaliseGender(r.gender) === selectedGender;

    return matchesName && matchesCountry && matchesGender;
  });

  state.visibleCount = PAGE_SIZE;

  render();
  hideCompare();
}

function populateCountrySelect() {
  const sel = document.getElementById('country');

  if (!sel) return;

  const previousValue = sel.value || 'all';

  const countryCodes = Array.from(new Set(
    state.rows
      .map(r => normaliseFlagCode(r.flag))
      .filter(Boolean)
  ));

  countryCodes.sort((a, b) => {
    const ai = PRIORITY_COUNTRY_ORDER.indexOf(a);
    const bi = PRIORITY_COUNTRY_ORDER.indexOf(b);

    const aPriority = ai !== -1;
    const bPriority = bi !== -1;

    if (aPriority && bPriority) return ai - bi;
    if (aPriority) return -1;
    if (bPriority) return 1;

    return getCountryLabel(a).localeCompare(getCountryLabel(b));
  });

  sel.innerHTML = '<option value="all">All</option>';

  for (const code of countryCodes) {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = getCountryLabel(code);
    sel.appendChild(opt);
  }

  sel.value = countryCodes.includes(previousValue) ? previousValue : 'all';
}

async function fetchHistoryFor(id) {
  if (histCache.has(id)) return histCache.get(id);

  try {
    const res = await fetch(`../data/history/${encodeURIComponent(id)}.json`, {
      cache: 'no-cache'
    });

    if (!res.ok) return null;

    const rows = await res.json();

    histCache.set(id, rows);

    return rows;
  } catch {
    return null;
  }
}

async function buildComparison(players) {
  const wrap = document.getElementById('compare-wrap');
  const chart = document.getElementById('compare-chart');

  wrap.style.display = 'block';
  chart.innerHTML = 'Loading…';

  lastCompared = [];

  for (const p of players) {
    const hist = await fetchHistoryFor(p.id);

    if (!hist || !hist.length) continue;

    lastCompared.push({
      name: p.name || p.id,
      raw: hist.map(d => ({
        x: d.date,
        y: Number(d.rating),
        tournament: d.tournament || d.event || ''
      })),
      customData: pt => pt.tournament || '',
      hovertemplate:
        '%{x|%d %b %Y}<br>%{y:.0f} Rating<extra>' +
        (p.name || p.id) +
        '</extra>'
    });
  }

  if (!lastCompared.length) {
    chart.innerHTML = 'No history found.';
    return;
  }

  compareChart.render(lastCompared);
}

function setupCompareButton() {
  const modal = document.getElementById('compare-modal');
  const listDiv = document.getElementById('compare-list');

  function openModal() {
    listDiv.innerHTML = '';

    state.filtered.forEach(p => {
      const id = `chk-${p.id}`;
      const row = document.createElement('div');

      row.innerHTML = `
        <label>
          <input type="checkbox" id="${id}" value="${p.id}" style="margin-right:6px">
          ${escapeHtml(p.name)} (${Math.round(p.peak)})
        </label>
      `;

      listDiv.appendChild(row);
    });

    modal.style.display = 'flex';
  }

  function closeModal() {
    modal.style.display = 'none';
  }

  function showSelected() {
    const ids = Array.from(listDiv.querySelectorAll('input:checked'))
      .map(cb => cb.value);

    if (!ids.length) {
      alert('Please select at least one player.');
      return;
    }

    closeModal();

    const chosen = state.filtered.filter(p =>
      ids.includes(String(p.id))
    );

    buildComparison(chosen);
  }

  document.getElementById('compare-btn').addEventListener('click', openModal);
  document.getElementById('compare-show-top').addEventListener('click', showSelected);
    document.getElementById('compare-close').addEventListener('click', closeModal);
}

async function load() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-cache' });

    if (!res.ok) throw new Error('Failed to load players.json');

    const data = await res.json();

    state.rows = (Array.isArray(data) ? data : [])
      .filter(d => d && d.id && d.name && Number.isFinite(+d.peak))
      .map(d => ({
        id: String(d.id),
        name: d.name,
        flag: d.flag || '',
        gender: d.gender || '',
        peak: +d.peak,
        peak_date: d.peak_date || ''
      }))
      .sort((a, b) =>
        b.peak - a.peak ||
        a.name.localeCompare(b.name)
      );

    state.rows = state.rows.map((r, i) => ({
      ...r,
      rank: i + 1
    }));

    state.filtered = state.rows.slice();
    state.visibleCount = PAGE_SIZE;

    populateCountrySelect();
    render();
  } catch (err) {
    document.querySelector('#players tbody').innerHTML =
      `<tr><td colspan="5">Error loading data: ${escapeHtml(err.message)}</td></tr>`;
  }
}

window.addEventListener('DOMContentLoaded', () => {
  compareChart = JRGraph.createChart({
    chartId: 'compare-chart',
    aggId: 'compare-agg',
    controlsEl: document.getElementById('compare-wrap'),
    defaultRange: '2020',
    getItems: () => lastCompared
  });

  document.getElementById('q').addEventListener('input', applyFilter);
  document.getElementById('country').addEventListener('change', applyFilter);
  document.getElementById('gender').addEventListener('change', applyFilter);

  document.getElementById('show-more-btn').addEventListener('click', () => {
    state.visibleCount += PAGE_SIZE;
    render();
  });
load();
});
</script>
</body>
</html>
