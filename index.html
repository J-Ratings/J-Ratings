<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>J-Ratings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">

  <style>
    .sports-grid {
      display: grid;
      grid-template-columns: 1fr;   /* stacked */
      gap: 14px;
      margin-top: 12px;
    }

    .sport-card {
      display: flex;
      align-items: center;          /* middle vertically */
      justify-content: center;      /* centre horizontally */
      height: 165px;                /* ~50% higher */
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      position: relative;
      overflow: hidden;

      /* background image settings */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      /* fallback colour if image missing */
      background-color: #0f1623;
    }

    .sport-card::before {
      content: "";
      position: absolute;
      inset: 0;
      /* slight dark overlay so white text stays readable */
      background: rgba(0,0,0,.25);
      pointer-events: none;
    }

    .sport-card:hover { border-color: var(--accent); }

    .sport-title {
      margin: 0;
      position: relative; /* above overlay */
      z-index: 1;

      /* bigger text */
      font-size: 3.3rem;

      font-weight: 800;
      color: #fff;
      text-align: center;

      /* thicker black outline */
      text-shadow:
        -3px -3px 0 #000,
         3px -3px 0 #000,
        -3px  3px 0 #000,
         3px  3px 0 #000,
         0px  3px 0 #000,
         3px  0px 0 #000,
         0px -3px 0 #000,
        -3px  0px 0 #000;
    }

    /* Background images (files live in root) */
    .bg-go       { background-image: url("Go Button.png"); }
    .bg-chess    { background-image: url("Chess Button.png"); }
    .bg-football { background-image: url("Football Button.png"); }
    .bg-rugby    { background-image: url("Rugby Button.png"); }
    .bg-nfl      { background-image: url("NFL Button.png"); }

    /* Stops “page width jump” when some pages scroll and others don’t */
    html { overflow-y: scroll; }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="index.html" class="brand-with-logo">
        <span>J-Ratings</span>
      </a>
    </h1>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2>Choose a Competition</h2>

    <div style="padding:16px 18px">
      <div class="sports-grid">
        <a class="sport-card bg-go" href="sports/go/index.html">
          <p class="sport-title">Go</p>
        </a>

        <a class="sport-card bg-chess" href="sports/chess/index.html">
          <p class="sport-title">Chess</p>
        </a>

        <a class="sport-card bg-football" href="sports/PremierLeague/index.html">
          <p class="sport-title">English Football</p>
        </a>

        <a class="sport-card bg-football" href="sports/WordFootball/index.html">
          <p class="sport-title">International Football</p>
        </a>

        <a class="sport-card bg-rugby" href="sports/WorldRugby/index.html">
          <p class="sport-title">Rugby Union</p>
        </a>

        <a class="sport-card bg-nfl" href="sports/NFL/index.html">
          <p class="sport-title">NFL</p>
        </a>
      </div>
    </div>
  </section>
</main>
</body>
</html>
