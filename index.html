<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>J-Ratings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">

  <style>
    .sports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .sport-card {
      display: block;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f1623;
      color: var(--text);
      text-decoration: none;
      min-height: 92px;
    }

    .sport-card:hover { border-color: var(--accent); }

    .sport-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0 0 6px 0;
    }

    .sport-sub { margin: 0; color: var(--muted); }

    .disabled {
      opacity: .55;
      cursor: not-allowed;
      pointer-events: none;
    }

    .pill {
      display: inline-block;
      font-size: .85rem;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      margin-left: 8px;
      vertical-align: middle;
    }

    /* Stops “page width jump” when some pages scroll and others don’t */
    html { overflow-y: scroll; }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-rugby">Sports</span></span>

        <!-- Transparent placeholder keeps the same header/logo height as sub-pages -->
        <img
          src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
          alt=""
          aria-hidden="true"
          class="sport-logo"
        >
      </a>
    </h1>

    <!-- Same nav structure as sub-pages to keep identical header dimensions -->
    <nav class="topnav" aria-label="Main">
      <a href="index.html" class="active-tab">Sports</a>
      <a class="disabled" href="#" aria-disabled="true">Home</a>
      <a class="disabled" href="#" aria-disabled="true">Compare</a>
      <a class="disabled" href="#" aria-disabled="true">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2>Sports</h2>

    <div style="padding:16px 18px">
      <div class="sports-grid">
        <a class="sport-card" href="sports/go/index.html">
          <p class="sport-title">Go</p>
        </a>

        <a class="sport-card" href="sports/chess/index.html">
          <p class="sport-title">Chess <span class="pill">WIP</span></p>
          <p class="sport-sub">Data needs cleaning</p>
        </a>

        <a class="sport-card" href="sports/PremierLeague/index.html">
          <p class="sport-title">English Football</p>
          <p class="sport-sub">Top 4 divisions</p>
        </a>

        <a class="sport-card" href="sports/WordFootball/index.html">
          <p class="sport-title">International Football</p>
        </a>

        <a class="sport-card" href="sports/WorldRugby/index.html">
          <p class="sport-title">Rugby Union</p>
        </a>

        <a class="sport-card" href="sports/NFL/index.html">
          <p class="sport-title">NFL</p>
        </a>
      </div>
    </div>
  </section>
</main>
</body>
</html>
