  <style>
    .sports-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 12px;
    }

    .sport-card {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 165px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #0f1623;
    }

    .sport-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.25);
      pointer-events: none;
    }

    .sport-card:hover {
      border-color: var(--accent);
    }

    .sport-inner {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .sport-title {
      margin: 0;
      font-size: 3.3rem;
      font-weight: 800;
      color: #fff;
      text-align: center;
      text-shadow:
        -3px -3px 0 #000,
         3px -3px 0 #000,
        -3px  3px 0 #000,
         3px  3px 0 #000,
         0px  3px 0 #000,
         3px  0px 0 #000,
         0px -3px 0 #000,
        -3px  0px 0 #000;
    }

    .sport-subtext {
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      opacity: 0.95;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .intro-text {
      margin: 8px 18px 0;
    }

    .bg-go       { background-image: url("Go Button.png"); }
    .bg-chess    { background-image: url("Chess Button.png"); }
    .bg-snooker  { background-image: url("Snooker Button.png"); }
    .bg-football { background-image: url("Football Button.png"); }
    .bg-rugby    { background-image: url("Rugby Button.png"); }
    .bg-cricket  { background-image: url("Cricket Button.png"); }

    html { overflow-y: scroll; }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="index.html" class="brand-with-logo">
        <span>J-Ratings</span>
      </a>
    </h1>
    <p class="intro-text">
      Elo ratings and rankings for Go, Chess, Snooker, Football and Rugby Union.
    </p>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2>Choose a Competition</h2>

    <div style="padding:16px 18px">
      <div class="sports-grid">

        <a class="sport-card bg-go" href="Go/home/">
          <div class="sport-inner">
            <p class="sport-title">Go</p>
          </div>
        </a>

        <a class="sport-card bg-chess" href="Chess/home/">
          <div class="sport-inner">
            <p class="sport-title">Chess</p>
          </div>
        </a>

        <a class="sport-card bg-snooker" href="Snooker/home/">
          <div class="sport-inner">
            <p class="sport-title">Snooker</p>
          </div>
        </a>

        <a class="sport-card bg-football" href="EnglishFootball/home/">
          <div class="sport-inner">
            <p class="sport-title">English Football</p>
          </div>
        </a>

        <a class="sport-card bg-football" href="InternationalFootball/home/">
          <div class="sport-inner">
            <p class="sport-title">International Football</p>
          </div>
        </a>

        <a class="sport-card bg-rugby" href="RugbyUnion/home/">
          <div class="sport-inner">
            <p class="sport-title">Rugby Union</p>
          </div>
        </a>

        <a class="sport-card bg-cricket" href="Cricket/home/">
          <div class="sport-inner">
            <p class="sport-title">Test Cricket</p>
          </div>
        </a>

      </div>
    </div>
  </section>
</main>
</body>
</html>
