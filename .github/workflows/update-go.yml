name: Update Go ratings

on:
  workflow_dispatch:
    inputs:
      full_profile_scrape:
        description: Check every GoRatings player profile
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "5 1 * * 3"
      timezone: "Europe/London"

permissions:
  contents: write

# Prevent the sports updaters from racing each other when writing to main.
concurrency:
  group: jratings-data-update-main
  cancel-in-progress: false

jobs:
  update-go:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          packages: |
            any::data.table
            any::readr
            any::dplyr
            any::lubridate
            any::jsonlite
            any::stringi
            any::stringr
            any::tibble
            any::tidyr
            any::purrr
            any::rvest
            any::xml2

      - name: Decide scrape mode
        id: scrape_mode
        shell: bash
        run: |
          DAY_OF_MONTH="$(date +%-d)"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                "${{ inputs.full_profile_scrape }}" == "true" ]]; then
            MODE="full"
          elif [[ "${{ github.event_name }}" == "schedule" && \
                  "$DAY_OF_MONTH" -le 7 ]]; then
            MODE="full"
          else
            MODE="weekly"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "GoRatings scrape mode: $MODE"

      - name: Run GoRatings scraper
        env:
          GORATINGS_SCRAPE_MODE: ${{ steps.scrape_mode.outputs.mode }}
        run: |
          Rscript scripts/go/04_scrape_goratings.R

      # Save the scrape before running the rest of the pipeline.
      # This prevents a later R error from forcing another long scrape.
      - name: Save scraped GoRatings data
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Go/pipeline_data/goratings/goratings_games_2026_observations.csv \
            Go/pipeline_data/goratings/goratings_players_homepage.csv \
            Go/pipeline_data/goratings/goratings_scrape_log.csv \
            Go/pipeline_data/goratings/goratings_failed_profiles.csv

          if git diff --cached --quiet; then
            echo "No scraped data changes to commit"
          else
            git commit -m "Update GoRatings scrape data"

            push_with_rebase() {
              for attempt in 1 2 3; do
                git fetch origin main
                git rebase --autostash origin/main

                if git push origin HEAD:main; then
                  return 0
                fi

                echo "Push raced with another update. Retrying ($attempt/3)..."
                sleep 5
              done

              echo "Failed to push after 3 attempts."
              return 1
            }

            push_with_rebase
          fi

      - name: Build GoRatings games
        run: |
          Rscript scripts/go/05_build_games.R

      - name: Update GoRatings player map
        run: |
          Rscript scripts/go/06_build_player_map.R

      - name: Calculate live Go Elo
        run: |
          Rscript scripts/go/07_calculate_live_elo.R

      - name: Build combined ratings
        run: |
          Rscript scripts/go/08_build_combined_ratings.R

      - name: Build combined history
        run: |
          Rscript scripts/go/09_build_combined_history.R

      - name: Write website JSON
        run: |
          Rscript scripts/go/02_write_json.R

      - name: Show generated changes
        run: |
          git status --short

      - name: Commit updated Go ratings and website data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Go/data \
            Go/pipeline_data/processed/goratings_games_2026.csv \
            Go/pipeline_data/processed/goratings_games_2026_issues.csv \
            Go/pipeline_data/processed/goratings_player_map.csv \
            Go/pipeline_data/processed/goratings_unmatched_players.csv \
            Go/pipeline_data/processed/goratings_match_candidates.csv \
            Go/pipeline_data/processed/goratings_match_evidence.csv

          if git diff --cached --quiet; then
            echo "No ratings or website changes to commit"
            exit 0
          fi

          git commit -m "Update Go ratings"

          push_with_rebase() {
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase --autostash origin/main

              if git push origin HEAD:main; then
                return 0
              fi

              echo "Push raced with another update. Retrying ($attempt/3)..."
              sleep 5
            done

            echo "Failed to push after 3 attempts."
            return 1
          }

          push_with_rebase
