name: Update Rugby Union ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 1 * *"

permissions:
  contents: write

jobs:
  update-rugby-union:
    runs-on: ubuntu-latest

    env:
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      RUGBY_API_START_YEAR: "2025"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c(
            "httr2",
            "jsonlite",
            "dplyr",
            "readr",
            "purrr",
            "stringr",
            "lubridate",
            "tibble",
            "data.table",
            "stringi"
          ), repos = "https://cloud.r-project.org")

      - name: Run Rugby Union pipeline
        shell: Rscript {0}
        run: |
          source("scripts/world_rugby/00_api_merge.R")
          source("scripts/world_rugby/01_calculation.R")
          source("scripts/world_rugby/02_write_json.R")

      - name: Commit updated Rugby Union data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RugbyUnion/pipeline_data RugbyUnion/data scripts/world_rugby
          git diff --cached --quiet || git commit -m "Update Rugby Union ratings data"
          git push