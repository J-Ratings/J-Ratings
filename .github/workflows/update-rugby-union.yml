name: Update Rugby Union ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: write

concurrency:
  group: jratings-data-update-main
  cancel-in-progress: false

jobs:
  update-rugby-union:
    runs-on: ubuntu-latest

    env:
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      RUGBY_API_START_YEAR: "2025"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::dplyr
            any::readr
            any::purrr
            any::stringr
            any::lubridate
            any::tibble
            any::data.table
            any::stringi

      - name: Run Rugby Union pipeline
        shell: Rscript {0}
        run: |
          source("scripts/world_rugby/00_api_merge.R")
          source("scripts/world_rugby/01_calculation.R")
          source("scripts/world_rugby/02_write_json.R")

      - name: Commit updated Rugby Union data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add RugbyUnion/pipeline_data RugbyUnion/data scripts/world_rugby

          if git diff --cached --quiet; then
            echo "No Rugby Union data changes to commit."
            exit 0
          fi

          git commit -m "Update Rugby Union ratings data"

          push_with_rebase() {
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase --autostash origin/main

              if git push origin HEAD:main; then
                return 0
              fi

              echo "Push raced with another update. Retrying ($attempt/3)..."
              sleep 5
            done

            echo "Failed to push after 3 attempts."
            return 1
          }

          push_with_rebase
