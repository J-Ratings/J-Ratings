name: Update Snooker ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * 3"

permissions:
  contents: write

concurrency:
  group: jratings-data-update-main
  cancel-in-progress: false

jobs:
  update-snooker:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SNOOKER_API_HEADER: ${{ secrets.SNOOKER_API_HEADER }}
      SNOOKER_REQUEST_PAUSE: "8"
      MATCH_REFRESH_DAYS: "45"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::data.table
            any::dplyr
            any::readr
            any::stringr

      - name: Run snooker pipeline
        run: |
          Rscript -e "source('scripts/snooker/00_refresh_lookups.R')"
          Rscript -e "source('scripts/snooker/01_update_matches.R')"
          Rscript -e "source('scripts/snooker/02_calculate_elo.R')"
          Rscript -e "source('scripts/snooker/03_write_json.R')"

      - name: Commit updated snooker data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Snooker/data Snooker/pipeline_data

          if git diff --cached --quiet; then
            echo "No Snooker data changes to commit."
            exit 0
          fi

          git commit -m "Update snooker ratings"

          push_with_rebase() {
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase --autostash origin/main

              if git push origin HEAD:main; then
                return 0
              fi

              echo "Push raced with another update. Retrying ($attempt/3)..."
              sleep 5
            done

            echo "Failed to push after 3 attempts."
            return 1
          }

          push_with_rebase
