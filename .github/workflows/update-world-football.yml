name: Update world football ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 2"

permissions:
  contents: write

concurrency:
  group: jratings-data-update-main
  cancel-in-progress: false

jobs:
  update-world-football:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("data.table", "readr", "dplyr", "lubridate", "jsonlite", "stringi", "stringr"))'

      - name: Run world football pipeline
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          Rscript scripts/world_football/00_download_data.R
          Rscript scripts/world_football/01_combine_results.R
          Rscript scripts/world_football/02_calculate_elo.R
          Rscript scripts/world_football/03_write_json.R

      - name: Commit updated world football data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/world_football InternationalFootball/pipeline_data InternationalFootball/data

          if git diff --cached --quiet; then
            echo "No world football data changes to commit."
            exit 0
          fi

          git commit -m "Update world football ratings"

          push_with_rebase() {
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase --autostash origin/main

              if git push origin HEAD:main; then
                return 0
              fi

              echo "Push raced with another update. Retrying ($attempt/3)..."
              sleep 5
            done

            echo "Failed to push after 3 attempts."
            return 1
          }

          push_with_rebase
