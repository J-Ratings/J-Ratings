name: Update European Football data

on:
  workflow_dispatch:
  schedule:
    # Staggered to avoid clashing with other monthly sports workflows.
    - cron: "5 3 * * 3"

permissions:
  contents: write

# Only one data-writing workflow may update main at a time.
concurrency:
  group: jratings-data-update-main
  cancel-in-progress: false

jobs:
  update-european-football:
    runs-on: ubuntu-latest

    env:
      J_RATINGS_REPO: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::data.table
            any::dplyr
            any::readr
            any::jsonlite
            any::stringi
            any::stringr
            any::tibble
            any::tictoc
          needs: check

      - name: Run European Football pipeline
        run: |
          Rscript -e 'source("scripts/EuropeanFootball/00_download_openfootball_current.R")'
          Rscript -e 'source("scripts/EuropeanFootball/01_parse_openfootball.R")'
          Rscript -e 'source("scripts/EuropeanFootball/02_calculate_elo.R")'
          Rscript -e 'source("scripts/EuropeanFootball/03_write_json.R")'

      - name: Show website metadata
        run: |
          Rscript -e 'print(jsonlite::fromJSON("EuropeanFootball/data/meta.json"))'

      - name: Commit updated European Football data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add EuropeanFootball/pipeline_data/Source/openfootball/england/
          git add EuropeanFootball/pipeline_data/Matches_Clean_Combined/
          git add EuropeanFootball/pipeline_data/Elo/
          git add EuropeanFootball/data/

          if git diff --cached --quiet; then
            echo "No European Football data changes to commit."
            exit 0
          fi

          git commit -m "Update European Football data"

          push_with_rebase() {
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase --autostash origin/main

              if git push origin HEAD:main; then
                return 0
              fi

              echo "Push raced with another update. Retrying ($attempt/3)..."
              sleep 5
            done

            echo "Failed to push after 3 attempts."
            return 1
          }

          push_with_rebase
