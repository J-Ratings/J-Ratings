<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>J-Ratings: NFL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    .controls { display:flex; flex-direction:column; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border, #444); }
    .row { display:flex; gap:8px; align-items:center; width:100%; }
    .row input[type="text"] { flex:1; min-width:220px; padding:10px; border-radius:8px; border:1px solid var(--border, #444); background:transparent; color:inherit; }
    .btn { background:transparent; border:1px solid var(--border, #444); color:inherit; padding:8px 12px; border-radius:6px; cursor:pointer; }
    .btn:hover { background:rgba(255,255,255,0.05); }
    .muted-note { opacity:.8; font-size:.9rem; }
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .suggest { position:relative; flex:1; }
    .suggest-list {
      position:absolute; left:0; right:0; top:100%;
      max-height:220px; overflow:auto; margin-top:4px;
      border:1px solid var(--border, #444); background:var(--panel-bg, #1a1a1a); border-radius:6px;
      display:none; z-index:20;
    }
    .suggest-item { padding:8px 10px; cursor:pointer; }
    .suggest-item:hover { background:rgba(255,255,255,.05); }
    .suggest-code { opacity: .75; margin-left: 6px; font-size: .9em; }
    #chart { height:520px; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-football">NFL</span></span>
        <img src="../../Football Banner Logo.png" alt="NFL logo" class="sport-logo">
      </a>
    </h1>
    <nav class="topnav" aria-label="Main">
      <a href="../../index.html">Sports</a>
      <a href="index.html">Home</a>
      <a href="compare.html" class="active-tab">Compare</a>
      <a href="peak.html">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2 style="margin:0; padding:16px 18px; border-bottom:1px solid var(--border, #444)">Compare teams</h2>

    <div class="controls">
      <div class="toolbar">
        <div id="rows" style="flex:1"></div>
        <div style="display:flex; gap:8px; align-items:center">
          <label for="agg">View:</label>
          <select id="agg">
            <option value="daily">Daily</option>
            <option value="monthly" selected>Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button id="add" class="btn" type="button">Add team</button>
        <button id="create" class="btn" type="button">Create</button>
        <button id="clear" class="btn" type="button">Clear</button>
      </div>
      <div class="muted-note">Up to 15 teams. Start typing a team name or code, pick a suggestion, then Create.</div>
    </div>

    <div style="padding:16px">
      <div id="chart">Loading…</div>
    </div>
  </section>
</main>

<script>
  const TEAMS_URL = 'data/teams.json';
  const HIST_URL  = id => `data/history/${encodeURIComponent(id)}.json`;
  const MAX_TEAMS = 15;
  const IS_TOUCH  = window.matchMedia('(pointer: coarse)').matches;

  const state = {
    teams: [],   // [{id, code, name, ...}]
    inputs: [],  // [{ el, input }]
    loaded: []   // [{ name, code, daily: [{x,y,tournament}] }]
  };

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({
        x: p.x,
        y: +p.y,
        tournament: p.tournament || ''
      }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;
    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;
      lastKey = key;
    }
    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);
    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastTournament = pts.length ? (pts[pts.length - 1].tournament || '') : '';
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg, tournament: lastTournament };
    });

    return normalise(out, false);
  }

  function attachAutocomplete(input) {
    const wrap = document.createElement('div');
    wrap.className = 'suggest';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    const list = document.createElement('div');
    list.className = 'suggest-list';
    wrap.appendChild(list);

    function render(items) {
      if (!items.length) {
        list.style.display = 'none';
        list.innerHTML = '';
        return;
      }

      list.innerHTML = items.map(t => `
        <div class="suggest-item" data-id="${t.id}">
          ${t.name}${t.code ? `<span class="suggest-code">(${t.code})</span>` : ''}
        </div>
      `).join('');
      list.style.display = 'block';
    }

    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      if (!q) { render([]); return; }

      const starts = state.teams.filter(t => {
        const n = (t.name || '').toLowerCase();
        const c = (t.code || '').toLowerCase();
        return n.startsWith(q) || c.startsWith(q);
      });

      const contains = state.teams.filter(t => {
        const n = (t.name || '').toLowerCase();
        const c = (t.code || '').toLowerCase();
        const startsMatch = n.startsWith(q) || c.startsWith(q);
        const containsMatch = n.includes(q) || c.includes(q);
        return !startsMatch && containsMatch;
      });

      render(starts.concat(contains).slice(0, 12));
    });

    list.addEventListener('mousedown', e => {
      const item = e.target.closest('.suggest-item');
      if (!item) return;
      const picked = state.teams.find(t => t.id === item.dataset.id);
      input.value = picked ? (picked.name || picked.code || picked.id) : item.textContent.trim();
      input.dataset.teamId = picked ? picked.id : '';
      list.style.display = 'none';
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const first = list.querySelector('.suggest-item');
        if (first) {
          const picked = state.teams.find(t => t.id === first.dataset.id);
          input.value = picked ? (picked.name || picked.code || picked.id) : first.textContent.trim();
          input.dataset.teamId = picked ? picked.id : '';
          list.style.display = 'none';
        }
      }
      if (e.key === 'Escape') list.style.display = 'none';
    });

    input.addEventListener('blur', () => setTimeout(() => { list.style.display = 'none'; }, 120));

    // Clear pinned id if user edits manually after selecting
    input.addEventListener('input', () => {
      if (input.dataset.teamId) {
        const picked = state.teams.find(t => t.id === input.dataset.teamId);
        const current = input.value.trim();
        const expected = picked ? (picked.name || picked.code || picked.id) : '';
        if (current !== expected) input.dataset.teamId = '';
      }
    });
  }

  function makeRow() {
    if (state.inputs.length >= MAX_TEAMS) return;
    const rows = document.getElementById('rows');

    const wrap = document.createElement('div');
    wrap.className = 'row';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Search team or code…';
    wrap.appendChild(input);
    attachAutocomplete(input);

    const remove = document.createElement('button');
    remove.className = 'btn';
    remove.type = 'button';
    remove.textContent = 'Remove';
    remove.addEventListener('click', () => {
      rows.removeChild(wrap);
      state.inputs = state.inputs.filter(r => r.el !== wrap);
      document.getElementById('add').disabled = state.inputs.length >= MAX_TEAMS;
    });

    wrap.appendChild(remove);
    rows.appendChild(wrap);

    state.inputs.push({ el: wrap, input });
    document.getElementById('add').disabled = state.inputs.length >= MAX_TEAMS;
  }

  function clearAll() {
    document.getElementById('rows').innerHTML = '';
    state.inputs = [];
    state.loaded = [];
    document.getElementById('add').disabled = false;
    document.getElementById('chart').textContent = 'Cleared.';
    makeRow();
  }

  async function loadTeams() {
    const res = await fetch(TEAMS_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('teams.json not found');
    const rows = await res.json();

    state.teams = (Array.isArray(rows) ? rows : [])
      .filter(t => t && t.id)
      .map(t => ({
        id: t.id,
        code: t.code || '',
        name: t.name || t.code || t.id
      }))
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  }

  function majorGridShapes(ymin, ymax) {
    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper', x0: 0, x1: 1,
        y0: v, y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }
    return shapes;
  }

  function drawChart() {
    const el = document.getElementById('chart');
    if (el.textContent && el.textContent.includes('Loading')) el.textContent = '';

    if (!state.loaded.length) {
      el.textContent = 'No teams selected.';
      return;
    }

    const mode = document.getElementById('agg').value;

    const traces = state.loaded.map(s => {
      const data = aggregate(s.daily, mode);
      const xs = data.map(p => p.x);
      const ys = data.map(p => p.y);
      const tournaments = data.map(p => p.tournament || '');

      return {
        type: 'scatter',
        name: s.code ? `${s.name} (${s.code})` : s.name,
        x: xs,
        y: ys,
        customdata: tournaments,
        mode: (mode === 'daily') ? 'lines' : 'lines+markers',
        line: { width: 2, shape: 'linear' },
        marker: (mode === 'daily') ? { size: 0 } : { size: 4 },
        hovertemplate: (mode === 'daily')
          ? '%{x}<br>%{y:.0f} Elo<br>%{customdata}<extra></extra>'
          : '%{x}<br>%{y:.0f} Elo<extra></extra>',
        connectgaps: true
      };
    });

    const allY = traces.flatMap(t => t.y).filter(Number.isFinite);
    if (!allY.length) {
      el.textContent = 'No games';
      return;
    }

    const ymin = Math.floor(Math.min(...allY) / 100) * 100;
    const ymax = Math.ceil(Math.max(...allY) / 100) * 100;

    const bg = getComputedStyle(document.body).backgroundColor;
    Plotly.newPlot('chart', traces, {
      margin: { l: 50, r: 20, t: 10, b: 40 },
      xaxis: { type: 'date' },
      yaxis: { title: 'Elo' },
      paper_bgcolor: bg,
      plot_bgcolor: bg,
      font: { color: getComputedStyle(document.body).color },
      shapes: majorGridShapes(ymin, ymax),
      legend: { x: 1, y: 0, bgcolor: 'rgba(0,0,0,0)' }
    }, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  async function createChart() {
    const selections = state.inputs.map(r => {
      const txt = r.input.value.trim();
      const pinnedId = r.input.dataset.teamId || '';
      return { txt, pinnedId };
    }).filter(x => x.txt || x.pinnedId);

    if (!selections.length) {
      alert('Please add at least one team');
      return;
    }

    const resolved = selections.map(({ txt, pinnedId }) => {
      if (pinnedId) {
        const t = state.teams.find(x => x.id === pinnedId);
        return t || null;
      }

      // Fallback exact match by name or code
      const q = txt.toLowerCase();
      return state.teams.find(t =>
        (t.name || '').toLowerCase() === q || (t.code || '').toLowerCase() === q
      ) || null;
    }).filter(Boolean);

    const uniq = [];
    const seen = new Set();
    for (const t of resolved) {
      if (seen.has(t.id)) continue;
      seen.add(t.id);
      uniq.push(t);
    }

    if (!uniq.length) {
      document.getElementById('chart').textContent = 'No valid teams.';
      return;
    }

    const results = await Promise.all(uniq.map(async (t) => {
      const res = await fetch(HIST_URL(t.id), { cache: 'no-cache' });
      if (!res.ok) return null;
      const hist = await res.json();

      const daily = normalise((Array.isArray(hist) ? hist : []).map(d => ({
        x: d.date,
        y: Number(d.rating),
        tournament: d.tournament || ''
      })), true);

      if (!daily.length) return null;
      return { name: t.name, code: t.code, daily };
    }));

    state.loaded = results.filter(Boolean);
    drawChart();
  }

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('add').addEventListener('click', makeRow);
    document.getElementById('clear').addEventListener('click', clearAll);
    document.getElementById('create').addEventListener('click', createChart);
    document.getElementById('agg').addEventListener('change', drawChart);

    loadTeams()
      .then(() => {
        makeRow();
        document.getElementById('chart').textContent = 'Select teams and click Create.';
      })
      .catch(e => {
        console.error(e);
        document.querySelector('.muted-note').textContent =
          'Could not load team list. Check the data path and that the site is being served properly.';
        makeRow();
      });
  });
</script>
</body>
</html>
