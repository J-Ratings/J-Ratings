<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>J-Ratings: Chess (Player)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    #chart { height: 420px; }
    .toolbar { margin-bottom: 10px; text-align: center; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
    .toolbar label { margin-right: 6px; }
    h2#pname, h3.section-title { text-align: center; }

    /* Games table */
    #gamesWrap { max-height: 520px; overflow: auto; margin-top: 12px; }
    table.games {
      width:100%;
      border-collapse: separate;   /* needed for double borders */
      border-spacing: 0;
      font-size:14px;
    }
    table.games th, table.games td {
      padding:6px 8px;
      border-bottom:1px solid #2b2f36;
      text-align:center;
      vertical-align: middle;
      white-space: nowrap;
    }
    /* Sticky header */
    table.games th {
      position: sticky;
      top: 0;
      z-index: 2;
      background-color: var(--panel-bg, #1a1a1a);
    }
    /* Double separators: Date|Black, Elo|White, Elo|Result|Δ  */
    table.games th:nth-child(1), table.games td:nth-child(1),
    table.games th:nth-child(3), table.games td:nth-child(3),
    table.games th:nth-child(5), table.games td:nth-child(5),
    table.games th:nth-child(6), table.games td:nth-child(6) {
      border-right: 3px double rgba(128,128,128,0.6);
    }

.result { font-weight:700; }
.result.win  { color:#2acd4e; }  
.result.draw { color:#e3a620; }  
.result.loss { color:#e03232; } 

.delta { font-weight:700; }
.delta.pos { color:#2acd4e; }
.delta.neg { color:#e03232; }

  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="site-title"><a id="home-link" href="index.html">J-Ratings: Chess</a></h1>
    <nav class="topnav" aria-label="Main">
      <a id="nav-home" href="index.html">Home</a>
      <a id="nav-compare" href="compare.html">Compare</a>
      <a id="nav-peak" href="peak.html">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2 id="pname">Player</h2>

    <div class="toolbar">
      <label for="sec">Format:</label>
      <select id="sec">
        <option value="classical" selected>Classical</option>
        <option value="rapid">Rapid</option>
        <option value="blitz">Blitz</option>
        <option value="freestyle">Freestyle</option>
      </select>

      <label for="agg">View:</label>
      <select id="agg">
        <option value="daily">Daily</option>
        <option value="monthly" selected>Monthly</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>

    <div id="chart">Loading…</div>

    <h3 class="section-title" style="margin-top:18px;">Games</h3>
    <div id="gamesWrap">
      <table id="games" class="games"></table>
    </div>
  </section>
</main>

<script>
  /* ---------- SECTION CONFIG ---------- */
  const SECTIONS = {
    classical: { label: 'Classical', base: 'data/classical' },
    rapid:     { label: 'Rapid',     base: 'data/rapid' },
    blitz:     { label: 'Blitz',     base: 'data/blitz' },
    freestyle: { label: 'Freestyle', base: 'data/freestyle' }
  };

  function getParam(name) {
    const u = new URL(window.location.href);
    return u.searchParams.get(name);
  }
  function setParam(name, value) {
    const u = new URL(window.location.href);
    u.searchParams.set(name, value);
    window.history.replaceState({}, '', u.toString());
  }

  /* ---------- PARAMS ---------- */
  const params = new URLSearchParams(location.search);
  const idRaw = params.get('id');
  if (!idRaw) {
    document.getElementById('chart').textContent = 'Missing player id.';
    throw new Error('no id');
  }

  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

  const state = {
    section: 'classical'
  };

  function dataBase() { return SECTIONS[state.section].base; }
  function playersUrl() { return `${dataBase()}/players.json`; }
  function historyUrl(id) { return `${dataBase()}/history/${encodeURIComponent(id)}.json`; }
  function gamesUrl(id) { return `${dataBase()}/games/${encodeURIComponent(id)}.json`; }

  function wireNavLinks() {
    const sec = encodeURIComponent(state.section);
    document.getElementById('home-link').href   = `index.html?sec=${sec}`;
    document.getElementById('nav-home').href    = `index.html?sec=${sec}`;
    document.getElementById('nav-compare').href = `compare.html?sec=${sec}`;
    document.getElementById('nav-peak').href    = `peak.html?sec=${sec}`;
  }

  let RAW = []; // daily series

  function normalise(series, dedupeByDay = false){
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({ x: p.x, y: +p.y }))
      .sort((a,b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;
    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (key !== lastKey) out.push(p);
      else out[out.length-1] = p; // keep last point that day
      lastKey = key;
    }
    return out;
  }

  function aggregate(series, mode){
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);
    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p.y);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const ys = buckets[k].filter(Number.isFinite);
      const avg = ys.reduce((a,b)=>a+b,0) / ys.length;
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg };
    });
    return normalise(out, false);
  }

  function draw(mode){
    const el = document.getElementById('chart');
    if (el.textContent && el.textContent.includes('Loading')) el.textContent = '';

    const data = aggregate(RAW, mode);
    const xs = data.map(p => p.x);
    const ys = data.map(p => p.y).filter(Number.isFinite);
    if (!xs.length || !ys.length) {
      el.textContent = 'No games';
      return;
    }

    const ymin = Math.floor(Math.min(...ys) / 100) * 100;
    const ymax = Math.ceil(Math.max(...ys) / 100) * 100;
    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line', xref: 'paper', x0: 0, x1: 1,
        y0: v, y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }

    const trace = {
      type: 'scatter',
      x: xs,
      y: ys,
      mode: (mode === 'daily') ? 'lines' : 'lines+markers',
      line: { width: 2, shape: 'linear' },
      marker: (mode === 'daily') ? { size: 0 } : { size: 4 },
      hovertemplate: '%{x}<br>%{y:.0f}<extra></extra>',
      connectgaps: true
    };

    const bg = getComputedStyle(document.body).backgroundColor;
    Plotly.newPlot('chart', [trace], {
      margin:{ l:50, r:20, t:10, b:40 },
      xaxis:{ type:'date' },
      yaxis:{ title:'Rating' },
      paper_bgcolor:bg,
      plot_bgcolor:bg,
      font:{ color:getComputedStyle(document.body).color },
      shapes
    }, {
      staticPlot: IS_TOUCH,
      displayModeBar:false,
      responsive:true
    });
  }

  function renderGamesTable(myName, games) {
    const tbl = document.getElementById('games');
    tbl.innerHTML = '';

    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    for (const h of ['Date','Black','Elo','White','Elo','Result','Δ']) {
      const th = document.createElement('th');
      th.textContent = h;
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    tbl.appendChild(thead);

    const panelBg = getComputedStyle(document.querySelector('.panel')).backgroundColor;
    thead.style.backgroundColor = panelBg;

    const tbody = document.createElement('tbody');
    games.sort((a,b) => new Date(b.date) - new Date(a.date));

    for (const g of games) {
      const tr = document.createElement('tr');

      const tdDate = document.createElement('td');
      tdDate.textContent = g.date;

      const tdB = document.createElement('td');
      if (g.black === myName) {
        const s = document.createElement('strong');
        s.textContent = g.black;
        tdB.appendChild(s);
      } else {
        tdB.textContent = g.black;
      }

      const tdBE = document.createElement('td');
      tdBE.textContent = Number(g.blackElo).toString();

      const tdW = document.createElement('td');
      if (g.white === myName) {
        const s = document.createElement('strong');
        s.textContent = g.white;
        tdW.appendChild(s);
      } else {
        tdW.textContent = g.white;
      }

      const tdWE = document.createElement('td');
      tdWE.textContent = Number(g.whiteElo).toString();

      const tdR = document.createElement('td');
tdR.textContent = g.result;

const res = String(g.result || '').trim();

// normalise common draw formats (covers your "1/2-1/2" case)
const isDraw =
  res === '1/2-1/2' || res === '½-½' || res === '0.5-0.5' ||
  res === '1/2–1/2' || res === '1/2—1/2';

const isWhite = (g.white === myName);
const isBlack = (g.black === myName);

let outcome = 'loss';

if (isDraw) {
  outcome = 'draw';
} else if ((res === '1-0' && isBlack) || (res === '0-1' && isWhite)) {
  outcome = 'win';
} else if ((res === '0-1' && isBlack) || (res === '1-0' && isWhite)) {
  outcome = 'loss';
} else {
  // unknown/odd result string: don't force win/loss colour
  outcome = '';
}

tdR.className = 'result' + (outcome ? ' ' + outcome : '');

      const tdDelta = document.createElement('td');
      const numDelta = Number(g.delta);
      if (!Number.isNaN(numDelta)) {
        tdDelta.textContent = g.delta;
        tdDelta.className = 'delta ' + (numDelta > 0 ? 'pos' : (numDelta < 0 ? 'neg' : ''));
      } else {
        tdDelta.textContent = '';
      }

      tr.appendChild(tdDate);
      tr.appendChild(tdB);
      tr.appendChild(tdBE);
      tr.appendChild(tdW);
      tr.appendChild(tdWE);
      tr.appendChild(tdR);
      tr.appendChild(tdDelta);
      tbody.appendChild(tr);
    }

    tbl.appendChild(tbody);
  }

  async function load(){
    try {
      document.getElementById('chart').textContent = 'Loading…';

      const [playersRes, histRes, gamesRes] = await Promise.all([
        fetch(playersUrl(), { cache: 'no-cache' }),
        fetch(historyUrl(idRaw), { cache: 'no-cache' }),
        fetch(gamesUrl(idRaw), { cache: 'no-cache' })
      ]);

      if (!playersRes.ok) throw new Error('players.json not found');
      if (!histRes.ok) throw new Error('history not found');

      const players = await playersRes.json();
      const me = players.find(p => p.id === idRaw);
      if (!me) throw new Error('player id not in players.json');
      document.getElementById('pname').textContent = me.name;

      RAW = normalise(
        (await histRes.json()).map(d => ({ x: d.date, y: Number(d.rating) })), true
      );

      if (!RAW.length) {
        document.getElementById('chart').textContent = 'No games';
      } else {
        const initialMode = document.getElementById('agg').value || 'monthly';
        draw(initialMode);
      }

      document.getElementById('agg').addEventListener('change', e => draw(e.target.value), { once:false });

      if (gamesRes.ok) {
        const games = await gamesRes.json();
        renderGamesTable(me.name, games);
      } else {
        const tbl = document.getElementById('games');
        tbl.innerHTML = '<tbody><tr><td>No games</td></tr></tbody>';
      }

    } catch (e) {
      console.error(e);
      document.getElementById('chart').textContent = 'Error: ' + e.message;
      const tbl = document.getElementById('games');
      tbl.innerHTML = '<tbody><tr><td>Error loading games</td></tr></tbody>';
    }
  }

  function setSection(sec){
    const s = (sec || '').toLowerCase();
    state.section = SECTIONS[s] ? s : 'classical';

    document.getElementById('sec').value = state.section;
    setParam('sec', state.section);
    wireNavLinks();

    // reload data for this format (same player id)
    load();
  }

  // boot
  window.addEventListener('DOMContentLoaded', () => {
    setSection(getParam('sec') || 'classical');
    document.getElementById('sec').addEventListener('change', e => setSection(e.target.value));
    wireNavLinks();
    load();
  });
</script>
</body>
</html>
