<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>J-Ratings: Chess</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    #chart { height: 520px; }

    .player-head {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      padding: 12px 20px 0;
    }

    .player-head #pname {
      margin: 0;
      text-align: centre;
    }

    .player-head-spacer {
      justify-self: start;
    }

    .peak-badge {
      justify-self: end;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 10px;
      border: 1px solid rgba(128,128,128,0.35);
      border-radius: 6px;
      background: rgba(128,128,128,0.08);
      white-space: nowrap;
    }

    .toolbar {
      justify-content: centre;
      gap: 10px;
      padding: 14px 20px;
      flex-wrap: wrap;
    }

    .toolbar label {
      margin-right: 6px;
      font-size: 1.05rem;
    }

    h2#pname,
    h3.section-title {
      text-align: centre;
    }

    h2#pname {
      font-size: 2rem;
      padding: 8px 0 12px;
    }

    h3.section-title {
      font-size: 1.6rem;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    #gamesWrap {
      max-height: 520px;
      overflow: auto;
      margin-top: 12px;
    }

    table.games {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 1rem;
    }

    table.games th,
    table.games td {
      padding: 10px 12px;
      border-bottom: 1px solid #2b2f36;
      text-align: centre;
      vertical-align: middle;
      white-space: nowrap;
    }

    table.games th {
      position: sticky;
      top: 0;
      z-index: 2;
      background-color: var(--panel-bg, #1a1a1a);
    }

    /* Column separators */
    table.games th:nth-child(1), table.games td:nth-child(1),
    table.games th:nth-child(2), table.games td:nth-child(2),
    table.games th:nth-child(3), table.games td:nth-child(3),
    table.games th:nth-child(4), table.games td:nth-child(4),
    table.games th:nth-child(5), table.games td:nth-child(5),
    table.games th:nth-child(6), table.games td:nth-child(6) {
      border-right: 3px double rgba(128,128,128,0.6);
    }

    .result { font-weight: 700; }
    .result.win  { color: #2acd4e; }
    .result.draw { color: #e8a81f; }
    .result.loss { color: #e03232; }

    .delta { font-weight: 700; }
    .delta.pos { color: #2acd4e; }
    .delta.neg { color: #e03232; }

    .opp { text-align: left; }
    .event {
      text-align: left;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    td.opp a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    td.opp a:hover {
      opacity: 0.9;
    }

    @media (max-width: 900px) {
      .player-head {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 10px 16px 0;
      }

      .player-head-spacer {
        display: none;
      }

      .peak-badge {
        justify-self: centre;
      }
    }

    @media (max-width: 700px) {
      #chart { height: 420px; }

      h2#pname {
        font-size: 1.6rem;
        padding: 6px 0 8px;
      }

      h3.section-title { font-size: 1.25rem; }

      table.games { font-size: 0.92rem; }

      table.games th,
      table.games td { padding: 8px 10px; }

      .event { max-width: 160px; }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-chess">Chess</span></span>
        <img src="../../Chess Banner Logo.png" alt="Chess logo" class="sport-logo">
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a id="nav-home" href="index.html">Home</a>
      <a id="nav-compare" href="compare.html">Compare</a>
      <a id="nav-peak" href="peak.html">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="player-head">
      <div class="player-head-spacer" aria-hidden="true"></div>
      <h2 id="pname">Player</h2>
      <div id="peakBadge" class="peak-badge">Peak: —</div>
    </div>

    <div class="toolbar">
      <label for="sec">Format:</label>
      <select id="sec">
        <option value="classical" selected>Classical</option>
        <option value="rapid">Rapid</option>
        <option value="blitz">Blitz</option>
        <option value="freestyle">Freestyle</option>
      </select>

      <label for="agg">View:</label>
      <select id="agg">
        <option value="daily">Daily</option>
        <option value="monthly" selected>Monthly</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>

    <div id="chart">Loading…</div>

    <h3 class="section-title">Games</h3>
    <div id="gamesWrap">
      <table id="games" class="games"></table>
    </div>
  </section>
</main>

<script>
  const SECTIONS = {
    classical: { label: 'Classical', base: 'data/classical' },
    rapid:     { label: 'Rapid',     base: 'data/rapid' },
    blitz:     { label: 'Blitz',     base: 'data/blitz' },
    freestyle: { label: 'Freestyle', base: 'data/freestyle' }
  };

  function getParam(name) {
    const u = new URL(window.location.href);
    return u.searchParams.get(name);
  }

  function setParam(name, value) {
    const u = new URL(window.location.href);
    u.searchParams.set(name, value);
    window.history.replaceState({}, '', u.toString());
  }

  const params = new URLSearchParams(location.search);
  const idRaw = params.get('id');
  if (!idRaw) {
    document.getElementById('chart').textContent = 'Missing player id.';
    throw new Error('no id');
  }

  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;
  const state = { section: 'classical' };

  function dataBase() { return SECTIONS[state.section].base; }
  function playersUrl() { return `${dataBase()}/players.json`; }
  function historyUrl(id) { return `${dataBase()}/history/${encodeURIComponent(id)}.json`; }
  function gamesUrl(id) { return `${dataBase()}/games/${encodeURIComponent(id)}.json`; }

  function wireNavLinks() {
    const sec = encodeURIComponent(state.section);
    document.getElementById('home-link').href   = `index.html?sec=${sec}`;
    document.getElementById('nav-home').href    = `index.html?sec=${sec}`;
    document.getElementById('nav-compare').href = `compare.html?sec=${sec}`;
    document.getElementById('nav-peak').href    = `peak.html?sec=${sec}`;
  }

  let RAW = [];

  function normalise(series, dedupeByDay = false) {
    const s = (Array.isArray(series) ? series : [])
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({
        x: p.x,
        y: +p.y,
        event: p.event || ''
      }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;
    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;
      lastKey = key;
    }
    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);
    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastEvent = pts.length ? (pts[pts.length - 1].event || '') : '';
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg, event: lastEvent };
    });

    return normalise(out, false);
  }

  function draw(mode) {
    const el = document.getElementById('chart');
    if (el.textContent && el.textContent.includes('Loading')) el.textContent = '';

    const data = aggregate(RAW, mode);
    const xs = data.map(p => p.x);
    const ys = data.map(p => p.y).filter(Number.isFinite);
    const events = data.map(p => p.event || '');

    if (!xs.length || !ys.length) {
      el.textContent = 'No games';
      return;
    }

    const ymin = Math.floor(Math.min(...ys) / 100) * 100;
    const ymax = Math.ceil(Math.max(...ys) / 100) * 100;

    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper',
        x0: 0,
        x1: 1,
        y0: v,
        y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }

    const hoverExtra = (mode === 'daily') ? '<br>%{customdata}' : '';

    const trace = {
      type: 'scatter',
      x: xs,
      y: ys,
      customdata: events,
      mode: (mode === 'daily') ? 'lines' : 'lines+markers',
      line: { width: 3, shape: 'linear' },
      marker: (mode === 'daily') ? { size: 0 } : { size: 6 },
      hovertemplate: `%{x}<br>%{y:.0f} Rating${hoverExtra}<extra></extra>`,
      connectgaps: true
    };

    const bg = getComputedStyle(document.body).backgroundColor;
    Plotly.newPlot('chart', [trace], {
      margin: { l: 60, r: 20, t: 10, b: 45 },
      xaxis: { type: 'date' },
      yaxis: { title: 'Rating' },
      paper_bgcolor: bg,
      plot_bgcolor: bg,
      font: { color: getComputedStyle(document.body).color, size: 14 },
      shapes
    }, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function makeOpponentCell(opponentKey, opponentDisplay, players) {
    const td = document.createElement('td');
    td.className = 'opp';

    const key = String(opponentKey || '');
    const text = String(opponentDisplay || key || '');

    const player = players.find(p => p.name === key);

    if (player && player.id) {
      const a = document.createElement('a');
      a.href = `player.html?id=${encodeURIComponent(player.id)}&sec=${encodeURIComponent(state.section)}`;
      a.textContent = text;
      td.appendChild(a);
    } else {
      td.textContent = text;
    }

    return td;
  }

  function getResultForPlayer(g, myName) {
    const raw = String(g.result || '').trim();

    const isDraw =
      raw === '1/2-1/2' || raw === '½-½' || raw === '0.5-0.5' ||
      raw === '1/2–1/2' || raw === '1/2—1/2' || raw === '1/2';

    if (isDraw) return { cls: 'draw', text: 'Draw' };

    const isWhite = (g.white === myName);
    const isBlack = (g.black === myName);

    if ((raw === '1-0' && isWhite) || (raw === '0-1' && isBlack)) {
      return { cls: 'win', text: 'Win' };
    }

    if ((raw === '0-1' && isWhite) || (raw === '1-0' && isBlack)) {
      return { cls: 'loss', text: 'Loss' };
    }

    return { cls: '', text: raw || '' };
  }

  function renderGamesTable(me, players, games) {
    const tbl = document.getElementById('games');
    tbl.innerHTML = '';

    const thead = document.createElement('thead');
    const hr = document.createElement('tr');

    for (const h of ['Date', 'Event', 'Opponent', 'Elo', 'Result', 'Δ', 'New']) {
      const th = document.createElement('th');
      th.textContent = h;
      hr.appendChild(th);
    }

    thead.appendChild(hr);
    tbl.appendChild(thead);

    const panelBg = getComputedStyle(document.querySelector('.panel')).backgroundColor;
    thead.style.backgroundColor = panelBg;

    const tbody = document.createElement('tbody');
    const rows = Array.isArray(games) ? [...games] : [];
    rows.sort((a, b) => new Date(b.date) - new Date(a.date));

    const myName = me.name;

    for (const g of rows) {
      const isWhite = g.white === myName;
      const isBlack = g.black === myName;
      if (!isWhite && !isBlack) continue;

      const opponentKey = isWhite ? g.black : g.white;
      const opponentDisplay = isWhite
        ? (g.black_display || g.black || '')
        : (g.white_display || g.white || '');
      const opponentElo = isWhite ? Number(g.blackElo) : Number(g.whiteElo);
      const myEloBefore = isWhite ? Number(g.whiteElo) : Number(g.blackElo);

      const numDelta = Number(g.delta);
      const myEloAfter = Number.isFinite(myEloBefore) && Number.isFinite(numDelta)
        ? Math.round(myEloBefore + numDelta)
        : NaN;

      const tr = document.createElement('tr');

      const tdDate = document.createElement('td');
      tdDate.textContent = g.date || '';

      const tdEvent = document.createElement('td');
      tdEvent.className = 'event';
      const fullEvent = String(g.event || '');
      tdEvent.title = fullEvent;
      tdEvent.textContent = fullEvent;

      const tdOpp = makeOpponentCell(opponentKey, opponentDisplay, players);

      const tdOppElo = document.createElement('td');
      tdOppElo.textContent = Number.isFinite(opponentElo) ? String(Math.round(opponentElo)) : '';

      const tdResult = document.createElement('td');
      const r = getResultForPlayer(g, myName);
      tdResult.textContent = r.text;
      tdResult.className = 'result' + (r.cls ? ' ' + r.cls : '');

      const tdDelta = document.createElement('td');
      if (!Number.isNaN(numDelta)) {
        tdDelta.textContent = g.delta;
        tdDelta.className = 'delta ' + (numDelta > 0 ? 'pos' : (numDelta < 0 ? 'neg' : ''));
      } else {
        tdDelta.textContent = '';
      }

      const tdNew = document.createElement('td');
      tdNew.textContent = Number.isFinite(myEloAfter) ? String(myEloAfter) : '';

      tr.appendChild(tdDate);
      tr.appendChild(tdEvent);
      tr.appendChild(tdOpp);
      tr.appendChild(tdOppElo);
      tr.appendChild(tdResult);
      tr.appendChild(tdDelta);
      tr.appendChild(tdNew);

      tbody.appendChild(tr);
    }

    tbl.appendChild(tbody);
  }

  function updatePeakBadge() {
    const el = document.getElementById('peakBadge');
    if (!el) return;

    const vals = RAW.map(p => Number(p.y)).filter(Number.isFinite);
    if (!vals.length) {
      el.textContent = 'Peak: —';
      return;
    }

    const peak = Math.max(...vals);
    el.textContent = `Peak: ${Math.round(peak)}`;
  }

  async function load() {
    try {
      document.getElementById('chart').textContent = 'Loading…';

      const [playersRes, histRes, gamesRes] = await Promise.all([
        fetch(playersUrl(), { cache: 'no-cache' }),
        fetch(historyUrl(idRaw), { cache: 'no-cache' }),
        fetch(gamesUrl(idRaw), { cache: 'no-cache' })
      ]);

      if (!playersRes.ok) throw new Error('players.json not found');
      if (!histRes.ok) throw new Error('history not found');

      const players = await playersRes.json();
      const me = players.find(p => p.id === idRaw);
      if (!me) throw new Error('player id not in players.json');

      document.getElementById('pname').textContent = me.display_name || me.name;

      const histJson = await histRes.json();
      RAW = normalise(
        (Array.isArray(histJson) ? histJson : []).map(d => ({
          x: d.date,
          y: Number(d.rating),
          event: d.event || ''
        })),
        true
      );

      updatePeakBadge();

      if (!RAW.length) {
        document.getElementById('chart').textContent = 'No games';
      } else {
        draw(document.getElementById('agg').value || 'monthly');
      }

      document.getElementById('agg').addEventListener('change', e => draw(e.target.value), { once: false });

      if (gamesRes.ok) {
        const games = await gamesRes.json();
        renderGamesTable(me, players, Array.isArray(games) ? games : []);
      } else {
        document.getElementById('games').innerHTML =
          '<tbody><tr><td colspan="7">No games</td></tr></tbody>';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('chart').textContent = 'Error: ' + e.message;
      document.getElementById('games').innerHTML =
        '<tbody><tr><td colspan="7">Error loading games</td></tr></tbody>';
    }
  }

  function setSection(sec) {
    const s = (sec || '').toLowerCase();
    state.section = SECTIONS[s] ? s : 'classical';

    document.getElementById('sec').value = state.section;
    setParam('sec', state.section);
    wireNavLinks();
    load();
  }

  window.addEventListener('DOMContentLoaded', () => {
    setSection(getParam('sec') || 'classical');
    document.getElementById('sec').addEventListener('change', e => setSection(e.target.value));
    wireNavLinks();
  });
</script>
</body>
</html>
