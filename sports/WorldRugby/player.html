<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>J-Ratings: Rugby Union</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    /* Profile page sizing tweaks */
    #chart { height: 520px; }

    /* Header row: View (left) | Team (centre) | Live/Peak (right) */
    .header-row{
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 20px;
    }

    h2#pname{
      justify-self: center;
      margin: 0;
      padding: 0;
      text-align: center;
      font-size: 3rem;
    }

    .toolbar{
      justify-self: start;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 0; /* important: don't push it down */
    }

    .toolbar label{
      margin-right: 6px;
      font-size: 1.05rem;
    }

    /* Stack: View row + since buttons underneath */
    .toolbar-stack{
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toolbar-top{
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-buttons{
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .range-btn{
      padding: 8px 10px;
      border: 1px solid #2b2f36;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      color: inherit;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .range-btn:hover{ opacity: 0.92; }

    .range-btn.is-active{
      background: rgba(255,255,255,0.10);
      border-color: rgba(200,200,200,0.55);
      font-weight: 700;
    }

    .team-stats{
      justify-self: end;
      display: flex;
      gap: 14px;
      align-items: center;
      text-align: centre;
    }

    .team-stats .stat{
      padding: 10px 12px;
      border: 1px solid #2b2f36;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      min-width: 90px;
    }

    .team-stats .stat-label{
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .team-stats .stat-value{
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .team-stats .stat-sub{
      font-size: 0.85rem;
      opacity: 0.75;
      margin-top: 2px;
    }

    h3.section-title{
      text-align: center;
      font-size: 1.6rem;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    #gamesWrap{
      max-height: 520px;
      overflow: auto;
      margin-top: 12px;
    }

    table.games{
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 1rem;
    }

    table.games th,
    table.games td{
      padding: 10px 12px;
      border-bottom: 1px solid #2b2f36;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    table.games th{
      position: sticky;
      top: 0;
      z-index: 2;
      background-color: var(--panel-bg, #1a1a1a);
    }

    /* Double separators: Date | Tournament | Opponent | Elo | Result | Δ */
    table.games th:nth-child(1), table.games td:nth-child(1),
    table.games th:nth-child(2), table.games td:nth-child(2),
    table.games th:nth-child(3), table.games td:nth-child(3),
    table.games th:nth-child(4), table.games td:nth-child(4),
    table.games th:nth-child(5), table.games td:nth-child(5),
    table.games th:nth-child(6), table.games td:nth-child(6) {
      border-right: 3px double rgba(128,128,128,0.6);
    }

    .result{ font-weight: 700; }
    .result.win{  color: #3ad542; }
    .result.loss{ color: #dc2222; }
    .result.draw{ color: #e5b523; }

    .delta{ font-weight: 700; }
    .delta.pos{ color: #3ad542; }
    .delta.neg{ color: #dc2222; }

    .opp{ text-align: left; }
    .tourn{
      text-align: left;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    td.opp a{
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    td.opp a:hover{ opacity: 0.9; }

    @media (max-width: 600px){
      #chart{ height: 420px; }
      h2#pname{ font-size: 1.6rem; }
      h3.section-title{ font-size: 1.25rem; }
      table.games{ font-size: 0.92rem; }
      table.games th, table.games td{ padding: 8px 10px; }
      .tourn{ max-width: 180px; }
    }

    @media (max-width: 700px){
      .header-row{
        grid-template-columns: 1fr;
        justify-items: centre;
        text-align: centre;
      }
      .toolbar{ justify-self: centre; }
      .team-stats{ justify-self: centre; }
    }

    /* Kill any underline rules coming from style.css (often via ::after) */
    .header-row,
    .header-row *{
      border-bottom: none !important;
      box-shadow: none !important;
      background-image: none !important;
      text-decoration: none !important;
    }

    .header-row::before,
    .header-row::after,
    #pname::before,
    #pname::after,
    .header-row .toolbar::before,
    .header-row .toolbar::after,
    .header-row .toolbar label::before,
    .header-row .toolbar label::after,
    .header-row .toolbar select::before,
    .header-row .toolbar select::after{
      content: none !important;
      display: none !important;
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-rugby">Rugby Union</span></span>
        <img src="../../Rugby Banner Logo.png" alt="Rugby logo" class="sport-logo">
      </a>
    </h1>
    <nav class="topnav" aria-label="Main">
      <a href="../../index.html">Sports</a>
      <a href="index.html">Home</a>
      <a href="compare.html">Compare</a>
      <a href="peak.html">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">

    <div class="header-row">
      <div class="toolbar">
        <div class="toolbar-stack">
          <div class="toolbar-top">
            <label for="agg">View:</label>
            <select id="agg">
              <option value="daily">Daily</option>
              <option value="monthly" selected>Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>

          <div class="range-buttons" role="group" aria-label="Time range">
            <button type="button" class="range-btn" data-since="">All</button>
            <button type="button" class="range-btn" data-since="2000">Since 2000</button>
            <button type="button" class="range-btn is-active" data-since="2020">Since 2020</button>
          </div>
        </div>
      </div>

      <h2 id="pname">Team</h2>

      <div id="teamStats" class="team-stats" aria-label="Team rating stats">
        <div class="stat">
          <div class="stat-label">Live</div>
          <div class="stat-value" id="liveVal">—</div>
        </div>

        <div class="stat">
          <div class="stat-label">Peak</div>
          <div class="stat-value" id="peakVal">—</div>
        </div>
      </div>
    </div>

    <div id="chart">Loading…</div>

    <h3 class="section-title">Games</h3>
    <div id="gamesWrap">
      <table id="games" class="games"></table>
    </div>
  </section>
</main>

<script>
  const params = new URLSearchParams(location.search);
  const idRaw = params.get('id');
  if (!idRaw) {
    document.getElementById('chart').textContent = 'Missing team id.';
    throw new Error('no id');
  }

  const TEAMS_URL = 'data/teams.json';
  const HIST_URL  = id => `data/history/${encodeURIComponent(id)}.json`;
  const GAMES_URL = id => `data/games/${encodeURIComponent(id)}.json`;
  const IS_TOUCH  = window.matchMedia('(pointer: coarse)').matches;

let RAW = [];
let SINCE_YEAR = 2020;     // default to Since 2020
let AGG_MODE = 'monthly';

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({
        x: p.x,
        y: +p.y,
        competition: p.competition || ''
      }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;
    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;
      lastKey = key;
    }
    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);
    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastCompetition = pts.length ? (pts[pts.length - 1].competition || '') : '';
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg, competition: lastCompetition };
    });

    return normalise(out, false);
  }

  function applySinceFilter(series, sinceYear) {
    if (!sinceYear) return series;
    const start = new Date(`${sinceYear}-01-01T00:00:00Z`).getTime();
    return series.filter(p => new Date(p.x).getTime() >= start);
  }

  function niceYBounds(ys) {
    const min = Math.min(...ys);
    const max = Math.max(...ys);

    if (!Number.isFinite(min) || !Number.isFinite(max)) return null;

    if (min === max) {
      const pad = 50;
      return { lo: min - pad, hi: max + pad };
    }

    const span = max - min;
    const pad = Math.max(25, span * 0.06); // 6% padding, minimum 25 Elo
    return { lo: min - pad, hi: max + pad };
  }

  function draw(mode) {
    AGG_MODE = mode;

    const el = document.getElementById('chart');
    if (el.textContent && el.textContent.includes('Loading')) el.textContent = '';

    const filtered = applySinceFilter(RAW, SINCE_YEAR);
    const data = aggregate(filtered, mode);

    const xs = data.map(p => p.x);
    const ysAll = data.map(p => p.y);
    const ys = ysAll.filter(Number.isFinite);
    const competitions = data.map(p => p.competition || '');

    if (!xs.length || !ys.length) {
      el.textContent = 'No games';
      return;
    }

    const bounds = niceYBounds(ys);
    if (!bounds) {
      el.textContent = 'No games';
      return;
    }

    const ymin = Math.floor(bounds.lo / 100) * 100;
    const ymax = Math.ceil(bounds.hi / 100) * 100;

    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper',
        x0: 0,
        x1: 1,
        y0: v,
        y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }

    const hoverExtra = (mode === 'daily') ? '<br>%{customdata}' : '';

    const trace = {
      type: 'scatter',
      x: xs,
      y: ysAll,
      customdata: competitions,
      mode: (mode === 'daily') ? 'lines' : 'lines+markers',
      line: { width: 3, shape: 'linear' },
      marker: (mode === 'daily') ? { size: 0 } : { size: 6 },
      hovertemplate: `%{x}<br>%{y:.0f} Elo${hoverExtra}<extra></extra>`,
      connectgaps: true
    };

    const bg = getComputedStyle(document.body).backgroundColor;
    Plotly.newPlot('chart', [trace], {
      margin: { l: 60, r: 20, t: 10, b: 45 },
      xaxis: { type: 'date' },
      yaxis: { title: 'Rating', range: [bounds.lo, bounds.hi] },
      paper_bgcolor: bg,
      plot_bgcolor: bg,
      font: { color: getComputedStyle(document.body).color, size: 14 },
      shapes
    }, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function getResultClassAndText(g, myName) {
    const isHome = g.home === myName;
    const isAway = g.away === myName;
    const raw = (g.result || '').trim();

    if (/^draw$/i.test(raw)) return { cls: 'draw', text: 'Draw' };
    if (raw === myName) return { cls: 'win', text: 'Win' };

    if ((isHome || isAway) && raw !== '' && raw !== myName) {
      return { cls: 'loss', text: 'Loss' };
    }
    return { cls: 'draw', text: raw || 'Draw' };
  }

  function renderGamesTable(me, teams, games) {
    const tbl = document.getElementById('games');
    tbl.innerHTML = '';

    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    for (const h of ['Date', 'Event', 'Opponent', 'Elo', 'Result', 'Δ', 'New']) {
      const th = document.createElement('th');
      th.textContent = h;
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    tbl.appendChild(thead);

    const panelBg = getComputedStyle(document.querySelector('.panel')).backgroundColor;
    thead.style.backgroundColor = panelBg;

    const tbody = document.createElement('tbody');
    games.sort((a, b) => new Date(b.date) - new Date(a.date));

    const myName = me.name;

    for (const g of games) {
      const tr = document.createElement('tr');

      const isHome = g.home === myName;
      const isAway = g.away === myName;
      if (!isHome && !isAway) continue;

      const opponentName = isHome ? g.away : g.home;
      const opponentElo = isHome ? Number(g.awayElo) : Number(g.homeElo);
      const myEloBefore = isHome ? Number(g.homeElo) : Number(g.awayElo);

      const numDelta = Number(g.delta);
      const myEloAfter = Number.isFinite(myEloBefore) && Number.isFinite(numDelta)
        ? Math.round(myEloBefore + numDelta)
        : NaN;

      const tdDate = document.createElement('td');
      tdDate.textContent = g.date || '';

      const tdTournament = document.createElement('td');
      tdTournament.className = 'tourn';
      tdTournament.title = g.competition || '';
      tdTournament.textContent = g.competition || '';

      const tdOpp = document.createElement('td');
      tdOpp.className = 'opp';

      if (opponentName) {
        const opponentTeam = teams.find(t => t.name === opponentName);
        if (opponentTeam && opponentTeam.id) {
          const a = document.createElement('a');
          a.href = `player.html?id=${encodeURIComponent(opponentTeam.id)}`;
          a.textContent = opponentName;
          tdOpp.appendChild(a);
        } else {
          tdOpp.textContent = opponentName;
        }
      } else {
        tdOpp.textContent = '';
      }

      const tdOppElo = document.createElement('td');
      tdOppElo.textContent = Number.isFinite(opponentElo) ? String(Math.round(opponentElo)) : '';

      const tdResult = document.createElement('td');
      const r = getResultClassAndText(g, myName);
      tdResult.textContent = r.text;
      tdResult.className = 'result ' + r.cls;

      const tdDelta = document.createElement('td');
      if (!Number.isNaN(numDelta)) {
        tdDelta.textContent = g.delta;
        tdDelta.className = 'delta ' + (numDelta > 0 ? 'pos' : (numDelta < 0 ? 'neg' : ''));
      } else {
        tdDelta.textContent = '';
      }

      const tdNew = document.createElement('td');
      tdNew.textContent = Number.isFinite(myEloAfter) ? String(myEloAfter) : '';

      tr.appendChild(tdDate);
      tr.appendChild(tdTournament);
      tr.appendChild(tdOpp);
      tr.appendChild(tdOppElo);
      tr.appendChild(tdResult);
      tr.appendChild(tdDelta);
      tr.appendChild(tdNew);
      tbody.appendChild(tr);
    }

    tbl.appendChild(tbody);
  }

  // Live has no date; Peak has date (within current filter)
  function renderTeamStats(series) {
    const liveEl = document.getElementById('liveVal');
    const peakEl = document.getElementById('peakVal');
    if (!liveEl || !peakEl) return;

    if (!series || !series.length) {
      liveEl.textContent = '—';
      peakEl.textContent = '—';
      return;
    }

    const live = series[series.length - 1];
    liveEl.textContent = Number.isFinite(live.y) ? String(Math.round(live.y)) : '—';

    let peak = series[0];
    for (const p of series) {
      if (Number.isFinite(p.y) && p.y > peak.y) peak = p;
    }
    peakEl.textContent = Number.isFinite(peak.y) ? String(Math.round(peak.y)) : '—';
  }

  function refreshView() {
    renderTeamStats(applySinceFilter(RAW, SINCE_YEAR));
    draw(AGG_MODE);
  }

  async function load() {
    try {
      const [teamsRes, histRes, gamesRes] = await Promise.all([
        fetch(TEAMS_URL, { cache: 'no-cache' }),
        fetch(HIST_URL(idRaw), { cache: 'no-cache' }),
        fetch(GAMES_URL(idRaw), { cache: 'no-cache' })
      ]);

      if (!teamsRes.ok) throw new Error('teams.json not found');
      if (!histRes.ok) throw new Error('history not found');

      const teams = await teamsRes.json();
      const me = teams.find(t => t.id === idRaw);
      if (!me) throw new Error('team id not in teams.json');

      document.getElementById('pname').textContent = me.name;

      const histJson = await histRes.json();
      RAW = normalise(
        histJson.map(d => ({
          x: d.date,
          y: Number(d.rating),
          competition: d.competition || ''
        })),
        true
      );

      // Chart + selector
      if (!RAW.length) {
        document.getElementById('chart').textContent = 'No games';
      } else {
        const initialMode = 'monthly';
        AGG_MODE = initialMode;
        document.getElementById('agg').value = initialMode;

        // Draw once with defaults (All + Monthly)
        refreshView();

        document.getElementById('agg').addEventListener('change', e => {
          draw(e.target.value);
        });

        // Since buttons
        document.querySelectorAll('.range-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('is-active'));
            btn.classList.add('is-active');

            const v = btn.getAttribute('data-since');
            SINCE_YEAR = v ? Number(v) : null;

            refreshView();
          });
        });
      }

      if (gamesRes.ok) {
        const games = await gamesRes.json();
        renderGamesTable(me, teams, games);
      } else {
        const tbl = document.getElementById('games');
        tbl.innerHTML = '<tbody><tr><td colspan="7">No games</td></tr></tbody>';
      }

    } catch (e) {
      console.error(e);
      document.getElementById('chart').textContent = 'Error: ' + e.message;
      const tbl = document.getElementById('games');
      tbl.innerHTML = '<tbody><tr><td colspan="7">Error loading games</td></tr></tbody>';
    }
  }

  load();
</script>
</body>
</html>
