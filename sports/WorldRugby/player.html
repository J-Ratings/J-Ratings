<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>J-Ratings: Rugby Union</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    /* Profile page sizing tweaks */
    #chart {
      height: 520px;
    }

    .toolbar {
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
    }

    .toolbar label {
      margin-right: 6px;
      font-size: 1.05rem;
    }

    h2#pname,
    h3.section-title {
      text-align: center;
    }

    h2#pname {
      font-size: 2rem;
      padding: 20px;
    }

    h3.section-title {
      font-size: 1.6rem;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    #gamesWrap {
      max-height: 520px;
      overflow: auto;
      margin-top: 12px;
    }

    table.games {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 1rem;
    }

    table.games th,
    table.games td {
      padding: 10px 12px;
      border-bottom: 1px solid #2b2f36;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    table.games th {
      position: sticky;
      top: 0;
      z-index: 2;
      background-color: var(--panel-bg, #1a1a1a);
    }

    /* Double separators: Date | Tournament | Opponent | Elo | Result | Δ */
    table.games th:nth-child(1), table.games td:nth-child(1),
    table.games th:nth-child(2), table.games td:nth-child(2),
    table.games th:nth-child(3), table.games td:nth-child(3),
    table.games th:nth-child(4), table.games td:nth-child(4),
    table.games th:nth-child(5), table.games td:nth-child(5),
    table.games th:nth-child(6), table.games td:nth-child(6) {
      border-right: 3px double rgba(128,128,128,0.6);
    }

    .result { font-weight: 700; }
    .result.win  { color: #3ad542; }
    .result.loss { color: #dc2222; }
    .result.draw { color: #e5b523; }

    .delta { font-weight: 700; }
    .delta.pos { color: #3ad542; }
    .delta.neg { color: #dc2222; }

    .opp { text-align: left; }
    .tourn {
      text-align: left;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .muted-small { opacity: .85; font-size: .9em; }

    /* Optional: make opponent links look like normal text but clickable */
    td.opp a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    td.opp a:hover {
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      #chart {
        height: 420px;
      }

      h2#pname {
        font-size: 1.6rem;
        padding: 16px;
      }

      h3.section-title {
        font-size: 1.25rem;
      }

      table.games {
        font-size: 0.92rem;
      }

      table.games th,
      table.games td {
        padding: 8px 10px;
      }

      .tourn {
        max-width: 180px;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-rugby">Rugby Union</span></span>
        <img src="../../Rugby Banner Logo.png" alt="Rugby logo" class="sport-logo">
      </a>
    </h1>
    <nav class="topnav" aria-label="Main">
      <a href="../../index.html">Sports</a>
      <a href="index.html">Home</a>
      <a href="compare.html">Compare</a>
      <a href="peak.html">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2 id="pname">Team</h2>

    <div class="toolbar">
      <label for="agg">View:</label>
      <select id="agg">
        <option value="daily">Daily</option>
        <option value="monthly" selected>Monthly</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>

    <div id="chart">Loading…</div>

    <h3 class="section-title">Games</h3>
    <div id="gamesWrap">
      <table id="games" class="games"></table>
    </div>
  </section>
</main>

<script>
  const params = new URLSearchParams(location.search);
  const idRaw = params.get('id');
  if (!idRaw) {
    document.getElementById('chart').textContent = 'Missing team id.';
    throw new Error('no id');
  }

  const TEAMS_URL = 'data/teams.json';
  const HIST_URL  = id => `data/history/${encodeURIComponent(id)}.json`;
  const GAMES_URL = id => `data/games/${encodeURIComponent(id)}.json`;
  const IS_TOUCH  = window.matchMedia('(pointer: coarse)').matches;

  let RAW = [];

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
.map(p => ({
  x: p.x,
  y: +p.y,
  competition: p.competition || ''
}))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;
    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;
      lastKey = key;
    }
    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);
    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
const lastCompetition = pts.length ? (pts[pts.length - 1].competition || '') : '';
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
return { x, y: avg, competition: lastCompetition };
    });

    return normalise(out, false);
  }

  function draw(mode) {
    const el = document.getElementById('chart');
    if (el.textContent && el.textContent.includes('Loading')) el.textContent = '';

    const data = aggregate(RAW, mode);
    const xs = data.map(p => p.x);
    const ys = data.map(p => p.y).filter(Number.isFinite);
    const competitions = data.map(p => p.competition || '');

    if (!xs.length || !ys.length) {
      el.textContent = 'No games';
      return;
    }

    const ymin = Math.floor(Math.min(...ys) / 100) * 100;
    const ymax = Math.ceil(Math.max(...ys) / 100) * 100;

    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper',
        x0: 0,
        x1: 1,
        y0: v,
        y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }

    const hoverExtra = (mode === 'daily') ? '<br>%{customdata}' : '';

    const trace = {
      type: 'scatter',
      x: xs,
      y: ys,
      customdata: competitions,
      mode: (mode === 'daily') ? 'lines' : 'lines+markers',
      line: { width: 3, shape: 'linear' },
      marker: (mode === 'daily') ? { size: 0 } : { size: 6 },
      hovertemplate: `%{x}<br>%{y:.0f} Elo${hoverExtra}<extra></extra>`,
      connectgaps: true
    };

    const bg = getComputedStyle(document.body).backgroundColor;
    Plotly.newPlot('chart', [trace], {
      margin: { l: 60, r: 20, t: 10, b: 45 },
      xaxis: { type: 'date' },
      yaxis: { title: 'Rating' },
      paper_bgcolor: bg,
      plot_bgcolor: bg,
      font: { color: getComputedStyle(document.body).color, size: 14 },
      shapes
    }, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function getResultClassAndText(g, myName) {
    const isHome = g.home === myName;
    const isAway = g.away === myName;
    const raw = (g.result || '').trim();

    if (/^draw$/i.test(raw)) {
      return { cls: 'draw', text: 'Draw' };
    }

    if (raw === myName) {
      return { cls: 'win', text: 'Win' };
    }

    if ((isHome || isAway) && raw !== '' && raw !== myName) {
      return { cls: 'loss', text: 'Loss' };
    }

    return { cls: 'draw', text: raw || 'Draw' };
  }

  // UPDATED: now takes the full team object + teams list so we can link opponents by id
  function renderGamesTable(me, teams, games) {
    const tbl = document.getElementById('games');
    tbl.innerHTML = '';

    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    for (const h of ['Date', 'Event', 'Opponent', 'Elo', 'Result', 'Δ', 'New']) {
      const th = document.createElement('th');
      th.textContent = h;
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    tbl.appendChild(thead);

    const panelBg = getComputedStyle(document.querySelector('.panel')).backgroundColor;
    thead.style.backgroundColor = panelBg;

    const tbody = document.createElement('tbody');
    games.sort((a, b) => new Date(b.date) - new Date(a.date));

    const myName = me.name;

    for (const g of games) {
      const tr = document.createElement('tr');

      const isHome = g.home === myName;
      const isAway = g.away === myName;
      if (!isHome && !isAway) continue;

      const opponentName = isHome ? g.away : g.home;
      const opponentElo = isHome ? Number(g.awayElo) : Number(g.homeElo);
      const myEloBefore = isHome ? Number(g.homeElo) : Number(g.awayElo);

      const numDelta = Number(g.delta);
      const myEloAfter = Number.isFinite(myEloBefore) && Number.isFinite(numDelta)
        ? Math.round(myEloBefore + numDelta)
        : NaN;

      const tdDate = document.createElement('td');
      tdDate.textContent = g.date || '';

      const tdTournament = document.createElement('td');
      tdTournament.className = 'tourn';
tdTournament.title = g.competition || '';
tdTournament.textContent = g.competition || '';

      // UPDATED: clickable opponent if present in teams.json
      const tdOpp = document.createElement('td');
      tdOpp.className = 'opp';

      if (opponentName) {
        const opponentTeam = teams.find(t => t.name === opponentName);

        if (opponentTeam && opponentTeam.id) {
          const a = document.createElement('a');
          a.href = `player.html?id=${encodeURIComponent(opponentTeam.id)}`;
          a.textContent = opponentName;
          tdOpp.appendChild(a);
        } else {
          tdOpp.textContent = opponentName;
        }
      } else {
        tdOpp.textContent = '';
      }

      const tdOppElo = document.createElement('td');
      tdOppElo.textContent = Number.isFinite(opponentElo) ? String(Math.round(opponentElo)) : '';

      const tdResult = document.createElement('td');
      const r = getResultClassAndText(g, myName);
      tdResult.textContent = r.text;
      tdResult.className = 'result ' + r.cls;

      const tdDelta = document.createElement('td');
      if (!Number.isNaN(numDelta)) {
        tdDelta.textContent = g.delta;
        tdDelta.className = 'delta ' + (numDelta > 0 ? 'pos' : (numDelta < 0 ? 'neg' : ''));
      } else {
        tdDelta.textContent = '';
      }

      const tdNew = document.createElement('td');
      tdNew.textContent = Number.isFinite(myEloAfter) ? String(myEloAfter) : '';

      tr.appendChild(tdDate);
      tr.appendChild(tdTournament);
      tr.appendChild(tdOpp);
      tr.appendChild(tdOppElo);
      tr.appendChild(tdResult);
      tr.appendChild(tdDelta);
      tr.appendChild(tdNew);
      tbody.appendChild(tr);
    }

    tbl.appendChild(tbody);
  }

  async function load() {
    try {
      const [teamsRes, histRes, gamesRes] = await Promise.all([
        fetch(TEAMS_URL, { cache: 'no-cache' }),
        fetch(HIST_URL(idRaw), { cache: 'no-cache' }),
        fetch(GAMES_URL(idRaw), { cache: 'no-cache' })
      ]);

      if (!teamsRes.ok) throw new Error('teams.json not found');
      if (!histRes.ok) throw new Error('history not found');

      const teams = await teamsRes.json();
      const me = teams.find(t => t.id === idRaw);
      if (!me) throw new Error('team id not in teams.json');

      document.getElementById('pname').textContent = me.name;

      const histJson = await histRes.json();
RAW = normalise(
  histJson.map(d => ({
    x: d.date,
    y: Number(d.rating),
    competition: d.competition || ''
  })),
  true
);

      if (!RAW.length) {
        document.getElementById('chart').textContent = 'No games';
      } else {
        const initialMode = 'monthly';
        document.getElementById('agg').value = initialMode;
        draw(initialMode);
        document.getElementById('agg').addEventListener('change', e => draw(e.target.value));
      }

      if (gamesRes.ok) {
        const games = await gamesRes.json();
        renderGamesTable(me, teams, games); // UPDATED
      } else {
        const tbl = document.getElementById('games');
        tbl.innerHTML = '<tbody><tr><td colspan="7">No games</td></tr></tbody>';
      }

    } catch (e) {
      console.error(e);
      document.getElementById('chart').textContent = 'Error: ' + e.message;
      const tbl = document.getElementById('games');
      tbl.innerHTML = '<tbody><tr><td colspan="7">Error loading games</td></tr></tbody>';
    }
  }

  load();
</script>
</body>
</html>
