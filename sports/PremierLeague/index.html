<html lang="en">

  <meta charset="utf-8">
  <title>J-Ratings: English Football</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    #compare-chart { height: 500px; }

    .compare-chart-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    /* Modal */
    #compare-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #compare-modal > div {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 80%;
      overflow: auto;
      colour: #fff;
    }

    .compare-controls { margin: 10px 0; }
    .compare-controls button { margin-right: 10px; }

    /* If your global style.css already defines .asof you can remove this */
    .asof {
      opacity: 0.8;
      font-size: 0.95rem;
      margin: 6px 0 12px 0;
      white-space: nowrap;
      padding-left: 12px;
    }

    @media (max-width: 520px) {
      #teams {
        width: 100%;
        table-layout: fixed;
      }

      #teams th,
      #teams td {
        min-width: 0 !important;
        padding: 10px 8px;
      }

      #teams th:nth-child(1),
      #teams td:nth-child(1) { width: 52px; }

      #teams th:nth-child(3),
      #teams td:nth-child(3) { width: 78px; }

      #teams th:nth-child(2),
      #teams td:nth-child(2) { width: auto; }

      #teams td:nth-child(2) a {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-football">English Football</span></span>
        <img src="../../Football Banner Logo.png" alt="Football logo" class="sport-logo">
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="../../index.html">Sports</a>
      <a id="nav-home" href="index.html" class="active-tab">Home</a>
      <a id="nav-compare" href="compare.html">Compare</a>
      <a id="nav-peak" href="peak.html">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="teams-panel">
    <h2>All teams</h2>
    <div id="asof" class="asof" aria-live="polite"></div>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by team…">

      <label for="season" style="margin-left:auto">Season:</label>
      <select id="season">
        <option value="live" selected>Live</option>
      </select>

      <button id="compare-btn" class="club-btn" type="button">Compare</button>
    </div>

    <div id="compare-wrap" style="display:none; padding:16px">
      <div class="compare-chart-toolbar">
        <label for="compare-agg">View:</label>
        <select id="compare-agg">
          <option value="daily">Daily</option>
          <option value="monthly" selected>Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>

      <div id="compare-chart">Loading…</div>
    </div>

    <div class="table-wrap">
      <table id="teams">
        <thead>
          <tr>
            <th style="min-width:60px">Rank</th>
            <th style="min-width:240px">Team</th>
            <th class="right" style="min-width:120px" id="rating-col-head">Rating</th>
            <th style="min-width:180px">Tier</th>
          </tr>
        </thead>
        <tbody><!-- filled by JS --></tbody>
      </table>
    </div>
  </section>

  <!-- Compare Selection Modal -->
  <div id="compare-modal">
    <div>
      <h3>Select teams to view:</h3>
      <div class="compare-controls">
        <button id="compare-show-top">Show Selected</button>
        <button id="compare-cancel-top">Cancel</button>
      </div>
      <div id="compare-list" style="margin:10px 0 20px 0;"></div>
      <div class="compare-controls">
        <button id="compare-show-bottom">Show Selected</button>
        <button id="compare-cancel-bottom">Cancel</button>
      </div>
    </div>
  </div>
</main>

<script>
  const DATA_URL = 'data/teams.json';
  const SEASON_STARTS_URL = 'data/season_starts.json';
  const META_URL = 'data/meta.json';

  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

  const state = {
    mode: 'live',      // 'live' or season label e.g. '2023-24'
    meta: null,        // { asof: 'YYYY-MM-DD', games: N } (optional)
    liveRows: [],      // from teams.json
    seasonStarts: [],  // from season_starts.json
    rows: [],          // currently displayed rows
    filtered: []
  };

  const histCache = new Map();
  let lastCompared = [];

function formatAsOf(iso) {
  // Expecting YYYY-MM-DD
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y || !m || !d) return iso; // fallback if unexpected
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d} ${months[m - 1]} ${y}`;
}

function setAsOfText() {
  const el = document.getElementById('asof');
  if (!el) return;

  if (state.mode === 'live' && state.meta && state.meta.asof) {
    el.style.display = 'block';
    el.textContent = `Updated to: ${formatAsOf(state.meta.asof)}`;
  } else {
    el.style.display = 'none';
    el.textContent = '';
  }
}

  function tierLabel(row) {
    if (row.division && String(row.division).trim()) return row.division;
    const t = Number(row.tier);
    if (t === 1) return 'Premier League';
    if (t === 2) return 'Championship';
    if (t === 3) return 'League 1';
    if (t === 4) return 'League 2';
    return '';
  }

  function updateRatingHeader() {
    const h = document.getElementById('rating-col-head');
    if (!h) return;
    h.textContent = (state.mode === 'live') ? 'Rating' : 'Start Elo';
  }

  function render() {
    const tbody = document.querySelector('#teams tbody');
    tbody.innerHTML = '';

    state.filtered.forEach((r, i) => {
      const tr = document.createElement('tr');

      const tdRank = document.createElement('td');
      tdRank.textContent = i + 1;
      tr.appendChild(tdRank);

      const tdName = document.createElement('td');
      const a = document.createElement('a');
      a.href = `player.html?id=${encodeURIComponent(r.id)}`;
      a.textContent = r.name;
      tdName.appendChild(a);
      tr.appendChild(tdName);

      const tdRt = document.createElement('td');
      tdRt.className = 'right';
      tdRt.textContent = Number.isFinite(+r.rating) ? Math.round(+r.rating) : '';
      tr.appendChild(tdRt);

      const tdTier = document.createElement('td');
      tdTier.textContent = tierLabel(r);
      tr.appendChild(tdTier);

      tbody.appendChild(tr);
    });
  }

  function hideCompare() {
    document.getElementById('compare-wrap').style.display = 'none';
    document.getElementById('compare-chart').innerHTML = '';
    lastCompared = [];
  }

  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    state.filtered = !q
      ? state.rows.slice()
      : state.rows.filter(r => r.name.toLowerCase().includes(q));

    updateRatingHeader();
    render();
    hideCompare();
  }

  function rebuildRowsFromMode() {
    const mode = document.getElementById('season').value;
    state.mode = mode;

    if (mode === 'live') {
      state.rows = state.liveRows
        .slice()
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
    } else {
      state.rows = state.seasonStarts
        .filter(d => d.season === mode)
        .map(d => ({
          id: d.id,
          name: d.name,
          rating: +d.elo,
          tier: Number.isFinite(+d.tier) ? +d.tier : null,
          division: d.division || ''
        }))
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
    }

    setAsOfText();
    applyFilter();
  }

  function populateSeasonSelect() {
    const sel = document.getElementById('season');

    const seasons = Array.from(new Set(
      state.seasonStarts.map(d => d.season).filter(Boolean)
    )).sort((a, b) => {
      const ay = parseInt(String(a).slice(0, 4), 10);
      const by = parseInt(String(b).slice(0, 4), 10);
      return by - ay;
    });

    for (const s of seasons) {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      sel.appendChild(opt);
    }
  }

  async function fetchHistoryFor(id) {
    if (histCache.has(id)) return histCache.get(id);

    try {
      const res = await fetch(`data/history/${encodeURIComponent(id)}.json`, { cache: 'no-cache' });
      if (!res.ok) return null;
      const rows = await res.json();
      histCache.set(id, rows);
      return rows;
    } catch {
      return null;
    }
  }

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({
        x: p.x,
        y: +p.y,
        tier: Number.isFinite(+p.tier) ? +p.tier : null
      }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;

    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;

      lastKey = key;
    }

    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);

    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastTier = pts.length ? (pts[pts.length - 1].tier ?? null) : null;
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg, tier: lastTier };
    });

    return normalise(out, false);
  }

  async function buildComparison(teams) {
    lastCompared = teams.slice();

    const wrap = document.getElementById('compare-wrap');
    const chart = document.getElementById('compare-chart');
    const modeSel = document.getElementById('compare-agg');

    wrap.style.display = 'block';
    chart.innerHTML = 'Loading…';

    const mode = modeSel ? modeSel.value : 'monthly';

    const traces = [];
    let ymin = Infinity, ymax = -Infinity;

    for (const t of teams) {
      const hist = await fetchHistoryFor(t.id);
      if (!hist || !hist.length) continue;

      const raw = hist.map(d => ({ x: d.date, y: Number(d.rating), tier: Number(d.tier) }));
      const data = aggregate(raw, mode);

      const xs = data.map(pt => pt.x);
      const ys = data.map(pt => pt.y);
      const tiers = data.map(pt => pt.tier ?? '');
      if (!xs.length || !ys.length) continue;

      ymin = Math.min(ymin, ...ys);
      ymax = Math.max(ymax, ...ys);

      traces.push({
        type: 'scatter',
        name: t.name,
        x: xs,
        y: ys,
        customdata: tiers,
        mode: (mode === 'daily') ? 'lines' : 'lines+markers',
        line: { width: 2, shape: 'linear' },
        marker: (mode === 'daily') ? { size: 0 } : { size: 4 },
        hovertemplate: '%{x}<br>%{y:.0f} Elo<br>Tier %{customdata}<extra>' + t.name + '</extra>',
        connectgaps: true
      });
    }

    if (!traces.length) {
      chart.innerHTML = 'No history found.';
      return;
    }

    ymin = Math.floor(ymin / 100) * 100;
    ymax = Math.ceil(ymax / 100) * 100;

    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper', x0: 0, x1: 1,
        y0: v, y1: v,
        line: { width: 1, colour: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }

    const cs = getComputedStyle(document.body);
    const layout = {
      margin: { l: 50, r: 20, t: 10, b: 40 },
      xaxis: { type: 'date' },
      yaxis: { title: 'Rating' },
      legend: { orientation: 'h' },
      paper_bgcolour: cs.backgroundColor,
      plot_bgcolour: cs.backgroundColor,
      font: { colour: cs.color },
      shapes
    };

    Plotly.newPlot(chart, traces, layout, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function setupCompareButton() {
    const modal = document.getElementById('compare-modal');
    const listDiv = document.getElementById('compare-list');

    function openModal() {
      listDiv.innerHTML = '';

      state.filtered.forEach(t => {
        const id = `chk-${t.id}`;
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `
          <label>
            <input type="checkbox" id="${id}" value="${t.id}" style="margin-right:6px">
            ${t.name} (${Math.round(t.rating)})
          </label>
        `;
        listDiv.appendChild(wrapper);
      });

      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function showSelected() {
      const selectedIds = Array.from(listDiv.querySelectorAll('input:checked')).map(cb => cb.value);
      if (!selectedIds.length) {
        alert('Please select at least one team.');
        return;
      }

      closeModal();

      const compareAgg = document.getElementById('compare-agg');
      if (compareAgg) compareAgg.value = 'monthly';

      const chosen = state.filtered.filter(t => selectedIds.includes(t.id));
      buildComparison(chosen);
    }

    document.getElementById('compare-btn').addEventListener('click', openModal);
    document.getElementById('compare-show-top').addEventListener('click', showSelected);
    document.getElementById('compare-show-bottom').addEventListener('click', showSelected);
    document.getElementById('compare-cancel-top').addEventListener('click', closeModal);
    document.getElementById('compare-cancel-bottom').addEventListener('click', closeModal);
  }

  async function load() {
    try {
      const [teamsRes, seasonRes, metaRes] = await Promise.all([
        fetch(DATA_URL, { cache: 'no-cache' }),
        fetch(SEASON_STARTS_URL, { cache: 'no-cache' }),
        fetch(META_URL, { cache: 'no-cache' })
      ]);

      if (!teamsRes.ok) throw new Error('Failed to load teams.json');
      if (!seasonRes.ok) throw new Error('Failed to load season_starts.json');

      const teamsData = await teamsRes.json();
      const seasonData = await seasonRes.json();

      state.meta = metaRes.ok ? await metaRes.json() : null;

      state.liveRows = teamsData
        .filter(d => d && d.id && d.name && Number.isFinite(+d.rating))
        .map(d => ({
          id: d.id,
          name: d.name,
          rating: +d.rating,
          tier: Number.isFinite(+d.tier) ? +d.tier : null,
          division: d.division || ''
        }))
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));

      state.seasonStarts = Array.isArray(seasonData)
        ? seasonData.filter(d => d && d.id && d.name && d.season && Number.isFinite(+d.elo))
        : [];

      populateSeasonSelect();
      rebuildRowsFromMode(); // also calls setAsOfText()
    } catch (err) {
      const asofEl = document.getElementById('asof');
      if (asofEl) { asofEl.style.display = 'none'; asofEl.textContent = ''; }

      document.querySelector('#teams tbody').innerHTML =
        `<tr><td colspan="4">Error loading data: ${err.message}</td></tr>`;
    }
  }

  document.getElementById('compare-agg').addEventListener('change', () => {
    if (lastCompared.length) buildComparison(lastCompared);
  });

  document.getElementById('season').addEventListener('change', rebuildRowsFromMode);
  document.getElementById('q').addEventListener('input', applyFilter);

  setupCompareButton();
  load();
</script>
</body>
</html>
