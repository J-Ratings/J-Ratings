<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <title>J-Ratings: Go</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    #chart { height: 520px; }

    .header-row{
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 20px;
    }

    h2#pname{
      justify-self: center;
      margin: 0;
      padding: 0;
      text-align: center;
      font-size: 2rem;
    }

    .toolbar{
      justify-self: start;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 0;
      flex-wrap: wrap;
    }

    .toolbar label{
      margin-right: 6px;
      font-size: 1.05rem;
    }

    .toolbar-stack{
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toolbar-top{
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .range-buttons{
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .range-btn{
      padding: 8px 10px;
      border: 1px solid #2b2f36;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      color: inherit;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .range-btn:hover{ opacity: 0.92; }

    .range-btn.is-active{
      background: rgba(255,255,255,0.10);
      border-color: rgba(200,200,200,0.55);
      font-weight: 700;
    }

    .player-stats{
      justify-self: end;
      display: flex;
      gap: 14px;
      align-items: center;
      text-align: centre;
    }

    .player-stats .stat{
      padding: 10px 12px;
      border: 1px solid #2b2f36;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      min-width: 90px;
    }

    .player-stats .stat-label{
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .player-stats .stat-value{
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.1;
    }

    h3.section-title{
      text-align: center;
      font-size: 1.6rem;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    #gamesWrap{
      max-height: 520px;
      overflow: auto;
      margin-top: 12px;
    }

    table.games{
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 1rem;
    }

    table.games th,
    table.games td{
      padding: 10px 12px;
      border-bottom: 1px solid #2b2f36;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    table.games th{
      position: sticky;
      top: 0;
      z-index: 2;
      background-color: var(--panel-bg, #1a1a1a);
    }

    /* Column separators for the original Go table (6 cols) */
    table.games th:nth-child(1), table.games td:nth-child(1),
    table.games th:nth-child(2), table.games td:nth-child(2),
    table.games th:nth-child(3), table.games td:nth-child(3),
    table.games th:nth-child(4), table.games td:nth-child(4),
    table.games th:nth-child(5), table.games td:nth-child(5) {
      border-right: 3px double rgba(128,128,128,0.6);
    }

    .result{ font-weight: 700; }
    .result.win{  color: #2acd4e; }
    .result.loss{ color: #e03232; }
    .result.draw{ color: #e8a81f; }

    .delta{ font-weight: 700; }
    .delta.pos{ color: #2acd4e; }
    .delta.neg{ color: #e03232; }

    .opp{ text-align: left; }

    td.opp a{
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    td.opp a:hover{ opacity: 0.9; }

    @media (max-width: 600px){
      #chart{ height: 420px; }
      h2#pname{ font-size: 1.6rem; }
      h3.section-title{ font-size: 1.25rem; }
      table.games{ font-size: 0.92rem; }
      table.games th, table.games td{ padding: 8px 10px; }
    }

    @media (max-width: 700px){
      .header-row{
        grid-template-columns: 1fr;
        justify-items: centre;
        text-align: centre;
      }
      .toolbar{ justify-self: centre; }
      .player-stats{ justify-self: centre; }
    }

    .header-row,
    .header-row *{
      border-bottom: none !important;
      box-shadow: none !important;
      background-image: none !important;
      text-decoration: none !important;
    }

    .header-row::before,
    .header-row::after,
    #pname::before,
    #pname::after,
    .header-row .toolbar::before,
    .header-row .toolbar::after,
    .header-row .toolbar label::before,
    .header-row .toolbar label::after,
    .header-row .toolbar select::before,
    .header-row .toolbar select::after{
      content: none !important;
      display: none !important;
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="index.html" class="brand-with-logo">
        <span>J-Ratings <span class="title-go">Go</span></span>
        <img src="../../Go Banner Logo.png" alt="Go logo" class="sport-logo">
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="../../index.html">Sports</a>
      <a id="nav-home" href="index.html">Home</a>
      <a id="nav-compare" href="compare.html">Compare</a>
      <a id="nav-peak" href="peak.html">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel">

    <div class="header-row">
      <div class="toolbar">
        <div class="toolbar-stack">
          <div class="toolbar-top">
            <label for="agg">View:</label>
            <select id="agg">
              <option value="daily">Daily</option>
              <option value="monthly" selected>Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>

          <div class="range-buttons" role="group" aria-label="Time range">
            <button type="button" class="range-btn is-active" data-since="">All</button>
            <button type="button" class="range-btn" data-since="2000">Since 2000</button>
            <button type="button" class="range-btn" data-since="2020">Since 2020</button>
          </div>
        </div>
      </div>

      <h2 id="pname">Player</h2>

      <div id="playerStats" class="player-stats" aria-label="Player rating stats">
        <div class="stat">
          <div class="stat-label">Live</div>
          <div class="stat-value" id="liveVal">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Peak</div>
          <div class="stat-value" id="peakVal">—</div>
        </div>
      </div>
    </div>

    <div id="chart">Loading…</div>

    <h3 class="section-title">Games</h3>
    <div id="gamesWrap">
      <table id="games" class="games"></table>
    </div>

  </section>
</main>

<script>
  const params = new URLSearchParams(location.search);
  const idRaw = params.get('id');
  if (!idRaw) {
    document.getElementById('chart').textContent = 'Missing player id.';
    throw new Error('no id');
  }

  const PLAYERS_URL = 'data/players.json';
  const HIST_URL    = id => `data/history/${encodeURIComponent(id)}.json`;
  const GAMES_URL   = id => `data/games/${encodeURIComponent(id)}.json`;
  const IS_TOUCH    = window.matchMedia('(pointer: coarse)').matches;

  let RAW = [];
  let SINCE_YEAR = null;
  let AGG_MODE = 'monthly';

  // Prevent older async loads overwriting newer ones
  let LOAD_TOKEN = 0;

  function wireNavLinks() {
    document.getElementById('home-link').href   = `index.html`;
    document.getElementById('nav-home').href    = `index.html`;
    document.getElementById('nav-compare').href = `compare.html`;
    document.getElementById('nav-peak').href    = `peak.html`;
  }

  function normalise(series, dedupeByDay = false) {
    const s = (Array.isArray(series) ? series : [])
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({
        x: p.x,
        y: +p.y,
        event: p.event || p.tournament || ''
      }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;
    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;
      lastKey = key;
    }
    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);
    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastEvent = pts.length ? (pts[pts.length - 1].event || '') : '';
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg, event: lastEvent };
    });

    return normalise(out, false);
  }

  function applySinceFilter(series, sinceYear) {
    if (!sinceYear) return series;
    const start = new Date(`${sinceYear}-01-01T00:00:00Z`).getTime();
    return series.filter(p => new Date(p.x).getTime() >= start);
  }

  function niceYBounds(ys) {
    const min = Math.min(...ys);
    const max = Math.max(...ys);
    if (!Number.isFinite(min) || !Number.isFinite(max)) return null;

    if (min === max) return { lo: min - 50, hi: max + 50 };

    const span = max - min;
    const pad = Math.max(25, span * 0.06);
    return { lo: min - pad, hi: max + pad };
  }

  function draw(mode) {
    AGG_MODE = mode;

    const el = document.getElementById('chart');
    if (el.textContent && el.textContent.includes('Loading')) el.textContent = '';

    const filtered = applySinceFilter(RAW, SINCE_YEAR);
    const data = aggregate(filtered, mode);

    const xs = data.map(p => p.x);
    const ysAll = data.map(p => p.y);
    const ys = ysAll.filter(Number.isFinite);
    const events = data.map(p => p.event || '');

    if (!xs.length || !ys.length) {
      el.textContent = 'No games';
      return;
    }

    const bounds = niceYBounds(ys);
    if (!bounds) {
      el.textContent = 'No games';
      return;
    }

    const ymin = Math.floor(bounds.lo / 100) * 100;
    const ymax = Math.ceil(bounds.hi / 100) * 100;

    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper',
        x0: 0,
        x1: 1,
        y0: v,
        y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }

    const hoverExtra = (mode === 'daily') ? '<br>%{customdata}' : '';

    const trace = {
      type: 'scatter',
      x: xs,
      y: ysAll,
      customdata: events,
      mode: (mode === 'daily') ? 'lines' : 'lines+markers',
      line: { width: 3, shape: 'linear' },
      marker: (mode === 'daily') ? { size: 0 } : { size: 6 },
      hovertemplate: `%{x}<br>%{y:.0f} Rating${hoverExtra}<extra></extra>`,
      connectgaps: true
    };

    const bg = getComputedStyle(document.body).backgroundColor;
    Plotly.newPlot('chart', [trace], {
      margin: { l: 60, r: 20, t: 10, b: 45 },
      xaxis: { type: 'date' },
      yaxis: { title: 'Rating', range: [bounds.lo, bounds.hi] },
      paper_bgcolor: bg,
      plot_bgcolor: bg,
      font: { color: getComputedStyle(document.body).color, size: 14 },
      shapes
    }, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function makeOpponentCell(opponentName, players) {
    const td = document.createElement('td');
    td.className = 'opp';

    const player = players.find(p => p.name === opponentName);

    if (player && player.id) {
      const a = document.createElement('a');
      a.href = `player.html?id=${encodeURIComponent(player.id)}`;
      a.textContent = opponentName || '';
      td.appendChild(a);
    } else {
      td.textContent = opponentName || '';
    }

    return td;
  }

  // IMPORTANT: Keep the original Go logic (do not swap this to Chess rules)
  function getResultForPlayer(g, myName) {
    const raw = (g.result || '').trim();

    if (
      raw === '1/2' ||
      raw === '1/2-1/2' ||
      raw === '½-½' ||
      /^draw$/i.test(raw)
    ) {
      return { cls: 'draw', text: 'Draw' };
    }

    if (raw === '1-0') {
      return (g.black === myName)
        ? { cls: 'win', text: 'Win' }
        : { cls: 'loss', text: 'Loss' };
    }

    if (raw === '0-1') {
      return (g.white === myName)
        ? { cls: 'win', text: 'Win' }
        : { cls: 'loss', text: 'Loss' };
    }

    return { cls: '', text: raw || '' };
  }

  // Keep the original Go table (no Event column)
  function renderGamesTable(me, players, games) {
    const tbl = document.getElementById('games');
    tbl.innerHTML = '';

    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    for (const h of ['Date', 'Opponent', 'Elo', 'Result', 'Δ', 'New']) {
      const th = document.createElement('th');
      th.textContent = h;
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    tbl.appendChild(thead);

    const panelBg = getComputedStyle(document.querySelector('.panel')).backgroundColor;
    thead.style.backgroundColor = panelBg;

    const tbody = document.createElement('tbody');
    const rows = Array.isArray(games) ? [...games] : [];
    rows.sort((a, b) => new Date(b.date) - new Date(a.date));

    const myName = me.name;
    let added = 0;

    for (const g of rows) {
      const isBlack = g.black === myName;
      const isWhite = g.white === myName;
      if (!isBlack && !isWhite) continue;

      const opponentName = isBlack ? g.white : g.black;
      const opponentElo  = isBlack ? Number(g.whiteElo) : Number(g.blackElo);
      const myEloBefore  = isBlack ? Number(g.blackElo) : Number(g.whiteElo);

      const numDelta = Number(g.delta);
      const myEloAfter = Number.isFinite(myEloBefore) && Number.isFinite(numDelta)
        ? Math.round(myEloBefore + numDelta)
        : NaN;

      const tr = document.createElement('tr');

      const tdDate = document.createElement('td');
      tdDate.textContent = g.date || '';

      const tdOpp = makeOpponentCell(opponentName, players);

      const tdOppElo = document.createElement('td');
      tdOppElo.textContent = Number.isFinite(opponentElo) ? String(Math.round(opponentElo)) : '';

      const tdResult = document.createElement('td');
      const r = getResultForPlayer(g, myName);
      tdResult.textContent = r.text;
      tdResult.className = 'result' + (r.cls ? ' ' + r.cls : '');

      const tdDelta = document.createElement('td');
      if (!Number.isNaN(numDelta)) {
        tdDelta.textContent = g.delta;
        tdDelta.className = 'delta ' + (numDelta > 0 ? 'pos' : (numDelta < 0 ? 'neg' : ''));
      } else {
        tdDelta.textContent = '';
      }

      const tdNew = document.createElement('td');
      tdNew.textContent = Number.isFinite(myEloAfter) ? String(myEloAfter) : '';

      tr.appendChild(tdDate);
      tr.appendChild(tdOpp);
      tr.appendChild(tdOppElo);
      tr.appendChild(tdResult);
      tr.appendChild(tdDelta);
      tr.appendChild(tdNew);

      tbody.appendChild(tr);
      added++;
    }

    if (!added) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 6;
      td.textContent = 'No games';
      tr.appendChild(td);
      tbody.appendChild(tr);
    }

    tbl.appendChild(tbody);
  }

  function renderPlayerStats(series) {
    const liveEl = document.getElementById('liveVal');
    const peakEl = document.getElementById('peakVal');
    if (!liveEl || !peakEl) return;

    if (!series || !series.length) {
      liveEl.textContent = '—';
      peakEl.textContent = '—';
      return;
    }

    const live = series[series.length - 1];
    liveEl.textContent = Number.isFinite(live.y) ? String(Math.round(live.y)) : '—';

    let peak = series[0];
    for (const p of series) {
      if (Number.isFinite(p.y) && (!Number.isFinite(peak.y) || p.y > peak.y)) peak = p;
    }
    peakEl.textContent = Number.isFinite(peak.y) ? String(Math.round(peak.y)) : '—';
  }

  function refreshView() {
    renderPlayerStats(applySinceFilter(RAW, SINCE_YEAR));
    draw(AGG_MODE);
  }

  async function load() {
    const token = ++LOAD_TOKEN;

    try {
      document.getElementById('chart').textContent = 'Loading…';
      document.getElementById('games').innerHTML = '<tbody><tr><td colspan="6">Loading…</td></tr></tbody>';

      const [playersRes, histRes, gamesRes] = await Promise.all([
        fetch(PLAYERS_URL, { cache: 'no-cache' }),
        fetch(HIST_URL(idRaw), { cache: 'no-cache' }),
        fetch(GAMES_URL(idRaw), { cache: 'no-cache' })
      ]);

      if (token !== LOAD_TOKEN) return;

      if (!playersRes.ok) throw new Error('players.json not found');
      if (!histRes.ok) throw new Error('history not found');

      const players = await playersRes.json();
      const me = players.find(p => p.id === idRaw);
      if (!me) throw new Error('player id not in players.json');

      document.getElementById('pname').textContent = me.display_name || me.name || me.id;

      const histJson = await histRes.json();
      RAW = normalise(
        (Array.isArray(histJson) ? histJson : []).map(d => ({
          x: d.date,
          y: Number(d.rating),
          event: d.event || d.tournament || ''
        })),
        true
      );

      if (!RAW.length) {
        document.getElementById('chart').textContent = 'No games';
        renderPlayerStats([]);
      } else {
        AGG_MODE = document.getElementById('agg').value || 'monthly';
        refreshView();
      }

      if (gamesRes.ok) {
        const games = await gamesRes.json();
        if (token !== LOAD_TOKEN) return;
        renderGamesTable(me, players, Array.isArray(games) ? games : []);
      } else {
        document.getElementById('games').innerHTML =
          '<tbody><tr><td colspan="6">No games</td></tr></tbody>';
      }

    } catch (e) {
      if (token !== LOAD_TOKEN) return;
      console.error(e);
      document.getElementById('chart').textContent = 'Error: ' + e.message;
      document.getElementById('games').innerHTML =
        '<tbody><tr><td colspan="6">Error loading games</td></tr></tbody>';
      renderPlayerStats([]);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    // Set defaults for since buttons UI
    document.querySelectorAll('.range-btn').forEach(btn => {
      const v = btn.getAttribute('data-since');
      const isAll = !v;
      const isSelected = (isAll && !SINCE_YEAR) || (v && Number(v) === SINCE_YEAR);
      btn.classList.toggle('is-active', isSelected);
    });

    document.getElementById('agg').addEventListener('change', e => draw(e.target.value));

    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        const v = btn.getAttribute('data-since');
        SINCE_YEAR = v ? Number(v) : null;

        refreshView();
      });
    });

    wireNavLinks();
    load();
  });
</script>
</body>
</html>
