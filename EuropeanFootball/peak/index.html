<script src="../site-mappings.js"></script>
<script>
  const DATA_URL = '../data/teams.json';
  const COLOURS_URL = '../team-colours.json';
  const FLAGS_BASE = '../../flags';
  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

  const state = { rows: [], filtered: [], visibleCount: 100 };
  const histCache = new Map();

  let lastCompared = [];
  let TEAM_COLOURS = {};
  let COMPARE_SINCE_YEAR = null;
  let COMPARE_AGG_MODE = 'monthly';
  let compareVisibleSeries = [];

  const COUNTRY_FLAG_CODES = Object.assign({
    england:'gb-eng',spain:'es',italy:'it',germany:'de',france:'fr',portugal:'pt',
    netherlands:'nl',belgium:'be',austria:'at',turkey:'tr',scotland:'gb-sct',
    switzerland:'ch',greece:'gr',czechia:'cz',ukraine:'ua',poland:'pl',norway:'no',
    sweden:'se',romania:'ro',russia:'ru','bosnia and herzegovina':'ba',bulgaria:'bg',
    hungary:'hu',iceland:'is',israel:'il',luxembourg:'lu',malta:'mt','san marino':'sm',
    serbia:'rs',albania:'al',andorra:'ad',armenia:'am',azerbaijan:'az',belarus:'by',
    croatia:'hr',cyprus:'cy',estonia:'ee','faroe islands':'fo',finland:'fi',georgia:'ge',
    gibraltar:'gi',kazakhstan:'kz',kosovo:'xk',latvia:'lv',lithuania:'lt',moldova:'md',
    montenegro:'me','north macedonia':'mk','northern ireland':'gb-nir',
    'republic of ireland':'ie',slovakia:'sk',slovenia:'si',wales:'gb-wls'
  }, window.JR_COUNTRY_FLAG_CODES || {});

  function flagHtml(row) {
    const country = String(row.country || '').trim();
    const code = COUNTRY_FLAG_CODES[country.toLowerCase()];
    return code
      ? `<img src="${FLAGS_BASE}/${code}.svg" alt="${country}" title="${country}" class="flag-icon" loading="lazy">`
      : '';
  }

  function render() {
    const tbody = document.querySelector('#teams tbody');
    tbody.innerHTML = '';

    state.filtered.slice(0, state.visibleCount).forEach((r, i) => {
      const tr = document.createElement('tr');

      const tdRank = document.createElement('td');
      tdRank.textContent = i + 1;
      tr.appendChild(tdRank);

      const tdFlag = document.createElement('td');
      tdFlag.className = 'flag-cell';
      tdFlag.innerHTML = flagHtml(r);
      tr.appendChild(tdFlag);

      const tdName = document.createElement('td');
      const a = document.createElement('a');
      a.href = `../player/?id=${encodeURIComponent(r.id)}`;
      a.textContent = r.name;
      tdName.appendChild(a);
      tr.appendChild(tdName);

      const tdPeak = document.createElement('td');
      tdPeak.className = 'right';
      tdPeak.textContent = r.peak;
      tr.appendChild(tdPeak);

      const tdDate = document.createElement('td');
      tdDate.textContent = r.peak_date || '';
      tr.appendChild(tdDate);

      tbody.appendChild(tr);
    });

    const countEl = document.getElementById('count');
    if (countEl) countEl.textContent = state.filtered.length ? `(${state.filtered.length})` : '';
    const showMore = document.getElementById('show-more-teams');
    if (showMore) showMore.hidden = state.visibleCount >= state.filtered.length;
  }

  function hideCompare() {
    document.getElementById('compare-wrap').style.display = 'none';
    document.getElementById('compare-chart').innerHTML = '';
    lastCompared = [];
    compareVisibleSeries = [];
  }

  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const confederation = document.getElementById('confederation').value;
    const country = document.getElementById('country').value;
    const league = document.getElementById('league').value;

    state.filtered = state.rows.filter(r =>
      (!q || r.name.toLowerCase().includes(q)) &&
      (confederation === 'all' || (window.JR_COUNTRY_CONFEDERATIONS || {})[String(r.country || '').trim().toLowerCase()] === confederation) &&
      (country === 'all' || r.country === country) &&
      (league === 'all' || r.division === league)
    );

    state.visibleCount = 100;

    render();
    hideCompare();
  }

  function populateCountryFilter() {
    const select = document.getElementById('country');
    const current = select.value;
    const confederation = document.getElementById('confederation').value;
    const countries = [...new Set(state.rows
      .filter(r => confederation === 'all' || (window.JR_COUNTRY_CONFEDERATIONS || {})[String(r.country || '').trim().toLowerCase()] === confederation)
      .map(r => r.country).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b));
    select.innerHTML = '<option value="all">All</option>';
    for (const country of countries) {
      const option = document.createElement('option');
      option.value = country;
      option.textContent = country;
      select.appendChild(option);
    }
    select.value = countries.includes(current) ? current : 'all';
  }

  function populateConfederationFilter() {
    const select = document.getElementById('confederation');
    const current = select.value;
    const confederations = [...new Set(state.rows
      .map(r => (window.JR_COUNTRY_CONFEDERATIONS || {})[String(r.country || '').trim().toLowerCase()])
      .filter(Boolean))]
      .sort((a, b) => a.localeCompare(b));
    select.innerHTML = '<option value="all">All</option>';
    for (const confederation of confederations) {
      const option = document.createElement('option');
      option.value = confederation;
      option.textContent = confederation;
      select.appendChild(option);
    }
    select.value = confederations.includes(current) ? current : 'all';
  }

  function populateLeagueFilter() {
    const confederation = document.getElementById('confederation').value;
    const country = document.getElementById('country').value;
    const select = document.getElementById('league');
    const current = select.value;
    const leagues = [...new Set(state.rows
      .filter(r => confederation === 'all' || (window.JR_COUNTRY_CONFEDERATIONS || {})[String(r.country || '').trim().toLowerCase()] === confederation)
      .filter(r => country === 'all' || r.country === country)
      .map(r => r.division)
      .filter(Boolean))].sort((a, b) => a.localeCompare(b));
    select.innerHTML = '<option value="all">All</option>';
    for (const league of leagues) {
      const option = document.createElement('option');
      option.value = league;
      option.textContent = league;
      select.appendChild(option);
    }
    select.value = leagues.includes(current) ? current : 'all';
  }

  async function fetchHistoryFor(id) {
    if (histCache.has(id)) return histCache.get(id);

    try {
      const res = await fetch(`../data/history/${encodeURIComponent(id)}.json`, { cache: 'no-cache' });
      if (!res.ok) return null;

      const rows = await res.json();
      histCache.set(id, rows);
      return rows;
    } catch {
      return null;
    }
  }

  async function loadColours() {
    try {
      const res = await fetch(COLOURS_URL, { cache: 'no-cache' });
      if (!res.ok) {
        TEAM_COLOURS = {};
        return;
      }

      TEAM_COLOURS = await res.json();
    } catch {
      TEAM_COLOURS = {};
    }
  }

  function hexToRgb(hex) {
    const clean = String(hex || '').trim();
    const match = clean.match(/^#([0-9a-f]{6})$/i);
    if (!match) return null;

    const value = match[1];
    return {
      r: parseInt(value.slice(0, 2), 16),
      g: parseInt(value.slice(2, 4), 16),
      b: parseInt(value.slice(4, 6), 16)
    };
  }

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b]
      .map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'))
      .join('');
  }

  function relativeLuminance({ r, g, b }) {
    const toLinear = c => {
      const s = c / 255;
      return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    };

    const R = toLinear(r);
    const G = toLinear(g);
    const B = toLinear(b);

    return 0.2126 * R + 0.7152 * G + 0.0722 * B;
  }

  function mixWithWhite(rgb, amount) {
    return {
      r: rgb.r + (255 - rgb.r) * amount,
      g: rgb.g + (255 - rgb.g) * amount,
      b: rgb.b + (255 - rgb.b) * amount
    };
  }

  function getDisplayColour(teamName) {
    const fallback = '#2F80ED';
    const raw = TEAM_COLOURS[teamName] || fallback;
    const rgb = hexToRgb(raw);

    if (!rgb) return fallback;

    const lum = relativeLuminance(rgb);

    if (lum >= 0.05) return raw;

    const lifted = mixWithWhite(rgb, 0.45);
    return rgbToHex(lifted.r, lifted.g, lifted.b);
  }

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({
        x: p.x,
        y: +p.y,
        tier: Number.isFinite(+p.tier) ? +p.tier : null
      }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;

    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;

      lastKey = key;
    }

    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);

    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
        : `${d.getFullYear()}`;

      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastTier = pts.length ? (pts[pts.length - 1].tier ?? null) : null;
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;

      return { x, y: avg, tier: lastTier };
    });

    return normalise(out, false);
  }

  function applySinceFilter(series, sinceYear) {
    if (!sinceYear) return series;
    const start = new Date(`${sinceYear}-01-01T00:00:00Z`).getTime();
    return series.filter(p => new Date(p.x).getTime() >= start);
  }

  function labelStepForRange(y0, y1) {
    const span = Math.abs(y1 - y0);

    if (span <= 150) return 25;
    if (span <= 600) return 50;
    return 100;
  }

  function setCompareTickLabelsEvery(yMin, yMax, step) {
    const lo = Math.floor(yMin / step) * step;
    const hi = Math.ceil(yMax / step) * step;

    const vals = [];
    const text = [];

    for (let y = lo; y <= hi; y += step) {
      vals.push(y);
      text.push(String(y));
    }

    Plotly.relayout('compare-chart', {
      'yaxis.tickmode': 'array',
      'yaxis.tickvals': vals,
      'yaxis.ticktext': text
    });
  }

  function makeCompareYGridShapes(yMin, yMax, step) {
    if (!Number.isFinite(yMin) || !Number.isFinite(yMax) || !step) return [];

    const lo = Math.floor((yMin - 1) / step) * step;
    const hi = Math.ceil((yMax + 1) / step) * step;
    const shapes = [];

    for (let y = lo; y <= hi; y += step) {
      let width, color;

      if (step === 100) {
        width = 2.2;
        color = 'rgba(255,255,255,0.28)';
      } else if (step === 50) {
        width = 1.4;
        color = 'rgba(255,255,255,0.16)';
      } else {
        width = 1.0;
        color = 'rgba(255,255,255,0.08)';
      }

      shapes.push({
        type: 'line',
        xref: 'paper',
        x0: 0,
        x1: 1,
        yref: 'y',
        y0: y,
        y1: y,
        line: { width, color },
        layer: 'below'
      });
    }

    return shapes;
  }

  function adjustCompareYToVisible(x0, x1) {
    const lo = new Date(x0);
    const hi = new Date(x1);
    const values = [];

    for (const series of compareVisibleSeries) {
      for (const p of series) {
        const d = new Date(p.x);

        if (d >= lo && d <= hi && Number.isFinite(p.y)) {
          values.push(p.y);
        }
      }
    }

    if (!values.length) return;

    const min = Math.min(...values);
    const max = Math.max(...values);
    const pad = (max - min) * 0.12 || 10;

    const y0 = min - pad;
    const y1 = max + pad;
    const step = labelStepForRange(y0, y1);

    Plotly.relayout('compare-chart', {
      'yaxis.range': [y0, y1],
      'shapes': makeCompareYGridShapes(y0, y1, step)
    }).then(() => {
      setCompareTickLabelsEvery(y0, y1, step);
    });
  }

  async function buildComparison(teams) {
    lastCompared = teams.slice();

    const wrap = document.getElementById('compare-wrap');
    const chart = document.getElementById('compare-chart');
    const modeSel = document.getElementById('compare-agg');

    wrap.style.display = 'block';
    chart.innerHTML = '';

    const mode = modeSel ? modeSel.value : COMPARE_AGG_MODE;
    COMPARE_AGG_MODE = mode;

    const traceItems = [];
    compareVisibleSeries = [];

    let xmin = null;
    let xmax = null;
    let ymin = Infinity;
    let ymax = -Infinity;

    for (const t of teams) {
      const hist = await fetchHistoryFor(t.id);
      if (!hist || !hist.length) continue;

      const raw = hist.map(d => ({
        x: d.date,
        y: Number(d.rating),
        tier: Number(d.tier)
      }));

      const filtered = applySinceFilter(raw, COMPARE_SINCE_YEAR);
      const data = aggregate(filtered, mode);

      const xs = data.map(pt => pt.x);
      const ysAll = data.map(pt => pt.y);
      const ys = ysAll.filter(Number.isFinite);
      const tiers = data.map(pt => pt.tier ?? '');

      if (!xs.length || !ys.length) continue;

      compareVisibleSeries.push(data);

      let finalRating = -Infinity;

      for (const pt of data) {
        if (!pt.x || !Number.isFinite(pt.y)) continue;

        const d = new Date(pt.x);

        if (!xmin || d < xmin) xmin = d;
        if (!xmax || d > xmax) xmax = d;

        ymin = Math.min(ymin, pt.y);
        ymax = Math.max(ymax, pt.y);
        finalRating = pt.y;
      }

      traceItems.push({
        finalRating,
        trace: {
          type: 'scatter',
          name: t.name,
          x: xs,
          y: ysAll,
          customdata: tiers,
          mode: 'lines',
          line: {
            width: 4,
            shape: 'linear',
            color: getDisplayColour(t.name)
          },
          hovertemplate: '%{x}<br>%{y:.0f} Elo<br>Tier %{customdata}<extra>' + t.name + '</extra>',
          connectgaps: true
        }
      });
    }

    if (!traceItems.length) {
      chart.innerHTML = 'No history found.';
      return;
    }

    traceItems.sort((a, b) => b.finalRating - a.finalRating);

    const traces = traceItems.map(item => item.trace);

    const pad = (ymax - ymin) * 0.12 || 10;
    const y0 = ymin - pad;
    const y1 = ymax + pad;
    const step = labelStepForRange(y0, y1);

    const cs = getComputedStyle(document.body);

    const layout = {
      margin: { l: 60, r: 300, t: 10, b: 45 },

      xaxis: {
        type: 'date',
        showgrid: false
      },

      yaxis: {
        title: 'Rating',
        showgrid: false,
        zeroline: false,
        ticks: 'outside',
        ticklen: 4,
        tickmode: 'array',
        tickvals: [],
        ticktext: []
      },

      legend: {
        orientation: 'v',
        x: 1.02,
        xanchor: 'left',
        y: 1,
        yanchor: 'top',
        font: {
          size: 17,
          color: cs.color
        },
        itemwidth: 45,
        traceorder: 'normal'
      },

      paper_bgcolor: cs.backgroundColor,
      plot_bgcolor: cs.backgroundColor,
      font: { color: cs.color, size: 14 },
      shapes: makeCompareYGridShapes(y0, y1, step)
    };

    Plotly.newPlot(chart, traces, layout, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    }).then(() => {
      const gd = document.getElementById('compare-chart');

      if (xmin && xmax) {
        adjustCompareYToVisible(xmin.toISOString(), xmax.toISOString());
      }

      if (!gd._jrCompareHandlersAttached) {
        gd.on('plotly_relayout', ev => {
          const x0 = ev['xaxis.range[0]'] ?? (ev['xaxis.range'] && ev['xaxis.range'][0]);
          const x1 = ev['xaxis.range[1]'] ?? (ev['xaxis.range'] && ev['xaxis.range'][1]);

          if (x0 && x1) {
            adjustCompareYToVisible(x0, x1);
          }
        });

        gd._jrCompareHandlersAttached = true;
      }
    });
  }

  function resetCompareControls() {
    COMPARE_SINCE_YEAR = null;
    COMPARE_AGG_MODE = 'monthly';

    const compareAgg = document.getElementById('compare-agg');
    if (compareAgg) compareAgg.value = COMPARE_AGG_MODE;

    document.querySelectorAll('#compare-wrap .range-btn').forEach(btn => {
      btn.classList.toggle('is-active', btn.getAttribute('data-since') === '');
    });
  }

  function setupCompareButton() {
    const modal = document.getElementById('compare-modal');
    const listDiv = document.getElementById('compare-list');

    function openModal() {
      listDiv.innerHTML = '';

      state.filtered.forEach(t => {
        const id = `chk-${t.id}`;
        const row = document.createElement('div');

        row.innerHTML = `
          <label>
            <input type="checkbox" id="${id}" value="${t.id}" style="margin-right:6px">
            ${t.name} (${t.peak})
          </label>
        `;

        listDiv.appendChild(row);
      });

      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function showSelected() {
      const ids = Array.from(listDiv.querySelectorAll('input:checked')).map(cb => cb.value);

      if (!ids.length) {
        alert('Please select at least one team.');
        return;
      }

      closeModal();
      resetCompareControls();

      const chosen = state.filtered.filter(t => ids.includes(t.id));
      buildComparison(chosen);
    }

    document.getElementById('compare-btn').addEventListener('click', openModal);
    document.getElementById('compare-show-top').addEventListener('click', showSelected);
    document.getElementById('compare-close').addEventListener('click', closeModal);
  }

  function setupCompareChartControls() {
    document.getElementById('compare-agg').addEventListener('change', e => {
      COMPARE_AGG_MODE = e.target.value;
      if (lastCompared.length) buildComparison(lastCompared);
    });

    document.querySelectorAll('#compare-wrap .range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#compare-wrap .range-btn').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');

        const v = btn.getAttribute('data-since');
        COMPARE_SINCE_YEAR = v ? Number(v) : null;

        if (lastCompared.length) buildComparison(lastCompared);
      });
    });
  }

  async function load() {
    try {
      const res = await fetch(DATA_URL, { cache: 'no-cache' });
      if (!res.ok) throw new Error('Failed to load teams.json');

      const teams = await res.json();

      const baseRows = teams
        .filter(d => d && d.id && d.name)
        .map(d => ({
          id: d.id,
          name: d.name,
          country: d.country || '',
          division: d.division || ''
        }));

      const withPeaks = await Promise.all(baseRows.map(async (t) => {
        const hist = await fetchHistoryFor(t.id);
        if (!hist || !hist.length) return null;

        let peak = -Infinity;
        let peakDate = '';

        for (const row of hist) {
          const r = Number(row.rating);
          if (!Number.isFinite(r)) continue;

          if (r > peak) {
            peak = r;
            peakDate = row.date || '';
          }
        }

        if (!Number.isFinite(peak)) return null;

        return {
          id: t.id,
          name: t.name,
          country: t.country,
          division: t.division,
          peak: Math.round(peak),
          peak_date: peakDate
        };
      }));

      state.rows = withPeaks
        .filter(Boolean)
        .sort((a, b) => b.peak - a.peak || a.name.localeCompare(b.name));

      state.filtered = state.rows.slice();
      populateConfederationFilter();
      populateCountryFilter();
      populateLeagueFilter();
      render();
    } catch (err) {
      document.querySelector('#teams tbody').innerHTML =
        `<tr><td colspan="5">Error loading data: ${err.message}</td></tr>`;
    }
  }

  document.getElementById('q').addEventListener('input', applyFilter);
  document.getElementById('confederation').addEventListener('change', () => {
    populateCountryFilter();
    populateLeagueFilter();
    applyFilter();
  });
  document.getElementById('country').addEventListener('change', () => {
    populateLeagueFilter();
    applyFilter();
  });
  document.getElementById('league').addEventListener('change', applyFilter);
  document.getElementById('show-more-teams').addEventListener('click', () => {
    state.visibleCount += 100;
    render();
  });

  setupCompareButton();
  setupCompareChartControls();

  loadColours()
    .then(load)
    .catch(err => {
      console.error(err);
      load();
    });
</script>
</body>
</html>
