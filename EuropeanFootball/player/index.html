<body>

<main class="wrap">
  <section class="panel">

    <div class="header-row">
      <div class="toolbar">
        <div class="toolbar-stack">
          <div class="toolbar-top">
            <label for="agg">View:</label>
            <select id="agg">
              <option value="daily">Daily</option>
              <option value="monthly" selected>Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>

          <div class="range-buttons" role="group" aria-label="Time range">
            <button type="button" class="range-btn" data-since="">All</button>
            <button type="button" class="range-btn is-active" data-since="2000">Since 2000</button>

<script>
  const params = new URLSearchParams(location.search);
  const idRaw = params.get('id');

  if (!idRaw) {
    document.getElementById('chart').textContent = 'Missing team id.';
    throw new Error('no id');
  }

  const TEAMS_URL = '../data/teams.json';
  const HIST_URL = id => `../data/history/${encodeURIComponent(id)}.json`;
  const GAMES_URL = id => `../data/games/${encodeURIComponent(id)}.json`;
  const COLOURS_URL = '../team-colours.json';
  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

  let TEAM_COLOURS = {};
  let RAW = [];
  let CURRENT_TEAM = null;
  let SINCE_YEAR = 2000;
  let AGG_MODE = 'monthly';

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({
        x: p.x,
        y: +p.y,
        tier: Number.isFinite(+p.tier) ? +p.tier : null
      }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;

    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;

      lastKey = key;
    }

    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);

    for (const p of series) {
      const d = new Date(p.x);
      const key = mode === 'monthly'
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;

      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastTier = pts.length ? (pts[pts.length - 1].tier ?? null) : null;
      const x = k.length === 7 ? `${k}-01` : `${k}-01-01`;

      return { x, y: avg, tier: lastTier };
    });

    return normalise(out, false);
  }

  function applySinceFilter(series, sinceYear) {
    if (!sinceYear) return series;
    const start = new Date(`${sinceYear}-01-01T00:00:00Z`).getTime();
    return series.filter(p => new Date(p.x).getTime() >= start);
  }

  async function loadColours() {
    try {
      const res = await fetch(COLOURS_URL);
      if (!res.ok) return;
      TEAM_COLOURS = await res.json();
    } catch (e) {
      console.warn('Could not load team colours:', e);
    }
  }

  function hexToRgb(hex) {
    const clean = String(hex || '').trim();
    const match = clean.match(/^#([0-9a-f]{6})$/i);
    if (!match) return null;

    const value = match[1];
    return {
      r: parseInt(value.slice(0, 2), 16),
      g: parseInt(value.slice(2, 4), 16),
      b: parseInt(value.slice(4, 6), 16)
    };
  }

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b]
      .map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'))
      .join('');
  }

  function relativeLuminance({ r, g, b }) {
    const toLinear = c => {
      const s = c / 255;
      return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    };

    const R = toLinear(r);
    const G = toLinear(g);
    const B = toLinear(b);

    return 0.2126 * R + 0.7152 * G + 0.0722 * B;
  }

  function mixWithWhite(rgb, amount) {
    return {
      r: rgb.r + (255 - rgb.r) * amount,
      g: rgb.g + (255 - rgb.g) * amount,
      b: rgb.b + (255 - rgb.b) * amount
    };
  }

  function getDisplayColour(teamName) {
    const fallback = '#2F80ED';
    const raw = TEAM_COLOURS[teamName] || fallback;
    const rgb = hexToRgb(raw);

    if (!rgb) return fallback;

    const lum = relativeLuminance(rgb);

    if (lum >= 0.05) return raw;

    const lifted = mixWithWhite(rgb, 0.45);
    return rgbToHex(lifted.r, lifted.g, lifted.b);
  }

  function labelStepForRange(y0, y1) {
  const span = Math.abs(y1 - y0);

  if (span < 100) return 25;
  if (span < 300) return 50;

  return 100;
}

function makeYGridShapes(yMin, yMax, step) {
  if (!Number.isFinite(yMin) || !Number.isFinite(yMax) || !step) {
    return [];
  }

  const lo = Math.floor((yMin - 1) / step) * step;
  const hi = Math.ceil((yMax + 1) / step) * step;
  const shapes = [];

  for (let y = lo; y <= hi; y += step) {
    let width;
    let color;

    if (step === 100) {
      width = 2.2;
      color = 'rgba(255,255,255,0.28)';
    } else if (step === 50) {
      width = 1.4;
      color = 'rgba(255,255,255,0.16)';
    } else {
      width = 1.0;
      color = 'rgba(255,255,255,0.08)';
    }

    shapes.push({
      type: 'line',
      xref: 'paper',
      x0: 0,
      x1: 1,
      yref: 'y',
      y0: y,
      y1: y,
      line: { width, color }
    });
  }

  return shapes;
}

  function draw(mode) {
    AGG_MODE = mode;

    const el = document.getElementById('chart');

    if (el.textContent && el.textContent.includes('Loading')) {
      el.textContent = '';
    }

    const filtered = applySinceFilter(RAW, SINCE_YEAR);
    const data = aggregate(filtered, mode);

    const xs = data.map(p => p.x);
    const ysAll = data.map(p => p.y);
    const ys = ysAll.filter(Number.isFinite);
    const tiers = data.map(p => p.tier ?? '');

    if (!xs.length || !ys.length) {
      el.textContent = 'No games';
      return;
    }

const yMin = Math.min(...ys);
const yMax = Math.max(...ys);

const pad = (yMax - yMin) * 0.12 || 10;
const y0 = yMin - pad;
const y1 = yMax + pad;

const step = labelStepForRange(y0, y1);
const shapes = makeYGridShapes(y0, y1, step);


    const cs = getComputedStyle(document.body);
    const teamColour = getDisplayColour(CURRENT_TEAM?.name);

    const trace = {
      type: 'scatter',
      x: xs,
      y: ysAll,
      customdata: tiers,
      mode: 'lines',
line: {
  width: 4,
  shape: 'linear',
  color: teamColour
},
      hovertemplate: '%{x}<br>%{y:.0f} Elo<br>Tier %{customdata}<extra></extra>',
      connectgaps: true,
      showlegend: false
    };

    Plotly.newPlot('chart', [trace], {
      margin: { l: 60, r: 20, t: 10, b: 45 },
      xaxis: { type: 'date' },
yaxis: {
  title: 'Rating',
  range: [y0, y1],
  tick0: 0,
  dtick: step,
  showgrid: false,
  zeroline: false
},
      paper_bgcolor: cs.backgroundColor,
      plot_bgcolor: cs.backgroundColor,
      font: { color: cs.color, size: 14 },
      shapes
    }, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function getResultClassAndText(g, myName) {
    const isHome = g.home === myName;
    const isAway = g.away === myName;
    const raw = (g.result || '').trim();

    if (raw === '1-0') {
      return isHome ? { cls: 'win', text: 'Win' } : { cls: 'loss', text: 'Loss' };
    }

    if (raw === '0-1') {
      return isAway ? { cls: 'win', text: 'Win' } : { cls: 'loss', text: 'Loss' };
    }

    return { cls: 'draw', text: 'Draw' };
  }

  function getScoreParts(g, myName) {
    const score = String(g.score || '').trim();

    if (!score) {
      return {
        left: '',
        strong: '',
        right: ''
      };
    }

    const match = score.match(/^(\d+)-(\d+)(.*)$/);
    if (!match) {
      return {
        left: '',
        strong: score,
        right: ''
      };
    }

    const homeGoals = match[1];
    const awayGoals = match[2];
    const suffix = match[3] || '';

    const isHome = g.home === myName;
    const isAway = g.away === myName;

    if (isHome) {
      return {
        left: '',
        strong: homeGoals,
        right: `-${awayGoals}${suffix}`
      };
    }

    if (isAway) {
      return {
        left: `${homeGoals}-`,
        strong: awayGoals,
        right: suffix
      };
    }

    return {
      left: `${homeGoals}-`,
      strong: awayGoals,
      right: suffix
    };
  }

  function renderTeamCell(teamName, teams, myName) {
    const isProfileTeam = teamName === myName;
    const team = teams.find(t => t.name === teamName);

    if (team && team.id) {
      const a = document.createElement('a');
      a.href = `../player/?id=${encodeURIComponent(team.id)}`;
      a.textContent = teamName || '';

      if (isProfileTeam) {
        a.className = 'profile-team';
      }

      return a;
    }

    const span = document.createElement('span');
    span.textContent = teamName || '';

    if (isProfileTeam) {
      span.className = 'profile-team';
    }

    return span;
  }

  function renderWdlBar(g, myName) {
    const isHome = g.home === myName;
    const isAway = g.away === myName;

    if (!isHome && !isAway) {
      return document.createTextNode('');
    }

    const homeWin = Number(g.homeWinPct);
    const draw = Number(g.drawPct);
    const awayWin = Number(g.awayWinPct);

    if (
      !Number.isFinite(homeWin) ||
      !Number.isFinite(draw) ||
      !Number.isFinite(awayWin)
    ) {
      return document.createTextNode('');
    }

const win = isHome ? homeWin : awayWin;
const loss = isHome ? awayWin : homeWin;

let safeWin = Math.max(0, Math.round(win));
let safeDraw = Math.max(0, Math.round(draw));
let safeLoss = Math.max(0, Math.round(loss));

const total = safeWin + safeDraw + safeLoss;

if (total === 99) {
  const max = Math.max(safeWin, safeDraw, safeLoss);

  if (safeWin === max) safeWin += 1;
  else if (safeDraw === max) safeDraw += 1;
  else safeLoss += 1;
}

    const wrap = document.createElement('div');
    wrap.className = 'wdl-bar';
    wrap.title = `Win ${safeWin}% / Draw ${safeDraw}% / Loss ${safeLoss}%`;

    const winSeg = document.createElement('div');
    winSeg.className = 'wdl-seg wdl-win';
    winSeg.style.width = `${safeWin}%`;
    winSeg.innerHTML = `<span>${safeWin}%</span>`;

    const drawSeg = document.createElement('div');
    drawSeg.className = 'wdl-seg wdl-draw';
    drawSeg.style.width = `${safeDraw}%`;
    drawSeg.innerHTML = `<span>${safeDraw}%</span>`;

    const lossSeg = document.createElement('div');
    lossSeg.className = 'wdl-seg wdl-loss';
    lossSeg.style.width = `${safeLoss}%`;
    lossSeg.innerHTML = `<span>${safeLoss}%</span>`;

    wrap.appendChild(winSeg);
    wrap.appendChild(drawSeg);
    wrap.appendChild(lossSeg);

    return wrap;
  }

  function shortSeasonLabel(season) {
    const s = String(season || '').trim();
    const m = s.match(/^(\d{4})[\/-](\d{2,4})$/);

    if (!m) return s;

    const start = m[1].slice(2);
    const end = m[2].slice(-2);
    return `${start}/${end}`;
  }

  function competitionLabel(g) {
    const league = String(g.league || '').trim();
    const season = shortSeasonLabel(g.season);

    if (league && season) return `${league} ${season}`;
    return league || season || '';
  }

  function competitionBadgeClass(g) {
    const league = String(g.league || '').trim().toLowerCase();

    const classes = {
      'premier league': 'tier-premier-league',
      'championship': 'tier-championship',
      'league 1': 'tier-league-1',
      'league one': 'tier-league-1',
      'league 2': 'tier-league-2',
      'league two': 'tier-league-2',
      'national league': 'tier-national-league',

      'la liga': 'tier-la-liga',
      'segunda división': 'tier-segunda',
      'segunda division': 'tier-segunda',

      'serie a': 'tier-serie-a',
      'serie b': 'tier-serie-b',

      'bundesliga': 'tier-bundesliga',
      '2. bundesliga': 'tier-bundesliga-2',

      'ligue 1': 'tier-ligue-1',
      'ligue 2': 'tier-ligue-2',

      'primeira liga': 'tier-primeira-liga',
      'eredivisie': 'tier-eredivisie',
      'belgian pro league': 'tier-belgian-pro-league',
      'austrian bundesliga': 'tier-austrian-bundesliga',
      'süper lig': 'tier-super-lig',
      'super lig': 'tier-super-lig',
      'scottish premiership': 'tier-scottish-premiership',
      'swiss super league': 'tier-swiss-super-league',
      'super league greece': 'tier-super-league-greece',
      'czech first league': 'tier-czech-first-league',
      'ukrainian premier league': 'tier-ukrainian-premier-league',

      'champions league': 'tier-champions-league',
      'europa league': 'tier-europa-league',
      'conference league': 'tier-conference-league',

      'fa cup': 'tier-fa-cup',
      'efl cup': 'tier-efl-cup',
      'copa del rey': 'tier-copa-del-rey',
      'coppa italia': 'tier-coppa-italia',
      'dfb-pokal': 'tier-dfb-pokal',
      'coupe de france': 'tier-coupe-de-france'
    };

    return classes[league] || '';
  }

  function renderCompetitionBadge(g) {
    const span = document.createElement('span');
    span.className = `competition-badge ${competitionBadgeClass(g)}`.trim();
    span.textContent = competitionLabel(g);
    span.title = span.textContent;
    return span;
  }

  function renderUpcomingTable(me, teams, games) {
    const tbl = document.getElementById('upcomingGames');
    const title = document.getElementById('upcomingTitle');
    const wrap = document.getElementById('upcomingWrap');

    tbl.innerHTML = '';

    const myName = me.name;

    const rows = (Array.isArray(games) ? games : [])
      .filter(g =>
        g.upcoming === true &&
        (g.home === myName || g.away === myName)
      )
      .sort((a, b) => new Date(a.date) - new Date(b.date))
      .slice(0, 5);

    if (!rows.length) {
      title.style.display = 'none';
      wrap.style.display = 'none';
      return;
    }

    title.style.display = '';
    wrap.style.display = '';

    const thead = document.createElement('thead');
    const hr = document.createElement('tr');

    for (const h of ['Date', 'Competition', 'Home', 'Elo', 'Away', 'Elo', 'Expected W/D/L']) {
      const th = document.createElement('th');
      th.textContent = h;
      hr.appendChild(th);
    }

    thead.appendChild(hr);
    tbl.appendChild(thead);

    const panelBg = getComputedStyle(document.querySelector('.panel')).backgroundColor;
    thead.style.backgroundColor = panelBg;

    const tbody = document.createElement('tbody');

    for (const g of rows) {
      const homeElo = Number(g.homeElo);
      const awayElo = Number(g.awayElo);

      const tr = document.createElement('tr');

      const tdDate = document.createElement('td');
      tdDate.textContent = g.date || '';

      const tdCompetition = document.createElement('td');
      tdCompetition.appendChild(renderCompetitionBadge(g));

      const tdHome = document.createElement('td');
      tdHome.className = 'team-cell';
      tdHome.appendChild(renderTeamCell(g.home, teams, myName));

      const tdHomeElo = document.createElement('td');
      tdHomeElo.textContent = Number.isFinite(homeElo) ? String(Math.round(homeElo)) : '';

      const tdAway = document.createElement('td');
      tdAway.className = 'team-cell';
      tdAway.appendChild(renderTeamCell(g.away, teams, myName));

      const tdAwayElo = document.createElement('td');
      tdAwayElo.textContent = Number.isFinite(awayElo) ? String(Math.round(awayElo)) : '';

      const tdWdl = document.createElement('td');
      tdWdl.className = 'wdl-cell';
      tdWdl.appendChild(renderWdlBar(g, myName));

      tr.appendChild(tdDate);
      tr.appendChild(tdCompetition);
      tr.appendChild(tdHome);
      tr.appendChild(tdHomeElo);
      tr.appendChild(tdAway);
      tr.appendChild(tdAwayElo);
      tr.appendChild(tdWdl);

      tbody.appendChild(tr);
    }

    tbl.appendChild(tbody);
  }

  function renderGamesTable(me, teams, games) {
    const tbl = document.getElementById('games');
    tbl.innerHTML = '';

    const thead = document.createElement('thead');
    const hr = document.createElement('tr');

    for (const h of ['Date', 'Competition', 'Home', 'Elo', 'Away', 'Elo', 'Expected W/D/L', 'Score', 'Result', 'Δ']) {
      const th = document.createElement('th');
      th.textContent = h;
      hr.appendChild(th);
    }

    thead.appendChild(hr);
    tbl.appendChild(thead);

    const panelBg = getComputedStyle(document.querySelector('.panel')).backgroundColor;
    thead.style.backgroundColor = panelBg;

    const tbody = document.createElement('tbody');

    const rows = (Array.isArray(games) ? games : [])
      .filter(g => g.upcoming !== true)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    const myName = me.name;

    for (const g of rows) {
      const isHome = g.home === myName;
      const isAway = g.away === myName;
      if (!isHome && !isAway) continue;

      const homeElo = Number(g.homeElo);
      const awayElo = Number(g.awayElo);
      const numDelta = Number(g.delta);

      const tr = document.createElement('tr');

      const tdDate = document.createElement('td');
      tdDate.textContent = g.date || '';

      const tdCompetition = document.createElement('td');
      tdCompetition.appendChild(renderCompetitionBadge(g));

      const tdHome = document.createElement('td');
      tdHome.className = 'team-cell';
      tdHome.appendChild(renderTeamCell(g.home, teams, myName));

      const tdHomeElo = document.createElement('td');
      tdHomeElo.textContent = Number.isFinite(homeElo) ? String(Math.round(homeElo)) : '';

      const tdAway = document.createElement('td');
      tdAway.className = 'team-cell';
      tdAway.appendChild(renderTeamCell(g.away, teams, myName));

      const tdAwayElo = document.createElement('td');
      tdAwayElo.textContent = Number.isFinite(awayElo) ? String(Math.round(awayElo)) : '';

      const tdWdl = document.createElement('td');
      tdWdl.className = 'wdl-cell';
      tdWdl.appendChild(renderWdlBar(g, myName));

      const tdScore = document.createElement('td');
      tdScore.className = 'score';

      const scoreInfo = getScoreParts(g, myName);
      const scoreStrong = document.createElement('span');
      scoreStrong.className = 'score-strong';
      scoreStrong.textContent = scoreInfo.strong;

      tdScore.appendChild(document.createTextNode(scoreInfo.left));
      tdScore.appendChild(scoreStrong);
      tdScore.appendChild(document.createTextNode(scoreInfo.right));

      const tdResult = document.createElement('td');
      const r = getResultClassAndText(g, myName);
      tdResult.textContent = r.text;
      tdResult.className = 'result ' + r.cls;

      const tdDelta = document.createElement('td');
      if (!Number.isNaN(numDelta)) {
        tdDelta.textContent = g.delta;
        tdDelta.className = 'delta ' + (numDelta > 0 ? 'pos' : (numDelta < 0 ? 'neg' : 'zero'));
      } else {
        tdDelta.textContent = '';
      }

      tr.appendChild(tdDate);
      tr.appendChild(tdCompetition);
      tr.appendChild(tdHome);
      tr.appendChild(tdHomeElo);
      tr.appendChild(tdAway);
      tr.appendChild(tdAwayElo);
      tr.appendChild(tdWdl);
      tr.appendChild(tdScore);
      tr.appendChild(tdResult);
      tr.appendChild(tdDelta);

      tbody.appendChild(tr);
    }

    if (!tbody.children.length) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 10;
      td.textContent = 'No games';
      tr.appendChild(td);
      tbody.appendChild(tr);
    }

    tbl.appendChild(tbody);
  }

  function renderTeamStats(series) {
    const liveEl = document.getElementById('liveVal');
    const peakEl = document.getElementById('peakVal');

    if (!liveEl || !peakEl) return;

    if (!series || !series.length) {
      liveEl.textContent = '—';
      peakEl.textContent = '—';
      return;
    }

    const live = series[series.length - 1];
    liveEl.textContent = Number.isFinite(live.y) ? String(Math.round(live.y)) : '—';

    let peak = null;
    for (const p of series) {
      if (!Number.isFinite(p.y)) continue;
      if (!peak || p.y > peak.y) peak = p;
    }

    peakEl.textContent = peak ? String(Math.round(peak.y)) : '—';
  }

function refreshView() {
  const filtered = applySinceFilter(RAW, SINCE_YEAR);
  renderTeamStats(RAW);
  draw(AGG_MODE);
}

  async function load() {
    try {
      // Load the lightweight team registry first so the page title appears
      // immediately. History and games then load independently.
      const teamsRes = await fetch(TEAMS_URL);
      if (!teamsRes.ok) throw new Error('teams.json not found');

      const teams = await teamsRes.json();
      const me = teams.find(t => t.id === idRaw);

      if (!me) throw new Error('team id not in teams.json');

      CURRENT_TEAM = me;
      document.getElementById('pname').textContent = me.name;

      // Colours are optional and must never hold up the page.
      loadColours();

      // Start history and games in parallel, but render each as soon as its
      // own request completes.
      const historyPromise = fetch(HIST_URL(idRaw))
        .then(async histRes => {
          if (!histRes.ok) throw new Error('history not found');

          const histJson = await histRes.json();

          RAW = normalise(
            (Array.isArray(histJson) ? histJson : []).map(d => ({
              x: d.date,
              y: Number(d.rating),
              tier: Number(d.tier)
            })),
            true
          );

          const initialMode = 'monthly';
          AGG_MODE = initialMode;
          document.getElementById('agg').value = initialMode;

          if (!RAW.length) {
            document.getElementById('chart').textContent = 'No games';
            renderTeamStats([]);
          } else {
            refreshView();
          }
        })
        .catch(e => {
          console.error(e);
          document.getElementById('chart').textContent = 'Error loading history';
          renderTeamStats([]);
        });

      const gamesPromise = fetch(GAMES_URL(idRaw))
        .then(async gamesRes => {
          if (!gamesRes.ok) {
            document.getElementById('upcomingTitle').style.display = 'none';
            document.getElementById('upcomingWrap').style.display = 'none';

            const tbl = document.getElementById('games');
            tbl.innerHTML = '<tbody><tr><td colspan="10">No games</td></tr></tbody>';
            return;
          }

          const games = await gamesRes.json();
          const gameRows = Array.isArray(games) ? games : [];

          renderUpcomingTable(me, teams, gameRows);
          renderGamesTable(me, teams, gameRows);
        })
        .catch(e => {
          console.error(e);
          document.getElementById('upcomingTitle').style.display = 'none';
          document.getElementById('upcomingWrap').style.display = 'none';

          const tbl = document.getElementById('games');
          tbl.innerHTML = '<tbody><tr><td colspan="10">Error loading games</td></tr></tbody>';
        });

      document.getElementById('agg').addEventListener('change', e => {
        draw(e.target.value);
      });

      document.querySelectorAll('.range-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');

          const v = btn.getAttribute('data-since');
          SINCE_YEAR = v ? Number(v) : null;

          refreshView();
        });
      });

      await Promise.allSettled([historyPromise, gamesPromise]);

    } catch (e) {
      console.error(e);
      document.getElementById('chart').textContent = 'Error: ' + e.message;
      document.getElementById('upcomingTitle').style.display = 'none';
      document.getElementById('upcomingWrap').style.display = 'none';

      const tbl = document.getElementById('games');
      tbl.innerHTML = '<tbody><tr><td colspan="10">Error loading games</td></tr></tbody>';
    }
  }

  load();

</script>
