<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>J-Ratings: European Football Tournaments</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/EuropeanFootball/style.css">
  <style>
    .router-panel{max-width:720px;margin:40px auto;text-align:center}
    .router-status{margin-top:14px;opacity:.78}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a href="/EuropeanFootball/home/" class="brand-with-logo">
        <span>J-Ratings <span class="title-football">European Football</span></span>
      </a>
    </h1>
    <nav class="topnav" aria-label="Main">
      <a href="/index.html">Sports</a>
      <a href="/EuropeanFootball/home/">Home</a>
      <a href="/EuropeanFootball/compare/">Compare</a>
      <a href="/EuropeanFootball/peak/">Peak</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="panel router-panel">
    <h2>Tournament</h2>
    <div id="status" class="router-status">Loading tournament…</div>
  </section>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const statusEl = document.getElementById('status');
  const INDEX_URL = '/EuropeanFootball/data/tournaments/index.json';
  const EDITIONS_URL = id =>
    `/EuropeanFootball/data/tournaments/${encodeURIComponent(id)}/editions.json`;
  const STRUCTURE_URL = (id, edition) =>
    `/EuropeanFootball/data/tournament-structure/${encodeURIComponent(id)}/${encodeURIComponent(edition)}.json`;

  async function json(url){
    const res = await fetch(url,{cache:'no-cache'});
    if(!res.ok) throw new Error(`Could not load ${url}`);
    return res.json();
  }

  async function init(){
    try{
      let tournamentId = params.get('tournament');
      let editionId = params.get('edition');

      if(!tournamentId){
        const families = await json(INDEX_URL);
        if(!Array.isArray(families) || !families.length) throw new Error('No tournaments available');
        tournamentId = families[0].id;
      }

      if(!editionId){
        const editions = await json(EDITIONS_URL(tournamentId));
        if(!Array.isArray(editions) || !editions.length) throw new Error('No editions available');
        editionId = editions[0].id;
      }

      const structure = await json(STRUCTURE_URL(tournamentId, editionId));
      const renderer = String(structure.renderer || 'league').replaceAll('-', '_');

      if(renderer !== 'league') throw new Error(`Unsupported renderer: ${renderer}`);

      const next = new URL(`/EuropeanFootball/tournaments/${renderer}/`, location.origin);
      next.searchParams.set('tournament', tournamentId);
      next.searchParams.set('edition', editionId);
      location.replace(next.href);
    }catch(err){
      console.error(err);
      statusEl.textContent = err.message || 'Could not open tournament';
    }
  }
  init();
</script>
</body>
</html>
