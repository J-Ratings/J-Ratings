<script>
  const DATA_URL = '../data/teams.json';
  const ERA_STARTS_URL = '../data/era_starts.json';
  const META_URL = '../data/meta.json';
  const COLOURS_URL = '../team-colours.json';
  const FLAGS_BASE = '../../flags';

  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

  let TEAM_COLOURS = {};

  const LEGEND_FONT_SIZE = 16;
  const LEGEND_ITEM_GAP = 20;
  const AXIS_TITLE_SIZE = 18;
  const AXIS_TICK_SIZE = 18;

  const state = {
    mode: 'live',
    meta: null,
    liveRows: [],
    eraStarts: [],
    rows: [],
    filtered: []
  };

  const histCache = new Map();
  let lastCompared = [];
  let COMPARE_SINCE_YEAR = 2000;

  function updateHeaders() {
    const h = document.getElementById('rating-col-head');
    if (!h) return;
    h.textContent = (state.mode === 'live') ? 'Rating' : 'Start Elo';
  }

  function formatAsOf(iso) {
    const [y, m, d] = String(iso || '').split('-').map(Number);
    if (!y || !m || !d) return '';
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return `${d} ${months[m - 1]} ${y}`;
  }

  function setAsOfText() {
    const el = document.getElementById('asof');
    if (!el) return;

    if (state.mode === 'live' && state.meta && state.meta.asof) {
      el.style.display = 'block';
      el.textContent = `Updated to: ${formatAsOf(state.meta.asof)}`;
    } else {
      el.style.display = 'none';
      el.textContent = '';
    }
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normaliseFlagCode(code) {
    return String(code || '').trim().toLowerCase();
  }

  function flagImgHtml(flagCode, label) {
    const code = normaliseFlagCode(flagCode);
    if (!code) return '';
    const safeLabel = escapeHtml(label || '');
    return `<img src="${FLAGS_BASE}/${encodeURIComponent(code)}.svg" alt="${safeLabel}" title="${safeLabel}" class="flag-icon" loading="lazy">`;
  }

  function render() {
    const tbody = document.querySelector('#teams tbody');
    tbody.innerHTML = '';

    state.filtered.forEach((r, i) => {
      const tr = document.createElement('tr');

      const tdRank = document.createElement('td');
tdRank.textContent = r.rank;
tr.appendChild(tdRank);

      const tdFlag = document.createElement('td');
      tdFlag.className = 'flag-cell';
      tdFlag.innerHTML = flagImgHtml(r.flag, r.name);
      tr.appendChild(tdFlag);

      const tdName = document.createElement('td');
      const a = document.createElement('a');
      a.href = `../player/?id=${encodeURIComponent(r.id)}`;
      a.textContent = r.name;
      tdName.appendChild(a);
      tr.appendChild(tdName);

      const tdRt = document.createElement('td');
      tdRt.className = 'right';
      tdRt.textContent = Number.isFinite(+r.rating) ? Math.round(+r.rating) : '';
      tr.appendChild(tdRt);

      tbody.appendChild(tr); 
    });
  }

  function hideCompare() {
    document.getElementById('compare-wrap').style.display = 'none';
    document.getElementById('compare-chart').innerHTML = '';
    lastCompared = [];
  }

  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();

    state.filtered = !q
      ? state.rows.slice()
      : state.rows.filter(r => r.name.toLowerCase().includes(q));

    updateHeaders();
    render();
    hideCompare();
  }

  function rebuildRowsFromMode() {
    const mode = document.getElementById('era').value;
    state.mode = mode;

    if (mode === 'live') {
      state.rows = state.liveRows
        .slice()
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
    } else {
      state.rows = state.eraStarts
        .filter(d => String(d.era) === String(mode))
        .map(d => ({
          id: String(d.id),
          name: d.display_name || d.name,
          flag: d.flag || '',
          rating: +d.elo
        }))
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
    }

state.rows = state.rows.map((r, i) => ({
  ...r,
  rank: i + 1
}));

setAsOfText();
applyFilter();
  }

  function populateEraSelect() {
    const sel = document.getElementById('era');

    const eras = Array.from(new Set(
      state.eraStarts.map(d => d.era).filter(Boolean)
    )).sort((a, b) => {
      const an = Number(a);
      const bn = Number(b);
      if (Number.isFinite(an) && Number.isFinite(bn)) return bn - an;
      return String(b).localeCompare(String(a));
    });

    for (const e of eras) {
      const opt = document.createElement('option');
      opt.value = e;
      opt.textContent = e;
      sel.appendChild(opt);
    }
  }

  async function fetchHistoryFor(id) {
    const key = String(id);
    if (histCache.has(key)) return histCache.get(key);

    try {
      const res = await fetch(`../data/history/${encodeURIComponent(key)}.json`, { cache: 'no-cache' });
      if (!res.ok) return null;
      const rows = await res.json();
      histCache.set(key, rows);
      return rows;
    } catch {
      return null;
    }
  }

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({
        x: p.x,
        y: +p.y,
        tournament: p.tournament || ''
      }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;

    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;

      lastKey = key;
    }

    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);

    for (const p of series) {
      const d = new Date(p.x);
      const key = mode === 'monthly'
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;

      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastTournament = pts.length ? (pts[pts.length - 1].tournament || '') : '';
      const x = k.length === 7 ? `${k}-01` : `${k}-01-01`;

      return { x, y: avg, tournament: lastTournament };
    });

    return normalise(out, false);
  }

  function applySinceFilter(series, sinceYear) {
    if (!sinceYear) return series;
    const start = new Date(`${sinceYear}-01-01T00:00:00Z`).getTime();
    return series.filter(p => new Date(p.x).getTime() >= start);
  }

  function majorGridShapes(ymin, ymax) {
    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper',
        x0: 0,
        x1: 1,
        y0: v,
        y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }
    return shapes;
  }

  function hexToRgb(hex) {
    const clean = String(hex || '').trim();
    const match = clean.match(/^#([0-9a-f]{6})$/i);
    if (!match) return null;

    const value = match[1];
    return {
      r: parseInt(value.slice(0, 2), 16),
      g: parseInt(value.slice(2, 4), 16),
      b: parseInt(value.slice(4, 6), 16)
    };
  }

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b]
      .map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'))
      .join('');
  }

  function relativeLuminance({ r, g, b }) {
    const toLinear = c => {
      const s = c / 255;
      return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    };

    const R = toLinear(r);
    const G = toLinear(g);
    const B = toLinear(b);

    return 0.2126 * R + 0.7152 * G + 0.0722 * B;
  }

  function mixWithWhite(rgb, amount) {
    return {
      r: rgb.r + (255 - rgb.r) * amount,
      g: rgb.g + (255 - rgb.g) * amount,
      b: rgb.b + (255 - rgb.b) * amount
    };
  }

  function getDisplayColour(teamName) {
    const fallback = '#2F80ED';
    const raw = TEAM_COLOURS[teamName] || fallback;
    const rgb = hexToRgb(raw);

    if (!rgb) return fallback;

    const lum = relativeLuminance(rgb);

    if (lum >= 0.05) return raw;

    const lifted = mixWithWhite(rgb, 0.45);
    return rgbToHex(lifted.r, lifted.g, lifted.b);
  }

  async function buildComparison(teams) {
    lastCompared = teams.slice();

    const wrap = document.getElementById('compare-wrap');
    const chart = document.getElementById('compare-chart');
    const modeSel = document.getElementById('compare-agg');

    wrap.style.display = 'block';
    chart.innerHTML = 'Loading…';

    const mode = modeSel ? modeSel.value : 'monthly';

    const traces = [];
    let ymin = Infinity;
    let ymax = -Infinity;

    for (const t of teams) {
      const hist = await fetchHistoryFor(t.id);
      if (!hist || !hist.length) continue;

      const raw = normalise(
        hist.map(d => ({
          x: d.date,
          y: Number(d.rating),
          tournament: d.tournament || ''
        })),
        true
      );

      const filtered = applySinceFilter(raw, COMPARE_SINCE_YEAR);
      const data = aggregate(filtered, mode);

      const xs = data.map(pt => pt.x);
      const ysAll = data.map(pt => pt.y);
      const ys = ysAll.filter(Number.isFinite);
      const tournaments = data.map(pt => pt.tournament || '');

      if (!xs.length || !ys.length) continue;

      ymin = Math.min(ymin, ...ys);
      ymax = Math.max(ymax, ...ys);

      traces.push({
        type: 'scatter',
        name: t.name,
        x: xs,
        y: ysAll,
        customdata: tournaments,
        mode: 'lines',
        line: {
          width: 3,
          shape: 'linear',
          color: getDisplayColour(t.name)
        },
        hovertemplate: `%{x}<br>%{y:.0f} Elo${mode === 'daily' ? '<br>%{customdata}' : ''}<extra>${t.name}</extra>`,
        connectgaps: true,
        showlegend: true
      });
    }

    if (!traces.length) {
      chart.innerHTML = 'No history found.';
      return;
    }

    ymin = Math.floor(ymin / 100) * 100;
    ymax = Math.ceil(ymax / 100) * 100;

    const cs = getComputedStyle(document.body);

    Plotly.newPlot(chart, traces, {
      margin: { l: 60, r: 200, t: 10, b: 45 },
      xaxis: {
        type: 'date',
        title: { text: '', font: { size: AXIS_TITLE_SIZE } },
        tickfont: { size: AXIS_TICK_SIZE }
      },
      yaxis: {
        title: 'Rating',
        tickfont: { size: AXIS_TICK_SIZE }
      },
      legend: {
        x: 1.02,
        xanchor: 'left',
        y: 1,
        yanchor: 'top',
        font: { size: LEGEND_FONT_SIZE },
        tracegroupgap: LEGEND_ITEM_GAP,
        itemsizing: 'constant',
        bgcolor: 'rgba(0,0,0,0)',
        borderwidth: 0
      },
      paper_bgcolor: cs.backgroundColor,
      plot_bgcolor: cs.backgroundColor,
      font: { color: cs.color, size: 14 },
      shapes: majorGridShapes(ymin, ymax)
    }, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function setupCompareButton() {
    const modal = document.getElementById('compare-modal');
    const listDiv = document.getElementById('compare-list');

    function openModal() {
      listDiv.innerHTML = '';

      state.filtered.forEach(t => {
        const id = `chk-${t.id}`;
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `
          <label>
            <input type="checkbox" id="${id}" value="${t.id}" style="margin-right:6px">
            ${escapeHtml(t.name)} (${Math.round(t.rating)})
          </label>
        `;
        listDiv.appendChild(wrapper);
      });

      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function showSelected() {
      const selectedIds = Array.from(listDiv.querySelectorAll('input:checked')).map(cb => cb.value);

      if (!selectedIds.length) {
        alert('Please select at least one team.');
        return;
      }

      closeModal();

      const compareAgg = document.getElementById('compare-agg');
      if (compareAgg) compareAgg.value = 'monthly';

      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('is-active'));
      const defaultBtn = document.querySelector('.range-btn[data-since="2000"]');
      if (defaultBtn) defaultBtn.classList.add('is-active');
      COMPARE_SINCE_YEAR = 2000;

      const chosen = state.filtered.filter(t => selectedIds.includes(String(t.id)));
      buildComparison(chosen);
    }

    document.getElementById('compare-btn').addEventListener('click', openModal);
    document.getElementById('compare-show-top').addEventListener('click', showSelected);
  document.getElementById('compare-close').addEventListener('click', closeModal);
  }

  async function load() {
    try {
      const [teamsRes, eraRes, metaRes, coloursRes] = await Promise.all([
        fetch(DATA_URL, { cache: 'no-cache' }),
        fetch(ERA_STARTS_URL, { cache: 'no-cache' }),
        fetch(META_URL, { cache: 'no-cache' }),
        fetch(COLOURS_URL, { cache: 'no-cache' })
      ]);

      if (!teamsRes.ok) throw new Error('Failed to load teams.json');
      if (!eraRes.ok) throw new Error('Failed to load era_starts.json');
      if (!coloursRes.ok) throw new Error('Failed to load team-colours.json');

      const teamsData = await teamsRes.json();
      const eraData = await eraRes.json();
      TEAM_COLOURS = await coloursRes.json();
      state.meta = metaRes.ok ? await metaRes.json() : null;

      state.liveRows = (Array.isArray(teamsData) ? teamsData : [])
        .filter(d => d && d.id != null && (d.name || d.display_name) && Number.isFinite(+d.rating))
        .map(d => ({
          id: String(d.id),
          name: d.display_name || d.name,
          flag: d.flag || '',
          rating: +d.rating
        }))
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));

      state.eraStarts = Array.isArray(eraData)
        ? eraData.filter(d => d && d.id != null && (d.name || d.display_name) && d.era && Number.isFinite(+d.elo))
        : [];

      populateEraSelect();
      rebuildRowsFromMode();
    } catch (err) {
      const asofEl = document.getElementById('asof');
      if (asofEl) {
        asofEl.style.display = 'none';
        asofEl.textContent = '';
      }

      document.querySelector('#teams tbody').innerHTML =
        `<tr><td colspan="4">Error loading data: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  document.getElementById('compare-agg').addEventListener('change', () => {
    if (lastCompared.length) buildComparison(lastCompared);
  });

  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');

      const v = btn.getAttribute('data-since');
      COMPARE_SINCE_YEAR = v ? Number(v) : null;

      if (lastCompared.length) buildComparison(lastCompared);
    });
  });

  document.getElementById('era').addEventListener('change', rebuildRowsFromMode);
  document.getElementById('q').addEventListener('input', applyFilter);

  setupCompareButton();
  load();
</script>
</body>
</html>
