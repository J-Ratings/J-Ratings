<!doctype html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JXCC4EDPY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1JXCC4EDPY');
  </script>

  <meta charset="utf-8">
  <title>J-Ratings: International Football</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    #compare-chart { height: 500px; }

    .toolbar {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .compare-chart-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .asof {
      opacity: 0.8;
      font-size: 0.95rem;
      margin: 6px 0 12px 0;
      white-space: nowrap;
      padding-left: 12px;
    }

    .flag-cell {
      text-align: center;
      vertical-align: middle;
    }

    .flag-icon {
      width: 39.93px;
      height: 29.04px;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    #compare-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #compare-modal > div {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 80%;
      overflow: auto;
      color: #fff;
    }

    .compare-controls {
      margin: 10px 0;
    }

    .compare-controls button {
      margin-right: 10px;
    }

    footer.site-footer {
      margin-top: 24px;
      padding: 18px 0;
      border-top: 1px solid rgba(255,255,255,0.12);
      opacity: 0.9;
      font-size: 0.95rem;
      line-height: 1.6;
      text-align: center;
    }

    footer.site-footer a {
      color: inherit;
    }

    @media (max-width: 520px) {
      #teams {
        width: 100%;
        table-layout: fixed;
      }

      #teams th,
      #teams td {
        min-width: 0 !important;
        padding: 10px 8px;
      }

      #teams th:nth-child(1),
      #teams td:nth-child(1) { width: 52px; }

      #teams th:nth-child(2),
      #teams td:nth-child(2) { width: 44px; }

      #teams th:nth-child(4),
      #teams td:nth-child(4) { width: 84px; }

      #teams th:nth-child(3),
      #teams td:nth-child(3) { width: auto; }

      #teams td:nth-child(3) a {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="./" class="brand-with-logo">
        <span>J-Ratings <span class="title-football">International Football</span></span>
        <img src="/Football Banner Logo.png" alt="Football logo" class="sport-logo">
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="/index.html">Sports</a>
      <a id="nav-home" href="./" class="active-tab">Home</a>
      <a id="nav-compare" href="../compare/">Compare</a>
      <a id="nav-peak" href="../peak/">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="teams-panel">
    <h2>All teams</h2>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by team…">

      <label for="era" style="margin-left:auto">Era:</label>
      <select id="era">
        <option value="live" selected>Live</option>
      </select>

      <button id="compare-btn" class="club-btn" type="button">Compare</button>
    </div>

    <div id="asof" class="asof" aria-live="polite"></div>

    <div id="compare-wrap" style="display:none; padding:16px">
      <div class="compare-chart-toolbar">
        <label for="compare-agg">View:</label>
        <select id="compare-agg">
          <option value="daily">Daily</option>
          <option value="monthly" selected>Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>

      <div id="compare-chart">Loading…</div>
    </div>

    <div class="table-wrap">
      <table id="teams">
        <thead>
          <tr>
            <th style="min-width:60px">Rank</th>
            <th style="min-width:56px">Country</th>
            <th style="min-width:240px">Team</th>
            <th class="right" style="min-width:120px" id="rating-col-head">Rating</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <div id="compare-modal">
    <div>
      <h3>Select teams to view:</h3>
      <div class="compare-controls">
        <button id="compare-show-top">Show selected</button>
        <button id="compare-cancel-top">Cancel</button>
      </div>
      <div id="compare-list" style="margin:10px 0 20px 0;"></div>
      <div class="compare-controls">
        <button id="compare-show-bottom">Show selected</button>
        <button id="compare-cancel-bottom">Cancel</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div>Contact: <a href="mailto:jratingscontact@gmail.com">jratingscontact@gmail.com</a></div>
    <div>
      Data Source:
      <a href="https://www.kaggle.com/datasets/martj42/international-football-results-from-1872-to-2017" target="_blank" rel="noopener noreferrer">
        martj42 – International Football Results (1872–2017)
      </a>
    </div>
    <div>Licence: CC0 1.0 (Public Domain)</div>
  </footer>
</main>

<script>
  const DATA_URL = '../data/teams.json';
  const ERA_STARTS_URL = '../data/era_starts.json';
  const META_URL = '../data/meta.json';
  const COLOURS_URL = '../team-colours.json';
const FLAGS_BASE = '../../flags';


  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

  let TEAM_COLOURS = {};

  const LEGEND_FONT_SIZE = 16;
  const LEGEND_ITEM_GAP = 20;
  const AXIS_TITLE_SIZE = 18;
  const AXIS_TICK_SIZE = 18;

  const state = {
    mode: 'live',
    meta: null,
    liveRows: [],
    eraStarts: [],
    rows: [],
    filtered: []
  };

  const histCache = new Map();
  let lastCompared = [];

  function updateHeaders() {
    const h = document.getElementById('rating-col-head');
    if (!h) return;
    h.textContent = (state.mode === 'live') ? 'Rating' : 'Start Elo';
  }

  function formatAsOf(iso) {
    const [y, m, d] = String(iso || '').split('-').map(Number);
    if (!y || !m || !d) return '';
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d} ${months[m - 1]} ${y}`;
  }

  function setAsOfText() {
    const el = document.getElementById('asof');
    if (!el) return;

    if (state.mode === 'live' && state.meta && state.meta.asof) {
      el.style.display = 'block';
      el.textContent = `Updated to: ${formatAsOf(state.meta.asof)}`;
    } else {
      el.style.display = 'none';
      el.textContent = '';
    }
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normaliseFlagCode(code) {
    return String(code || '').trim().toLowerCase();
  }

  function flagImgHtml(flagCode, label) {
    const code = normaliseFlagCode(flagCode);
    if (!code) return '';
    const safeLabel = escapeHtml(label || '');
    return `<img src="${FLAGS_BASE}/${encodeURIComponent(code)}.svg" alt="${safeLabel}" title="${safeLabel}" class="flag-icon" loading="lazy">`;
  }

  function render() {
    const tbody = document.querySelector('#teams tbody');
    tbody.innerHTML = '';

    state.filtered.forEach((r, i) => {
      const tr = document.createElement('tr');

      const tdRank = document.createElement('td');
      tdRank.textContent = i + 1;
      tr.appendChild(tdRank);

      const tdFlag = document.createElement('td');
      tdFlag.className = 'flag-cell';
      tdFlag.innerHTML = flagImgHtml(r.flag, r.name);
      tr.appendChild(tdFlag);

      const tdName = document.createElement('td');
      const a = document.createElement('a');
      a.href = `../player/?id=${encodeURIComponent(r.id)}`;
      a.textContent = r.name;
      tdName.appendChild(a);
      tr.appendChild(tdName);

      const tdRt = document.createElement('td');
      tdRt.className = 'right';
      tdRt.textContent = Number.isFinite(+r.rating) ? Math.round(+r.rating) : '';
      tr.appendChild(tdRt);

      tbody.appendChild(tr);
    });
  }

  function hideCompare() {
    document.getElementById('compare-wrap').style.display = 'none';
    document.getElementById('compare-chart').innerHTML = '';
    lastCompared = [];
  }

  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();

    state.filtered = !q
      ? state.rows.slice()
      : state.rows.filter(r => r.name.toLowerCase().includes(q));

    updateHeaders();
    render();
    hideCompare();
  }

  function rebuildRowsFromMode() {
    const mode = document.getElementById('era').value;
    state.mode = mode;

    if (mode === 'live') {
      state.rows = state.liveRows
        .slice()
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
    } else {
      state.rows = state.eraStarts
        .filter(d => String(d.era) === String(mode))
        .map(d => ({
          id: String(d.id),
          name: d.display_name || d.name,
          flag: d.flag || '',
          rating: +d.elo
        }))
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
    }

    setAsOfText();
    applyFilter();
  }

  function populateEraSelect() {
    const sel = document.getElementById('era');

    const eras = Array.from(new Set(
      state.eraStarts.map(d => d.era).filter(Boolean)
    )).sort((a, b) => {
      const an = Number(a), bn = Number(b);
      if (Number.isFinite(an) && Number.isFinite(bn)) return bn - an;
      return String(b).localeCompare(String(a));
    });

    for (const e of eras) {
      const opt = document.createElement('option');
      opt.value = e;
      opt.textContent = e;
      sel.appendChild(opt);
    }
  }

  async function fetchHistoryFor(id) {
    const key = String(id);
    if (histCache.has(key)) return histCache.get(key);

    try {
      const res = await fetch(`../data/history/${encodeURIComponent(key)}.json`, { cache: 'no-cache' });
      if (!res.ok) return null;
      const rows = await res.json();
      histCache.set(key, rows);
      return rows;
    } catch {
      return null;
    }
  }

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({ x: p.x, y: +p.y, tournament: p.tournament || '' }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;

    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;
      lastKey = key;
    }

    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);

    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastTournament = pts.length ? (pts[pts.length - 1].tournament || '') : '';
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg, tournament: lastTournament };
    });

    return normalise(out, false);
  }

  function majorGridShapes(ymin, ymax) {
    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper',
        x0: 0,
        x1: 1,
        y0: v,
        y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }
    return shapes;
  }

  async function buildComparison(teams) {
    lastCompared = teams.slice();

    const wrap = document.getElementById('compare-wrap');
    const chart = document.getElementById('compare-chart');
    const modeSel = document.getElementById('compare-agg');

    wrap.style.display = 'block';
    chart.innerHTML = 'Loading…';

    const mode = modeSel ? modeSel.value : 'monthly';

    const traces = [];
    let ymin = Infinity;
    let ymax = -Infinity;

    for (const t of teams) {
      const hist = await fetchHistoryFor(t.id);
      if (!hist || !hist.length) continue;

      const raw = hist.map(d => ({
        x: d.date,
        y: Number(d.rating),
        tournament: d.tournament || ''
      }));

      const data = aggregate(raw, mode);

      const xs = data.map(pt => pt.x);
      const ys = data.map(pt => pt.y);
      const tournaments = data.map(pt => pt.tournament || '');

      if (!xs.length || !ys.length) continue;

      ymin = Math.min(ymin, ...ys);
      ymax = Math.max(ymax, ...ys);

      traces.push({
        type: 'scatter',
        name: t.name,
        x: xs,
        y: ys,
        customdata: tournaments,
        mode: 'lines',
        line: {
          width: 2,
          shape: 'linear',
          color: TEAM_COLOURS[t.name] || undefined
        },
        marker: { size: 0 },
        hovertemplate: (mode === 'daily')
          ? '%{x}<br>%{y:.0f} Elo<br>%{customdata}<extra>' + t.name + '</extra>'
          : '%{x}<br>%{y:.0f} Elo<extra>' + t.name + '</extra>',
        connectgaps: true
      });
    }

    if (!traces.length) {
      chart.innerHTML = 'No history found.';
      return;
    }

    ymin = Math.floor(ymin / 100) * 100;
    ymax = Math.ceil(ymax / 100) * 100;

    const cs = getComputedStyle(document.body);

    const layout = {
      margin: { l: 60, r: 200, t: 10, b: 50 },
      xaxis: {
        type: 'date',
        title: { text: '', font: { size: AXIS_TITLE_SIZE } },
        tickfont: { size: AXIS_TICK_SIZE }
      },
      yaxis: {
        title: { text: '', font: { size: AXIS_TITLE_SIZE } },
        tickfont: { size: AXIS_TICK_SIZE }
      },
      legend: {
        x: 1.02,
        xanchor: 'left',
        y: 1,
        yanchor: 'top',
        font: { size: LEGEND_FONT_SIZE },
        tracegroupgap: LEGEND_ITEM_GAP,
        itemsizing: 'constant',
        bgcolor: 'rgba(0,0,0,0)',
        borderwidth: 0
      },
      paper_bgcolor: cs.backgroundColor,
      plot_bgcolor: cs.backgroundColor,
      font: { color: cs.color },
      shapes: majorGridShapes(ymin, ymax)
    };

    Plotly.newPlot(chart, traces, layout, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function setupCompareButton() {
    const modal = document.getElementById('compare-modal');
    const listDiv = document.getElementById('compare-list');

    function openModal() {
      listDiv.innerHTML = '';

      state.filtered.forEach(t => {
        const id = `chk-${t.id}`;
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `
          <label>
            <input type="checkbox" id="${id}" value="${t.id}" style="margin-right:6px">
            ${escapeHtml(t.name)} (${Math.round(t.rating)})
          </label>
        `;
        listDiv.appendChild(wrapper);
      });

      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function showSelected() {
      const selectedIds = Array.from(listDiv.querySelectorAll('input:checked')).map(cb => cb.value);

      if (!selectedIds.length) {
        alert('Please select at least one team.');
        return;
      }

      closeModal();

      const compareAgg = document.getElementById('compare-agg');
      if (compareAgg) compareAgg.value = 'monthly';

      const chosen = state.filtered.filter(t => selectedIds.includes(String(t.id)));
      buildComparison(chosen);
    }

    document.getElementById('compare-btn').addEventListener('click', openModal);
    document.getElementById('compare-show-top').addEventListener('click', showSelected);
    document.getElementById('compare-show-bottom').addEventListener('click', showSelected);
    document.getElementById('compare-cancel-top').addEventListener('click', closeModal);
    document.getElementById('compare-cancel-bottom').addEventListener('click', closeModal);
  }

  async function load() {
    try {
      const [teamsRes, eraRes, metaRes, coloursRes] = await Promise.all([
        fetch(DATA_URL, { cache: 'no-cache' }),
        fetch(ERA_STARTS_URL, { cache: 'no-cache' }),
        fetch(META_URL, { cache: 'no-cache' }),
        fetch(COLOURS_URL, { cache: 'no-cache' })
      ]);

      if (!teamsRes.ok) throw new Error('Failed to load teams.json');
      if (!eraRes.ok) throw new Error('Failed to load era_starts.json');
      if (!coloursRes.ok) throw new Error('Failed to load team-colours.json');

      const teamsData = await teamsRes.json();
      const eraData = await eraRes.json();
      TEAM_COLOURS = await coloursRes.json();
      state.meta = metaRes.ok ? await metaRes.json() : null;

      state.liveRows = (Array.isArray(teamsData) ? teamsData : [])
        .filter(d => d && d.id != null && (d.name || d.display_name) && Number.isFinite(+d.rating))
        .map(d => ({
          id: String(d.id),
          name: d.display_name || d.name,
          flag: d.flag || '',
          rating: +d.rating
        }))
        .sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));

      state.eraStarts = Array.isArray(eraData)
        ? eraData.filter(d => d && d.id != null && (d.name || d.display_name) && d.era && Number.isFinite(+d.elo))
        : [];

      populateEraSelect();
      rebuildRowsFromMode();
    } catch (err) {
      const asofEl = document.getElementById('asof');
      if (asofEl) {
        asofEl.style.display = 'none';
        asofEl.textContent = '';
      }

      document.querySelector('#teams tbody').innerHTML =
        `<tr><td colspan="4">Error loading data: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  document.getElementById('compare-agg').addEventListener('change', () => {
    if (lastCompared.length) buildComparison(lastCompared);
  });

  document.getElementById('era').addEventListener('change', rebuildRowsFromMode);
  document.getElementById('q').addEventListener('input', applyFilter);

  setupCompareButton();
  load();
</script>
</body>
</html>
