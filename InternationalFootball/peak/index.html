<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="utf-8">
  <title>J-Ratings: International Football</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    #compare-chart { height: 500px; }

    .toolbar {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .flag-cell {
      text-align: center;
      vertical-align: middle;
    }

    .flag-icon {
      width: 39.93px;
      height: 29.04px;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    #compare-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #compare-modal > div {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 80%;
      overflow: auto;
      color: #fff;
    }

    .compare-controls { margin: 10px 0; }
    .compare-controls button { margin-right: 10px; }

    @media (max-width: 520px) {
      #teams {
        width: 100%;
        table-layout: fixed;
      }

      #teams th,
      #teams td {
        min-width: 0 !important;
        padding: 10px 8px;
      }

      #teams th:nth-child(1),
      #teams td:nth-child(1) { width: 52px; }

      #teams th:nth-child(2),
      #teams td:nth-child(2) { width: 44px; }

      #teams th:nth-child(4),
      #teams td:nth-child(4) { width: 78px; }

      #teams th:nth-child(5),
      #teams td:nth-child(5) { width: 92px; }

      #teams th:nth-child(3),
      #teams td:nth-child(3) { width: auto; }

      #teams td:nth-child(3) a {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 class="site-title">
      <a id="home-link" href="../home/" class="brand-with-logo">
        <span>J-Ratings <span class="title-football">International Football</span></span>
        <img src="/Football Banner Logo.png" alt="Football logo" class="sport-logo">
      </a>
    </h1>

    <nav class="topnav" aria-label="Main">
      <a href="/index.html">Sports</a>
      <a href="../home/">Home</a>
      <a href="../compare/">Compare</a>
      <a href="./" class="active-tab">Peak</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="teams-panel">
    <h2>Peak ratings</h2>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by team…">
      <span id="count" class="muted"></span>

      <button id="compare-btn" class="club-btn" type="button" style="margin-left:auto">Compare</button>
    </div>

    <div id="compare-wrap" style="display:none; padding:16px">
      <div id="compare-chart">Loading…</div>
    </div>

    <div class="table-wrap">
      <table id="teams">
        <thead>
          <tr>
            <th style="min-width:60px">Rank</th>
            <th style="min-width:56px">Country</th>
            <th style="min-width:240px">Team</th>
            <th class="right" style="min-width:120px">Peak</th>
            <th style="min-width:140px">Peak Date</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<div id="compare-modal">
  <div>
    <h3>Select teams to view:</h3>
    <div class="compare-controls">
      <button id="compare-show-top">Show Selected</button>
      <button id="compare-cancel-top">Cancel</button>
    </div>
    <div id="compare-list" style="margin:10px 0 20px 0;"></div>
    <div class="compare-controls">
      <button id="compare-show-bottom">Show Selected</button>
      <button id="compare-cancel-bottom">Cancel</button>
    </div>
  </div>
</div>

<script>
  const DATA_URL = '../data/teams.json';
  const COLOURS_URL = '../team-colours.json';
  const FLAGS_BASE = '../../flags';
  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;

  let TEAM_COLOURS = {};

  const LEGEND_FONT_SIZE = 16;
  const LEGEND_ITEM_GAP  = 20;
  const AXIS_TITLE_SIZE  = 18;
  const AXIS_TICK_SIZE   = 18;

  const state = { rows: [], filtered: [] };
  const histCache = new Map();
  let lastCompared = [];

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normaliseFlagCode(code) {
    return String(code || '').trim().toLowerCase();
  }

  function flagImgHtml(flagCode, label) {
    const code = normaliseFlagCode(flagCode);
    if (!code) return '';
    const safeLabel = escapeHtml(label || '');
    return `<img src="${FLAGS_BASE}/${encodeURIComponent(code)}.svg" alt="${safeLabel}" title="${safeLabel}" class="flag-icon" loading="lazy">`;
  }

  function render() {
    const tbody = document.querySelector('#teams tbody');
    tbody.innerHTML = '';

    state.filtered.forEach((r, i) => {
      const tr = document.createElement('tr');

      const tdRank = document.createElement('td');
      tdRank.textContent = i + 1;
      tr.appendChild(tdRank);

      const tdFlag = document.createElement('td');
      tdFlag.className = 'flag-cell';
      tdFlag.innerHTML = flagImgHtml(r.flag, r.name);
      tr.appendChild(tdFlag);

      const tdName = document.createElement('td');
      const a = document.createElement('a');
      a.href = `../player/?id=${encodeURIComponent(r.id)}`;
      a.textContent = r.name;
      tdName.appendChild(a);
      tr.appendChild(tdName);

      const tdPeak = document.createElement('td');
      tdPeak.className = 'right';
      tdPeak.textContent = r.peak;
      tr.appendChild(tdPeak);

      const tdDate = document.createElement('td');
      tdDate.textContent = r.peak_date || '';
      tr.appendChild(tdDate);

      tbody.appendChild(tr);
    });

    const countEl = document.getElementById('count');
    if (countEl) countEl.textContent = state.filtered.length ? `(${state.filtered.length})` : '';
  }

  function hideCompare() {
    document.getElementById('compare-wrap').style.display = 'none';
    document.getElementById('compare-chart').innerHTML = '';
    lastCompared = [];
  }

  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    state.filtered = q
      ? state.rows.filter(r => r.name.toLowerCase().includes(q))
      : state.rows.slice();
    render();
    hideCompare();
  }

  async function fetchHistoryFor(id) {
    const key = String(id);
    if (histCache.has(key)) return histCache.get(key);

    try {
      const res = await fetch(`../data/history/${encodeURIComponent(key)}.json`, { cache: 'no-cache' });
      if (!res.ok) return null;
      const rows = await res.json();
      histCache.set(key, rows);
      return rows;
    } catch {
      return null;
    }
  }

  function normalise(series, dedupeByDay = false) {
    const s = series
      .filter(p => p && p.x && Number.isFinite(p.y))
      .map(p => ({
        x: p.x,
        y: +p.y,
        tournament: p.tournament || ''
      }))
      .sort((a, b) => new Date(a.x) - new Date(b.x));

    if (!dedupeByDay) return s;

    const out = [];
    let lastKey = null;

    for (const p of s) {
      const d = new Date(p.x);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (key !== lastKey) out.push(p);
      else out[out.length - 1] = p;
      lastKey = key;
    }

    return out;
  }

  function aggregate(series, mode) {
    if (mode === 'daily') return normalise(series, true);

    const buckets = Object.create(null);

    for (const p of series) {
      const d = new Date(p.x);
      const key = (mode === 'monthly')
        ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
        : `${d.getFullYear()}`;
      (buckets[key] ||= []).push(p);
    }

    const out = Object.keys(buckets).sort().map(k => {
      const pts = buckets[k].filter(p => Number.isFinite(p.y));
      const avg = pts.reduce((a, b) => a + b.y, 0) / pts.length;
      const lastTournament = pts.length ? (pts[pts.length - 1].tournament || '') : '';
      const x = (k.length === 7) ? `${k}-01` : `${k}-01-01`;
      return { x, y: avg, tournament: lastTournament };
    });

    return normalise(out, false);
  }

  function majorGridShapes(ymin, ymax) {
    const shapes = [];
    for (let v = ymin; v <= ymax; v += 100) {
      shapes.push({
        type: 'line',
        xref: 'paper',
        x0: 0,
        x1: 1,
        y0: v,
        y1: v,
        line: { width: 1, color: 'rgba(128,128,128,0.35)' },
        layer: 'below'
      });
    }
    return shapes;
  }

  async function buildComparison(teams) {
    lastCompared = teams.slice();

    const wrap = document.getElementById('compare-wrap');
    const chart = document.getElementById('compare-chart');

    wrap.style.display = 'block';
    chart.innerHTML = 'Loading…';

    const mode = 'monthly';

    const traces = [];
    let ymin = Infinity;
    let ymax = -Infinity;

    for (const t of teams) {
      const hist = await fetchHistoryFor(t.id);
      if (!hist || !hist.length) continue;

      const raw = hist.map(d => ({
        x: d.date,
        y: Number(d.rating),
        tournament: d.tournament || ''
      }));

      const data = aggregate(raw, mode);

      const xs = data.map(pt => pt.x);
      const ys = data.map(pt => pt.y);
      const tournaments = data.map(pt => pt.tournament || '');

      if (!xs.length || !ys.length) continue;

      ymin = Math.min(ymin, ...ys);
      ymax = Math.max(ymax, ...ys);

      traces.push({
        type: 'scatter',
        name: t.name,
        x: xs,
        y: ys,
        customdata: tournaments,
        mode: 'lines',
        line: {
          width: 2,
          shape: 'linear',
          color: TEAM_COLOURS[t.name] || undefined
        },
        marker: { size: 0 },
        hovertemplate: '%{x}<br>%{y:.0f} Elo<extra>' + t.name + '</extra>',
        connectgaps: true
      });
    }

    if (!traces.length) {
      chart.innerHTML = 'No history found.';
      return;
    }

    ymin = Math.floor(ymin / 100) * 100;
    ymax = Math.ceil(ymax / 100) * 100;

    const cs = getComputedStyle(document.body);
    const layout = {
      margin: { l: 60, r: 200, t: 10, b: 50 },
      xaxis: {
        type: 'date',
        title: { text: '', font: { size: AXIS_TITLE_SIZE } },
        tickfont: { size: AXIS_TICK_SIZE }
      },
      yaxis: {
        title: { text: '', font: { size: AXIS_TITLE_SIZE } },
        tickfont: { size: AXIS_TICK_SIZE }
      },
      legend: {
        x: 1.02,
        xanchor: 'left',
        y: 1,
        yanchor: 'top',
        font: { size: LEGEND_FONT_SIZE },
        tracegroupgap: LEGEND_ITEM_GAP,
        itemsizing: 'constant',
        bgcolor: 'rgba(0,0,0,0)',
        borderwidth: 0
      },
      paper_bgcolor: cs.backgroundColor,
      plot_bgcolor: cs.backgroundColor,
      font: { color: cs.color },
      shapes: majorGridShapes(ymin, ymax)
    };

    Plotly.newPlot(chart, traces, layout, {
      staticPlot: IS_TOUCH,
      displayModeBar: false,
      responsive: true
    });
  }

  function setupCompareButton() {
    const modal = document.getElementById('compare-modal');
    const listDiv = document.getElementById('compare-list');

    function openModal() {
      listDiv.innerHTML = '';

      state.filtered.forEach(t => {
        const id = `chk-${t.id}`;
        const row = document.createElement('div');
        row.innerHTML = `
          <label>
            <input type="checkbox" id="${id}" value="${t.id}" style="margin-right:6px">
            ${escapeHtml(t.name)} (${t.peak})
          </label>
        `;
        listDiv.appendChild(row);
      });

      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function showSelected() {
      const ids = Array.from(listDiv.querySelectorAll('input:checked')).map(cb => cb.value);
      if (!ids.length) {
        alert('Please select at least one team.');
        return;
      }

      closeModal();

      const chosen = state.filtered.filter(t => ids.includes(String(t.id)));
      buildComparison(chosen);
    }

    document.getElementById('compare-btn').addEventListener('click', openModal);
    document.getElementById('compare-show-top').addEventListener('click', showSelected);
    document.getElementById('compare-show-bottom').addEventListener('click', showSelected);
    document.getElementById('compare-cancel-top').addEventListener('click', closeModal);
    document.getElementById('compare-cancel-bottom').addEventListener('click', closeModal);
  }

  async function load() {
    try {
      const [teamsRes, coloursRes] = await Promise.all([
        fetch(DATA_URL, { cache: 'no-cache' }),
        fetch(COLOURS_URL, { cache: 'no-cache' })
      ]);

      if (!teamsRes.ok) throw new Error('Failed to load teams.json');
      if (!coloursRes.ok) throw new Error('Failed to load team-colours.json');

      const teams = await teamsRes.json();
      TEAM_COLOURS = await coloursRes.json();

      const baseRows = teams
        .filter(d => d && d.id && d.name)
        .map(d => ({
          id: String(d.id),
          name: d.display_name || d.name,
          flag: d.flag || ''
        }));

      const withPeaks = await Promise.all(baseRows.map(async (t) => {
        const hist = await fetchHistoryFor(t.id);
        if (!hist || !hist.length) return null;

        let peak = -Infinity;
        let peakDate = '';

        for (const row of hist) {
          const r = Number(row.rating);
          if (!Number.isFinite(r)) continue;
          if (r > peak) {
            peak = r;
            peakDate = row.date || '';
          }
        }

        if (!Number.isFinite(peak)) return null;

        return {
          id: t.id,
          name: t.name,
          flag: t.flag,
          peak: Math.round(peak),
          peak_date: peakDate
        };
      }));

      state.rows = withPeaks
        .filter(Boolean)
        .sort((a, b) => b.peak - a.peak || a.name.localeCompare(b.name));

      state.filtered = state.rows.slice();
      render();
    } catch (err) {
      document.querySelector('#teams tbody').innerHTML =
        `<tr><td colspan="5">Error loading data: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  document.getElementById('q').addEventListener('input', applyFilter);
  setupCompareButton();
  load();
</script>
</body>
</html>
